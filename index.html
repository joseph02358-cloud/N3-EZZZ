hilangkan に pada ように menjadi よう.\n※ Sering diikuti dengan kata kerja :\n・言う\n・頼む\n・お願いする\n・注意する\n・指示する\n・命令する", "penjelasan": "menyampaikan permintaan, perintah, larangan, saran, atau himbauan dari seseorang tanpa mengutip kata-katanya secara langsung.", "tips": "mirip dengan Partikel と atau Bunpou って yang berfungsi untuk mengutip perkataan dari seseorang, hanya saja pada bunpou ように kata-kata dari orang lain tidak disampaikan secara mentah-mentah.\nContoh untuk memahami perbedaan :\n先生：「静かにしてください！」\n→ Sensei : \"Tolong jangan berisik!\"\n\nKalau situasi di atas dijelaskan pakai と atau って :\n先生に「静かにしてください！」と注意された。\n→ Sensei menegur saya dengan mengatakan \"Tolong jangan berisik!\"\n\nKalau situasi di atas dijelaskan dengan ように :\n先生に静かにするように注意された。\n→ Saya ditegur sensei agar jangan berisik.", "examples": [{"jp": "<ruby>雑誌<rt>ざっし</rt></ruby>を<ruby>買<rt>か</rt></ruby>ってくるように<ruby>頼<rt>たの</rt></ruby>まれた。", "id": "Saya diminta untuk membeli majalah."}, {"jp": "<ruby>電車<rt>でんしゃ</rt></ruby>の<ruby>中<rt>なか</rt></ruby>では<ruby>携帯<rt>けいたい</rt></ruby><ruby>電話<rt>でんわ</rt></ruby>で<ruby>話<rt>はな</rt></ruby>さないようにと<ruby>注意<rt>ちゅうい</rt></ruby>された。", "id": "Saya diperingatkan agar tidak berbicara menggunakan ponsel di dalam kereta."}, {"jp": "<ruby>子<rt>こ</rt></ruby>どもに<ruby>早<rt>はや</rt></ruby>く<ruby>寝<rt>ね</rt></ruby>るように<ruby>言<rt>い</rt></ruby>った。", "id": "Saya menyuruh anak-anak untuk tidur lebih awal."}, {"jp": "<ruby>先生<rt>せんせい</rt></ruby>に<ruby>宿題<rt>しゅくだい</rt></ruby>を<ruby>忘<rt>わす</rt></ruby>れないように<ruby>注意<rt>ちゅうい</rt></ruby>された。", "id": "Saya diperingatkan oleh guru agar tidak lupa PR."}, {"jp": "<ruby>母<rt>はは</rt></ruby>に<ruby>野菜<rt>やさい</rt></ruby>をちゃんと<ruby>食<rt>た</rt></ruby>べるように<ruby>言<rt>い</rt></ruby>われた。", "id": "Saya disuruh ibu agar makan sayur dengan benar."}, {"jp": "<ruby>彼<rt>かれ</rt></ruby>にもっと<ruby>早<rt>はや</rt></ruby>く<ruby>来<rt>く</rt></ruby>るよう<ruby>頼<rt>たの</rt></ruby>んだ。", "id": "Saya meminta dia untuk datang lebih awal."}, {"jp": "<ruby>医者<rt>いしゃ</rt></ruby>にお<ruby>酒<rt>さけ</rt></ruby>を<ruby>控<rt>ひか</rt></ruby>えるように<ruby>注意<rt>ちゅうい</rt></ruby>された。", "id": "Dokter memperingatkan saya untuk mengurangi minum alkohol."}, {"jp": "<ruby>母<rt>はは</rt></ruby>からのメールには、もっと<ruby>勉強<rt>べんきょう</rt></ruby>するようにと<ruby>書<rt>か</rt></ruby>いてありました。", "id": "Dalam email dari ibu tertulis agar saya belajar lebih giat."}, {"jp": "<ruby>私<rt>わたし</rt></ruby>は<ruby>医者<rt>いしゃ</rt></ruby>に、<ruby>今日<rt>きょう</rt></ruby>はお<ruby>風呂<rt>ふろ</rt></ruby>に<ruby>入<rt>はい</rt></ruby>らないようにと<ruby>言<rt>い</rt></ruby>われました。", "id": "Dokter bilang pada saya untuk tidak mandi hari ini."}, {"jp": "<ruby>母<rt>はは</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>に、もっと<ruby>勉強<rt>べんきょう</rt></ruby>するように<ruby>言<rt>い</rt></ruby>いました。", "id": "Ibu menyuruh saya untuk belajar lebih giat."}], "jlpt": []}, {"id": 81, "title": "81. ようにします (akan berusaha untuk)", "rumus": "Kata Kerja - VKamus\nKata Kerja - Vない", "penjelasan": "menyatakan usaha untuk melakukan sesuatu, atau keputusan untuk mulai membiasakan diri.", "tips": "sering digunakan untuk menyuruh seseorang agar berusaha melakukan sesuatu sebagai kebiasaan, dengan cara menggabungkan ようにする dengan てください menjadi \"ようにしてください\".", "examples": [{"jp": "これから<ruby>毎日<rt>まいにち</rt></ruby>ラジオでニュースを<ruby>聞<rt>き</rt></ruby>くようにします。", "id": "Mulai sekarang saya akan berusaha mendengarkan berita di radio setiap hari."}, {"jp": "<ruby>悪<rt>わる</rt></ruby>い<ruby>言葉<rt>ことば</rt></ruby>は<ruby>使<rt>つか</rt></ruby>わないようにしましょう。", "id": "Mari kita usahakan untuk tidak menggunakan kata-kata buruk."}, {"jp": "これから<ruby>毎日<rt>まいにち</rt></ruby>", "id": "１"}, {"jp": "<ruby>時間<rt>じかん</rt></ruby>くらい<ruby>歩<rt>ある</rt></ruby>くようにします。", "id": "Mulai sekarang saya akan berusaha berjalan kaki sekitar satu jam setiap hari."}, {"jp": "もっと<ruby>野菜<rt>やさい</rt></ruby>を<ruby>食<rt>た</rt></ruby>べるようにする。", "id": "Saya akan berusaha makan lebih banyak sayur."}, {"jp": "<ruby>夜<rt>よる</rt></ruby>は<ruby>早<rt>はや</rt></ruby>く<ruby>寝<rt>ね</rt></ruby>るようにします。", "id": "Saya akan berusaha tidur lebih awal di malam hari."}, {"jp": "<ruby>部屋<rt>へや</rt></ruby>を<ruby>毎日<rt>まいにち</rt></ruby><ruby>掃除<rt>そうじ</rt></ruby>するようにします。", "id": "Saya akan berusaha membersihkan kamar setiap hari."}, {"jp": "<ruby>甘<rt>あま</rt></ruby>いものを<ruby>食<rt>た</rt></ruby>べないようにした。", "id": "Saya (mulai) berusaha untuk tidak makan makanan manis."}], "jlpt": []}, {"id": 82, "title": "82. ようになります (menjadi bisa; menjadi)", "rumus": "Kata Kerja - VPotensial (dari tidak bisa menjadi bisa)\nKata Kerja - VKamus (kebiasaan baru untuk melakukan)\nKata Kerja - Vない (kebiasaan baru untuk tidak melakukan)", "penjelasan": "menyatakan perubahan, dari yang sebelumnya tidak bisa menjadi bisa, atau perubahan kebiasaan.", "tips": "sering dipakai untuk menunjukkan perubahan kemampuan atau kebiasaan baru.", "examples": [{"jp": "<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>上手<rt>じょうず</rt></ruby>に<ruby>話<rt>はな</rt></ruby>せるようになりたいです。", "id": "Saya ingin bisa berbicara bahasa Jepang dengan lancar."}, {"jp": "うちの<ruby>庭<rt>にわ</rt></ruby>に<ruby>鳥<rt>とり</rt></ruby>が<ruby>来<rt>く</rt></ruby>るようになりました。", "id": "Sekarang burung-burung mulai datang ke halaman rumah kami."}, {"jp": "<ruby>毎日<rt>まいにち</rt></ruby><ruby>日本<rt>にほん</rt></ruby>のテレビを<ruby>見<rt>み</rt></ruby>たら、<ruby>日本人<rt>にほんじん</rt></ruby>の<ruby>話<rt>はなし</rt></ruby>がわかるようになりますか。", "id": "Kalau menonton TV Jepang setiap hari, apakah akan bisa mengerti pembicaraan orang Jepang?"}, {"jp": "<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>新聞<rt>しんぶん</rt></ruby>が<ruby>読<rt>よ</rt></ruby>めるようになりました。", "id": "Saya sudah bisa membaca koran berbahasa Jepang."}, {"jp": "<ruby>病気<rt>びょうき</rt></ruby>が<ruby>治<rt>なお</rt></ruby>って、また<ruby>走<rt>はし</rt></ruby>れるようになった。", "id": "Setelah sembuh, saya jadi bisa lari lagi."}, {"jp": "<ruby>一人<rt>ひとり</rt></ruby>で<ruby>料理<rt>りょうり</rt></ruby>ができるようになった。", "id": "Saya sudah bisa masak sendiri."}, {"jp": "<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>話<rt>はな</rt></ruby>せるようになりました。", "id": "Saya sudah bisa berbicara dalam bahasa Jepang."}, {"jp": "たばこを<ruby>吸<rt>す</rt></ruby>わないようになった。", "id": "Saya berhenti merokok / Saya sekarang tidak merokok lagi."}, {"jp": "<ruby>前<rt>まえ</rt></ruby>より<ruby>早<rt>はや</rt></ruby>く<ruby>起<rt>お</rt></ruby>きるようになりました。", "id": "Dibanding dulu, sekarang saya jadi bangun lebih pagi."}, {"jp": "<ruby>甘<rt>あま</rt></ruby>い<ruby>物<rt>もの</rt></ruby>を<ruby>食<rt>た</rt></ruby>べないようになった。", "id": "Saya tidak makan makanan manis lagi sekarang."}], "jlpt": []}, {"id": 83, "title": "83. と (kalau A... pasti B...)", "rumus": "Kata Kerja - VKamus dan Vない\nKata Sifat i - ✅\nKata Sifat na - ＋だ\nKata Benda - ＋だ", "penjelasan": "menyatakan akibat alami atau otomatis yang pasti terjadi setelah sesuatu (A) dilakukan.", "tips": "", "examples": [{"jp": "このボタンを<ruby>押<rt>お</rt></ruby>すと、<ruby>水<rt>みず</rt></ruby>が<ruby>出<rt>で</rt></ruby>ます。", "id": "Kalau tombol ini ditekan, (pasti) akan keluar air."}, {"jp": "この<ruby>道<rt>みち</rt></ruby>をまっすぐ<ruby>行<rt>い</rt></ruby>くと、<ruby>駅<rt>えき</rt></ruby>に<ruby>着<rt>つ</rt></ruby>きます。", "id": "Kalau kamu lurus di jalan ini, kamu akan sampai di stasiun."}, {"jp": "<ruby>夜<rt>よる</rt></ruby><ruby>遅<rt>おそ</rt></ruby>く<ruby>寝<rt>ね</rt></ruby>ると、<ruby>朝<rt>あさ</rt></ruby><ruby>起<rt>お</rt></ruby>きるのがつらくなります。", "id": "Kalau tidur larut malam, bangun pagi jadi susah."}], "jlpt": []}, {"id": 84, "title": "84. ば (kalau A... maka B...)", "rumus": "Kata Kerja - Vば\nKata Sifat i - ければ\nKata Sifat na - ＋なら atau ＋であれば\nKata Benda - ＋なら atau ＋であれば", "penjelasan": "menyatakan jika syarat A terjadi, maka pembicara akan melakukan B.", "tips": "berbeda dengan 〜と, kalimat B tidak pasti karena bisa berubah sesuai dengan keinginan subjek.\nsedangkan pada と subjek tidak punya kuasa untuk mengubah hasil pada kalimat B.", "examples": [{"jp": "<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>れば、<ruby>行<rt>い</rt></ruby>きません。", "id": "Kalau hujan, saya tidak pergi."}, {"jp": "<ruby>安<rt>やす</rt></ruby>ければ、<ruby>買<rt>か</rt></ruby>いたいです。", "id": "Kalau murah, saya mau beli."}], "jlpt": []}, {"id": 85, "title": "85. たら (kalau A... maka B...)", "rumus": "Kata Kerja - Vた ＋ら\nKata Sifat i - かったら\nKata Sifat na - ＋だったら\nKata Benda - ＋だったら", "penjelasan": "menyatakan pengandaian: kalau A terjadi, maka B.", "tips": "bisa menggantikan と atau ば, tapi lebih condong ke fungsi ば.", "examples": [{"jp": "もし<ruby>水<rt>みず</rt></ruby>がなかったら、<ruby>私<rt>わたし</rt></ruby>たちは<ruby>生<rt>い</rt></ruby>きられません。", "id": "Kalau tidak ada air, kita tidak bisa hidup."}, {"jp": "<ruby>時間<rt>じかん</rt></ruby>があったら、<ruby>手伝<rt>てつだ</rt></ruby>ってください。", "id": "Kalau ada waktu, tolong bantu saya."}], "jlpt": []}, {"id": 86, "title": "86. たら (setelah A... akan B...)", "rumus": "Kata Kerja - Vた ＋ら", "penjelasan": "setelah melakukan A, saya akan melakukan B", "tips": "", "examples": [{"jp": "<ruby>家<rt>いえ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>ったら、すぐシャワーを<ruby>浴<rt>あ</rt></ruby>びます。", "id": "Setelah pulang ke rumah, saya langsung mandi."}, {"jp": "<ruby>駅<rt>えき</rt></ruby>に<ruby>着<rt>つ</rt></ruby>いたら、<ruby>電話<rt>でんわ</rt></ruby>してください。", "id": "Setelah sampai di stasiun, tolong telepon saya."}], "jlpt": []}, {"id": 87, "title": "87. なら (kalau A... sebaiknya B...)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ✅\nKata Benda - ✅", "penjelasan": "memberikan saran", "tips": "", "examples": [{"jp": "<ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>くなら、<ruby>京都<rt>きょうと</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったほうがいいよ。", "id": "Kalau kamu mau ke Jepang, sebaiknya pergi ke Kyoto."}, {"jp": "<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>るなら、<ruby>夜<rt>よる</rt></ruby>のほうが<ruby>空<rt>あ</rt></ruby>いています。", "id": "Kalau mau nonton film, malam hari lebih sepi."}], "jlpt": []}, {"id": 88, "title": "88. なら (kalau A... maka aku akan B...)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ✅\nKata Benda - ✅", "penjelasan": "respon terhadap informasi/situasi, atau penilaian berdasarkan topik yang disebut sebelumnya.", "tips": "", "examples": [{"jp": "<ruby>彼<rt>かれ</rt></ruby>が<ruby>行<rt>い</rt></ruby>くなら、<ruby>私<rt>わたし</rt></ruby>も<ruby>行<rt>い</rt></ruby>きます。", "id": "Kalau dia pergi, (maka) saya juga akan pergi."}, {"jp": "「このパソコン、<ruby>安<rt>やす</rt></ruby>いですよ。」「<ruby>安<rt>やす</rt></ruby>いなら、<ruby>買<rt>か</rt></ruby>います。」", "id": "\"Laptop ini murah, lho.\" \"Kalau murah, aku akan beli.\""}], "jlpt": []}, {"id": 89, "title": "89. と...た たら...た (begitu melakukan A, ternyata ada B yang sudah terjadi)", "rumus": "Kata Kerja - VKamus ＋と ／ Vたら\n＋ Bentuk lampau ／ Vていた", "penjelasan": "setelah tindakan A dilakukan, subjek menemukan kejadian B yang sudah terjadi sebelum subjek melakukan tindakan A.", "tips": "bunpou ini selalu diakhiri dengan Vた karena merupakan kejadian yang sudah terjadi.", "examples": [{"jp": "<ruby>家<rt>いえ</rt></ruby>を<ruby>出<rt>で</rt></ruby>ると、<ruby>猫<rt>ねこ</rt></ruby>がドアの<ruby>前<rt>まえ</rt></ruby>に<ruby>座<rt>すわ</rt></ruby>っていた。", "id": "Begitu saya keluar rumah, ternyata ada seekor kucing duduk di depan pintu."}, {"jp": "<ruby>窓<rt>まど</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けたら、<ruby>外<rt>そと</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>だった。", "id": "Begitu saya membuka jendela, ternyata di luar hujan."}], "jlpt": []}, {"id": 90, "title": "90. と...た たら...た (saat sedang A, tanpa diduga B terjadi)", "rumus": "Kata Kerja - Vていると ／ Vていたら", "penjelasan": "ketika sedang melakukan A, terjadi kejadian B secara tiba tiba atau tak terduga.", "tips": "", "examples": [{"jp": "<ruby>部屋<rt>へや</rt></ruby>を<ruby>片付<rt>かたづ</rt></ruby>けていたら、<ruby>古<rt>ふる</rt></ruby>い<ruby>日記<rt>にっき</rt></ruby>が<ruby>見<rt>み</rt></ruby>つかった。", "id": "Saat sedang merapikan kamar, saya tanpa sengaja menemukan diary tua."}, {"jp": "<ruby>庭<rt>にわ</rt></ruby>の<ruby>掃除<rt>そうじ</rt></ruby>をしていると、<ruby>突然<rt>とつぜん</rt></ruby><ruby>大雨<rt>おおあめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>り<ruby>出<rt>だ</rt></ruby>した。", "id": "Saat sedang membersihkan taman, tiba-tiba hujan deras turun."}], "jlpt": []}, {"id": 91, "title": "91. と...た たら...た (setelah melakukan A, B langsung terjadi)", "rumus": "Kata Kerja - VKamus ＋と ／ Vたら", "penjelasan": "setelah tindakan A dilakukan, kejadian B langsung terjadi.", "tips": "bunpou ini selalu diakhiri dengan Vた karena merupakan kejadian yang sudah terjadi.", "examples": [{"jp": "スープにレモンを<ruby>少<rt>すこ</rt></ruby>し<ruby>加<rt>くわ</rt></ruby>えてみたら、とてもさっぱりした<ruby>味<rt>あじ</rt></ruby>になった。", "id": "Setelah mencoba menambahkan lemon ke sup, rasanya jadi sangat segar."}, {"jp": "<ruby>箱<rt>はこ</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けると、おもちゃが<ruby>飛<rt>と</rt></ruby>び<ruby>出<rt>だ</rt></ruby>した。", "id": "Setelah membuka kotak, mainan melompat keluar."}], "jlpt": []}, {"id": 92, "title": "92. と...た (setelah subjek melakukan A, subjek langsung melakukan B)", "rumus": "Kata Kerja - VKamus ＋と", "penjelasan": "setelah tindakan A dilakukan, kemudian subjek melakukan tindakan B.", "tips": "bunpou ini selalu diakhiri dengan Vた karena merupakan kejadian yang sudah terjadi.", "examples": [{"jp": "<ruby>警官<rt>けいかん</rt></ruby>の<ruby>姿<rt>すがた</rt></ruby>を<ruby>見<rt>み</rt></ruby>ると、<ruby>彼<rt>かれ</rt></ruby>は<ruby>急<rt>きゅう</rt></ruby>に<ruby>走<rt>はし</rt></ruby>り<ruby>出<rt>だ</rt></ruby>した。", "id": "Begitu melihat sosok polisi, dia tiba-tiba langsung berlari."}, {"jp": "<ruby>社長<rt>しゃちょう</rt></ruby>は<ruby>会議<rt>かいぎ</rt></ruby><ruby>室<rt>しつ</rt></ruby>に<ruby>入<rt>はい</rt></ruby>ってくると、すぐプレゼンを<ruby>始<rt>はじ</rt></ruby>めた。", "id": "Begitu direktur masuk ruang rapat, dia langsung mulai presentasi."}], "jlpt": []}, {"id": 93, "title": "93. ことがあります・こともあります (bisa saja; ada kalanya; kadang-kadang juga)", "rumus": "Kata Kerja - VKamus\nKata Kerja - Vない\nKata Sifat i - ✅\nKata Sifat na - ＋な", "penjelasan": "menyatakan bahwa suatu kejadian bisa saja terjadi, meskipun jarang.", "tips": "biasanya digunakan untuk kejadian yang sudah pernah terjadi, dan bertujuan untuk mengingatkan kalau kejadian tersebut bisa saja terjadi lagi.\nhati-hati jangan sampai tertukar dengan bunpou たことがある - pernah.\nRumus sangat penting pada bunpou ini, harus menggunakan bentuk VKamus.", "examples": [{"jp": "<ruby>電車<rt>でんしゃ</rt></ruby>が<ruby>遅<rt>おく</rt></ruby>れることがある。", "id": "Kadang-kadang kereta terlambat."}, {"jp": "たまには<ruby>失敗<rt>しっぱい</rt></ruby>することもある。", "id": "Kadang-kadang juga bisa gagal."}, {"jp": "あの<ruby>人<rt>ひと</rt></ruby>はよく<ruby>笑<rt>わら</rt></ruby>うけど、<ruby>時々<rt>ときどき</rt></ruby><ruby>泣<rt>な</rt></ruby>くことがある。", "id": "Dia sering tertawa, tapi ada kalanya dia menangis juga."}, {"jp": "<ruby>慣<rt>な</rt></ruby>れていても、<ruby>間違<rt>まちが</rt></ruby>えることもあるよ。", "id": "Meski sudah terbiasa, tetap kadang bisa salah juga, lho."}, {"jp": "<ruby>母<rt>はは</rt></ruby>はこのごろ<ruby>人<rt>ひと</rt></ruby>の<ruby>名前<rt>なまえ</rt></ruby>を<ruby>忘<rt>わす</rt></ruby>れることがあります。", "id": "Akhir-akhir ini ibu kadang lupa nama orang."}, {"jp": "<ruby>雪<rt>ゆき</rt></ruby>の<ruby>日<rt>ひ</rt></ruby>は<ruby>道<rt>みち</rt></ruby>ですべることがありますから、<ruby>注意<rt>ちゅうい</rt></ruby>してください。", "id": "Saat hari bersalju, ada kemungkinan tergelincir di jalan, jadi harap hati-hati."}, {"jp": "いつもは７<ruby>時<rt>じ</rt></ruby>に<ruby>食<rt>た</rt></ruby>べますが、<ruby>時間<rt>じかん</rt></ruby>がない<ruby>時<rt>とき</rt></ruby>は<ruby>食<rt>た</rt></ruby>べないこともあります。", "id": "Biasanya saya makan jam 7, tapi kadang kalau tidak ada waktu, saya tidak makan."}, {"jp": "<ruby>緊張<rt>きんちょう</rt></ruby>しすぎて、<ruby>言<rt>い</rt></ruby>いたいことが<ruby>言<rt>い</rt></ruby>えなくなることもある。", "id": "Karena terlalu gugup, kadang juga tidak bisa mengungkapkan apa yang ingin dikatakan."}, {"jp": "<ruby>天気<rt>てんき</rt></ruby><ruby>予報<rt>よほう</rt></ruby>が<ruby>外<rt>はず</rt></ruby>れて、<ruby>晴<rt>は</rt></ruby>れるはずが<ruby>雨<rt>あめ</rt></ruby>になることもある。", "id": "Kadang juga ramalan cuaca meleset, dan yang seharusnya cerah malah hujan."}], "jlpt": []}, {"id": 94, "title": "94. といい・たらいい・ばいい (semoga)", "rumus": "Sesuai dengan bunpou と・ば・たら", "penjelasan": "menyatakan harapan atau keinginan terhadap sesuatu.", "tips": "sering diikuti と思います atau ですね untuk membuat kalimatnya menjadi lebih halus", "examples": [{"jp": "<ruby>明日<rt>あした</rt></ruby>、<ruby>晴<rt>は</rt></ruby>れるといいですね。", "id": "Semoga besok cerah, ya.\n(atau bisa diartikan : \"besok, kalau cerah pasti bagus ya.\" → intinya sama saja dengan \"semoga\")"}, {"jp": "<ruby>元気<rt>げんき</rt></ruby>に<ruby>育<rt>そだ</rt></ruby>つといいですね。", "id": "Semoga tumbuh dengan sehat, ya."}, {"jp": "<ruby>最近<rt>さいきん</rt></ruby>ずっと<ruby>体<rt>からだ</rt></ruby>の<ruby>調子<rt>ちょうし</rt></ruby>が<ruby>悪<rt>わる</rt></ruby>い。<ruby>深刻<rt>しんこく</rt></ruby>な<ruby>病気<rt>びょうき</rt></ruby>でなければいいが...", "id": "Belakangan ini kondisi tubuhku terus terasa buruk. Semoga bukan penyakit yang serius..."}, {"jp": "<ruby>明日<rt>あした</rt></ruby>はJLPTの<ruby>試験<rt>しけん</rt></ruby>だ。<ruby>合格<rt>ごうかく</rt></ruby>できたらいいなあ。", "id": "Besok ujian JLPT. Semoga aku bisa lulus."}], "jlpt": []}, {"id": 95, "title": "95. といい・たらいい・ばいい (sebaiknya)", "rumus": "Sesuai dengan bunpou と・ば・たら", "penjelasan": "memberikan saran ringan kepada orang lain.", "tips": "sering diikuti と思います atau ですよ", "examples": [{"jp": "<ruby>分<rt>わ</rt></ruby>からなかったら、<ruby>先生<rt>せんせい</rt></ruby>に<ruby>聞<rt>き</rt></ruby>けばいいよ。", "id": "Kalau nggak ngerti, tanya guru aja."}, {"jp": "<ruby>疲<rt>つか</rt></ruby>れているなら、<ruby>少<rt>すこ</rt></ruby>し<ruby>休<rt>やす</rt></ruby>んだらいいよ。", "id": "Kalau capek, sebaiknya istirahat sebentar."}, {"jp": "この<ruby>薬<rt>くすり</rt></ruby>を<ruby>飲<rt>の</rt></ruby>んだらいいと<ruby>思<rt>おも</rt></ruby>います。", "id": "Menurutku sebaiknya kamu minum obat ini."}, {"jp": "その<ruby>仕事<rt>しごと</rt></ruby>、<ruby>気<rt>き</rt></ruby>が<ruby>進<rt>すす</rt></ruby>まないのなら<ruby>引<rt>ひ</rt></ruby>き<ruby>受<rt>う</rt></ruby>けなければいいんじゃないですか？", "id": "Kalau kamu nggak merasa tertarik dengan pekerjaan itu, bukankah lebih baik tidak menerimanya saja?"}], "jlpt": []}, {"id": 96, "title": "96. とか (misalnya; seperti)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ＋だ (bisa tanpa だ pada situasi tertentu)\nKata Benda - ✅", "penjelasan": "menyebutkan beberapa contoh yang ada dalam topik/kelompok yang sama.", "tips": "fungsinya mirip seperti Partikel や, tapi lebih kasual.", "examples": [{"jp": "<ruby>化粧<rt>けしょう</rt></ruby><ruby>品<rt>ひん</rt></ruby>とかスマートフォンとか、ほしいものがたくさんある。", "id": "Saya punya banyak barang yang saya inginkan, seperti kosmetik, smartphone, dan lain-lain."}, {"jp": "<ruby>公園<rt>こうえん</rt></ruby>とか<ruby>図書館<rt>としょかん</rt></ruby>とかの<ruby>静<rt>しず</rt></ruby>かな<ruby>場所<rt>ばしょ</rt></ruby>が<ruby>好<rt>す</rt></ruby>きです。", "id": "Saya suka tempat yang tenang seperti taman atau perpustakaan."}, {"jp": "<ruby>冷蔵庫<rt>れいぞうこ</rt></ruby>の<ruby>中<rt>なか</rt></ruby>には<ruby>肉<rt>にく</rt></ruby>とか<ruby>野菜<rt>やさい</rt></ruby>とか<ruby>果物<rt>くだもの</rt></ruby>とかがいっぱい<ruby>入<rt>はい</rt></ruby>っています。", "id": "Di dalam kulkas penuh dengan daging, sayur, buah, dan sebagainya."}, {"jp": "<ruby>朝<rt>あさ</rt></ruby>ごはんはパンとかバナナとかをよく<ruby>食<rt>た</rt></ruby>べます。", "id": "Untuk sarapan, saya sering makan roti atau pisang. (misalnya)"}, {"jp": "<ruby>週末<rt>しゅうまつ</rt></ruby>は<ruby>映画<rt>えいが</rt></ruby>とか<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>に<ruby>行<rt>い</rt></ruby>きたいです。", "id": "Akhir pekan, saya ingin pergi nonton atau belanja."}, {"jp": "<ruby>今日<rt>きょう</rt></ruby>は<ruby>家<rt>いえ</rt></ruby>で<ruby>宿題<rt>しゅくだい</rt></ruby>をするとか、<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>むとかして<ruby>過<rt>す</rt></ruby>ごしました。", "id": "Hari ini saya habiskan waktu dengan hal-hal seperti ngerjain PR atau baca buku."}], "jlpt": []}, {"id": 97, "title": "97. あいだ（間） (selama)", "rumus": "Kata Kerja - Vている\n＊ VKamus dan Vない secara rumus pada buku juga bisa digunakan, tapi yang paling lumrah adalah Vている\nKata Sifat i - ✅\nKata Sifat na - ＋な\nKata Benda - ＋の", "penjelasan": "menyatakan kejadian B yang berlangsung terus-menerus sepanjang rentan waktu kejadian A.", "tips": "rentan waktu yang dimaksud adalah \"kalimat A\" alias kalimat yang ada di depan bunpou __あいだ.", "examples": [{"jp": "<ruby>私<rt>わたし</rt></ruby>は<ruby>夏休<rt>なつやす</rt></ruby>みのあいだ、<ruby>毎日<rt>まいにち</rt></ruby>テニスをしていました。", "id": "Selama liburan musim panas, saya bermain tenis setiap hari."}, {"jp": "お<ruby>母<rt>かあ</rt></ruby>さんが<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>しているあいだ、ここにいてね。", "id": "Tetap di sini ya, selama ibu sedang berbelanja."}, {"jp": "<ruby>授業<rt>じゅぎょう</rt></ruby>の<ruby>間<rt>あいだ</rt></ruby>、ずっと<ruby>寝<rt>ね</rt></ruby>ていました。", "id": "Saya tidur terus selama pelajaran berlangsung."}, {"jp": "<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ている<ruby>間<rt>あいだ</rt></ruby>、<ruby>携帯<rt>けいたい</rt></ruby>を<ruby>触<rt>さわ</rt></ruby>らないでください。", "id": "Selama menonton film, jangan menyentuh HP, ya."}], "jlpt": []}, {"id": 98, "title": "98. あいだに（間に） (pada saat)", "rumus": "Kata Kerja - Vている\n＊ VKamus dan Vない secara rumus pada buku juga bisa digunakan, tapi yang paling lumrah adalah Vている\nKata Sifat i - ✅\nKata Sifat na - ＋な\nKata Benda - ＋の", "penjelasan": "menyatakan kejadian B yang terjadi dan selesai di dalam rentan waktu kejadian A.", "tips": "apa bedanya dengan あいだ？\nkejadian B pada あいだ terjadi secara terus-menerus sepanjang rentan waktu yang disebutkan, sedangkan pada あいだに, kejadian B selesai sebelum rentan waktu yang disebutkan berakhir.", "examples": [{"jp": "<ruby>母<rt>はは</rt></ruby>が<ruby>昼寝<rt>ひるね</rt></ruby>しているあいだに、ゲームをしました。", "id": "Saya bermain game pada saat ibu tidur siang.\n(si anak selesai main game sebelum ibunya bangun)"}, {"jp": "<ruby>夏休<rt>なつやす</rt></ruby>みのあいだに、<ruby>富士山<rt>ふじさん</rt></ruby>に<ruby>登<rt>のぼ</rt></ruby>りました。", "id": "Pada saat liburan musim panas, saya mendaki Gunung Fuji.\n(kalau kalimat ini menggunakan あいだ *tanpa に, artinya akan jadi \"pembicara naik gunung secara terus-menerus sejak awal liburan musim panas sampai liburan musim panas selesai.\" Setiap hari. Tidak masuk akal.)"}, {"jp": "お<ruby>父<rt>とう</rt></ruby>さんが<ruby>出<rt>で</rt></ruby>かけているあいだに、ケーキを<ruby>作<rt>つく</rt></ruby>りました。", "id": "Saya membuat kue pada saat ayah sedang pergi\n(kuenya sudah selesai dibuat sebelum ayah pulang)"}, {"jp": "<ruby>留守<rt>るす</rt></ruby>のあいだに、<ruby>泥棒<rt>どろぼう</rt></ruby>が<ruby>入<rt>はい</rt></ruby>ったそうです。", "id": "Katanya ada pencuri masuk pada saat rumah kosong.\n(pencurinya sudah keluar rumah sebelum pemilik rumah kembali)"}], "jlpt": []}, {"id": 99, "title": "99. かもしれません (mungkin)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ✅\nKata Benda - ✅", "penjelasan": "menyatakan kemungkinan atau dugaan yang tidak pasti.", "tips": "tingkat kepastiannya lebih rendah daripada でしょう.", "examples": [{"jp": "<ruby>明日<rt>あした</rt></ruby>は<ruby>雪<rt>ゆき</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>るかもしれませんね。", "id": "Mungkin besok akan turun salju, ya."}, {"jp": "このノートはサラさんのかもしれないよ。", "id": "Mungkin buku catatan ini milik Sara."}, {"jp": "<ruby>今度<rt>こんど</rt></ruby>の<ruby>仕事<rt>しごと</rt></ruby>は<ruby>大変<rt>たいへん</rt></ruby>かもしれないけど、<ruby>頑張<rt>がんば</rt></ruby>ってね。", "id": "Pekerjaan yang kali ini mungkin akan berat, tapi semangat ya."}, {"jp": "<ruby>今日<rt>きょう</rt></ruby>は<ruby>電車<rt>でんしゃ</rt></ruby>が<ruby>遅<rt>おく</rt></ruby>れるかもしれません。", "id": "Mungkin kereta akan terlambat hari ini."}], "jlpt": []}, {"id": 100, "title": "100. ないと・なくちゃ・なきゃ (harus)", "rumus": "Bentuk ない", "penjelasan": "bentuk singkat dari 3 bunpou yang berarti \"harus\".", "tips": "〜ないと　：〜ないといけない\n〜なくちゃ　：〜なくてはならない\n〜なきゃ　：〜なければならない\nTiga bunpou di atas bisa digunakan tanpa tambahan いけない atau ならない, tapi artinya tidak berubah.\nいけない atau ならない juga bisa diganti dengan kata だめ : ないとだめ、なくちゃだめ、なきゃだめ.\n※ Penting ⚠️\nBunpou ini selalu berada di akhir kalimat.\nJika ada di tengah-tengah kalimat, maka fungsinya akan berubah menjadi \"kalau tidak\"", "examples": [{"jp": "ケン、ご<ruby>飯<rt>はん</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>には<ruby>手<rt>て</rt></ruby>を<ruby>洗<rt>あら</rt></ruby>わないと。", "id": "Ken, kamu harus cuci tangan sebelum makan."}, {"jp": "あ、<ruby>忘<rt>わす</rt></ruby>れていた。<ruby>電話<rt>でんわ</rt></ruby>しないと。", "id": "Ah, aku lupa. Aku harus menelepon."}, {"jp": "もうすぐ<ruby>試験<rt>しけん</rt></ruby>だから、ゲームなんかしてないで<ruby>勉強<rt>べんきょう</rt></ruby>しなくちゃ。", "id": "Ujian sebentar lagi, jadi aku harus belajar, bukan main game."}, {"jp": "<ruby>早<rt>はや</rt></ruby>く<ruby>返事<rt>へんじ</rt></ruby>しなきゃ、<ruby>相手<rt>あいて</rt></ruby>に<ruby>失礼<rt>しつれい</rt></ruby>だと<ruby>思<rt>おも</rt></ruby>うよ。", "id": "Kalau nggak cepat balas, menurutku itu kurang sopan ke orangnya."}, {"jp": "この<ruby>書類<rt>しょるい</rt></ruby>、5<ruby>時<rt>じ</rt></ruby>までに<ruby>出<rt>だ</rt></ruby>さないと、<ruby>上司<rt>じょうし</rt></ruby>に<ruby>怒<rt>おこ</rt></ruby>られるかもしれないよ。", "id": "Kalau tidak menyerahkan dokumen ini sebelum jam 5, bisa dimarahi atasan lho."}], "jlpt": []}, {"id": 101, "title": "101. と言っていました ((dia) bilang)", "rumus": "Kalimat Biasa", "penjelasan": "menyampaikan kembali ucapan orang lain kepada lawan bicara.", "tips": "ucapan orang lain tersebut biasanya disampaikan apa adanya, sama persis bagaimana orang tersebut mengatakannya.\nと bisa diubah jadi って.", "examples": [{"jp": "トムさんは<ruby>今日<rt>きょう</rt></ruby><ruby>休<rt>やす</rt></ruby>むと<ruby>言<rt>い</rt></ruby>っていました。", "id": "Tom bilang dia libur hari ini."}, {"jp": "サラさんは<ruby>最近<rt>さいきん</rt></ruby><ruby>忙<rt>いそが</rt></ruby>しいと<ruby>言<rt>い</rt></ruby>っていましたよ。", "id": "Sara bilang akhir-akhir ini dia sibuk."}, {"jp": "<ruby>天気<rt>てんき</rt></ruby><ruby>予報<rt>よほう</rt></ruby>では<ruby>今日<rt>きょう</rt></ruby>は<ruby>暖<rt>あたた</rt></ruby>かくなると<ruby>言<rt>い</rt></ruby>っていたのに、<ruby>寒<rt>さむ</rt></ruby>いですね。", "id": "Padahal ramalan cuaca bilang hari ini akan hangat, tapi dingin ya."}, {"jp": "<ruby>母<rt>はは</rt></ruby>は、「<ruby>早<rt>はや</rt></ruby>く<ruby>帰<rt>かえ</rt></ruby>ってきてね」と<ruby>言<rt>い</rt></ruby>っていました。", "id": "Ibu bilang ‘cepat pulang ya’."}, {"jp": "<ruby>彼<rt>かれ</rt></ruby>は、<ruby>試験<rt>しけん</rt></ruby>は<ruby>難<rt>むずか</rt></ruby>しくなかったと<ruby>言<rt>い</rt></ruby>っていました。", "id": "Dia bilang ujiannya tidak sulit."}], "jlpt": []}, {"id": 102, "title": "102. のは・のが・のを (mengubah kalimat di depannya menjadi kata benda/objek)", "rumus": "Kalimat dalam Bentuk Biasa", "penjelasan": "mengubah kalimat di depannya menjadi kata benda/objek.", "tips": "のは diikuti dengan Kata Sifat dan Kata Benda\nのが diikuti dengan Kata Sifat dan Kata Kerja Potensial\nのを diikuti dengan Kata Kerja\nKata Sifat yang mengikuti masing masing bunpou :\nのが　→ 好き、嫌い、上手、下手、得意、苦手、早い、遅い、など\nのは　→ 難しい、易しい、面白い、楽しい、大変、など\nKata Kerja yang sering digunakan pada bunpou :\nのを　→ 見る、聞く、知っている、忘れる、待つ、助ける、続けるなど\n⚠️ Penting\nPerbedaan Kata Sifat yang bisa digunakan bersama のは dan のが sangat sulit untuk dipahami karena のは juga bisa menggunakan Kata Sifat dari のが pada konteks tertentu. Konteks yang dimaksud adalah ketika は pada のは digunakan sebagai \"pembanding\" yang mana merupakan salah satu fungsi dari partikel は.\nJadi saran saya adalah, cukup hafalkan Kata Sifat yang digunakan dengan のが saja, sisanya kalian bisa pasangkan dengan のは.", "examples": [{"jp": "<ruby>毎日<rt>まいにち</rt></ruby><ruby>運動<rt>うんどう</rt></ruby>するのが<ruby>好<rt>す</rt></ruby>きです。", "id": "Saya suka olahraga setiap hari.\n(\"olahraga setiap hari\" berfungsi sebagai objek yang disukai oleh pembicara)"}, {"jp": "<ruby>毎日<rt>まいにち</rt></ruby><ruby>運動<rt>うんどう</rt></ruby>するのは<ruby>健康<rt>けんこう</rt></ruby>にいいです。", "id": "Olahraga setiap hari itu baik untuk kesehatan.\n(\"olahraga setiap hari\" menjadi topik yang dibahas)"}, {"jp": "<ruby>毎日<rt>まいにち</rt></ruby><ruby>運動<rt>うんどう</rt></ruby>するのを<ruby>続<rt>つづ</rt></ruby>けています。", "id": "Saya terus melanjutkan olahraga setiap hari.\n(\"olahraga setiap hari\" menjadi objek dari kata kerja)"}, {"jp": "<ruby>誰<rt>だれ</rt></ruby>かが<ruby>歌<rt>うた</rt></ruby>っているのが<ruby>聞<rt>き</rt></ruby>こえます。", "id": "Terdengar seseorang sedang bernyanyi."}, {"jp": "<ruby>誰<rt>だれ</rt></ruby>かが<ruby>歌<rt>うた</rt></ruby>っているのは<ruby>彼<rt>かれ</rt></ruby>の<ruby>妹<rt>いもうと</rt></ruby>です。", "id": "Yang sedang bernyanyi itu adik perempuannya."}, {"jp": "<ruby>誰<rt>だれ</rt></ruby>かが<ruby>歌<rt>うた</rt></ruby>っているのを<ruby>聞<rt>き</rt></ruby>きました。", "id": "Saya mendengar seseorang sedang bernyanyi."}], "jlpt": []}, {"id": 103, "title": "103. ていただけませんか (meminta tolong secara halus)", "rumus": "Kata Kerja - Vて", "penjelasan": "meminta tolong kepada orang lain dengan cara yang sangat sopan dan merendah.", "tips": "sama artinya dengan :\n〜てください\n〜てくれませんか\n〜てもらえませんか\n〜てくださいませんか\n〜ていただけませんか\n⚠️ Hati-hati\nBaca baik-baik, ていただけませんか ya, bukan ていただきませんか\nJika ada pilihan jawaban ていただきませんか, sudah pasti salah ❌", "examples": [{"jp": "<ruby>明日<rt>あした</rt></ruby>は８<ruby>時<rt>じ</rt></ruby>に<ruby>起<rt>お</rt></ruby>こしていただけませんか。", "id": "Bisakah Anda membangunkan saya jam 8 besok?"}, {"jp": "すみませんが、お<ruby>金<rt>かね</rt></ruby>を<ruby>貸<rt>か</rt></ruby>していただけませんか。", "id": "Maaf, bisakah Anda meminjamkan saya uang?"}, {"jp": "<ruby>銀行<rt>ぎんこう</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きたいんですが、<ruby>道<rt>みち</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えていただけませんか。", "id": "Saya ingin pergi ke bank, bisakah Anda beri tahu jalannya?"}, {"jp": "この<ruby>資料<rt>しりょう</rt></ruby>を<ruby>見<rt>み</rt></ruby>ていただけませんか。", "id": "Bolehkah saya minta Anda melihat dokumen ini?"}, {"jp": "その<ruby>資料<rt>しりょう</rt></ruby>を<ruby>見<rt>み</rt></ruby>せていただけませんか。", "id": "Bisakah saya minta Anda memperlihatkan dokumen itu?"}, {"jp": "<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>っていただけませんか。", "id": "Bisa tolong foto saya?"}, {"jp": "<ruby>少<rt>すこ</rt></ruby>し<ruby>静<rt>しず</rt></ruby>かにしていただけませんか。", "id": "Bisakah Anda sedikit lebih tenang? (tidak berisik)"}], "jlpt": []}, {"id": 104, "title": "104. によって (karena; disebabkan oleh)", "rumus": "Kata Benda + によって", "penjelasan": "menyatakan penyebab atau alasan", "tips": "ini mirip dengan Partikel で", "examples": [{"jp": "<ruby>地震<rt>じしん</rt></ruby>によって<ruby>多<rt>おお</rt></ruby>くの<ruby>建物<rt>たてもの</rt></ruby>が<ruby>壊<rt>こわ</rt></ruby>れた。", "id": "Karena gempa, banyak bangunan rusak."}, {"jp": "<ruby>台風<rt>たいふう</rt></ruby>によって、たくさんの<ruby>木<rt>き</rt></ruby>が<ruby>倒<rt>たお</rt></ruby>れました。", "id": "Karena topan, banyak pohon tumbang."}], "jlpt": []}, {"id": 105, "title": "105. によって (dengan; melalui)", "rumus": "Kata Benda + によって", "penjelasan": "menyatakan cara atau metode", "tips": "sama dengan fungsi Partikel で yang menyatakan sarana atau metode", "examples": [{"jp": "インターネットによって、<ruby>世界<rt>せかい</rt></ruby><ruby>中<rt>じゅう</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>と<ruby>簡単<rt>かんたん</rt></ruby>に<ruby>話<rt>はな</rt></ruby>せるようになった。", "id": "Melalui internet, kita jadi bisa berbicara dengan orang di seluruh dunia dengan mudah."}, {"jp": "<ruby>話<rt>はな</rt></ruby>し<ruby>合<rt>あ</rt></ruby>いによって<ruby>問題<rt>もんだい</rt></ruby>を<ruby>解決<rt>かいけつ</rt></ruby>しました。", "id": "Kami menyelesaikan masalah itu melalui diskusi."}], "jlpt": []}, {"id": 106, "title": "106. によって (tergantung; berdasarkan)", "rumus": "Kata Benda + によって", "penjelasan": "menyatakan perbedaan tergantung kondisi atau orang", "tips": "", "examples": [{"jp": "<ruby>人<rt>ひと</rt></ruby>によって<ruby>考<rt>かんが</rt></ruby>え<ruby>方<rt>かた</rt></ruby>が<ruby>違<rt>ちが</rt></ruby>う。", "id": "Tergantung orangnya, cara berpikir bisa berbeda."}, {"jp": "<ruby>国<rt>くに</rt></ruby>によって<ruby>習慣<rt>しゅうかん</rt></ruby>が<ruby>異<rt>こと</rt></ruby>なる。", "id": "Kebiasaan berbeda tergantung negaranya."}], "jlpt": []}, {"id": 107, "title": "107. によって (oleh)", "rumus": "Kata Benda + によって", "penjelasan": "menyatakan pelaku dalam kalimat pasif.", "tips": "", "examples": [{"jp": "この<ruby>小説<rt>しょうせつ</rt></ruby>は<ruby>有名<rt>ゆうめい</rt></ruby>な<ruby>作家<rt>さっか</rt></ruby>によって<ruby>書<rt>か</rt></ruby>かれた。", "id": "Novel ini ditulis oleh penulis terkenal."}, {"jp": "<ruby>電話<rt>でんわ</rt></ruby>はベルによって<ruby>発明<rt>はつめい</rt></ruby>されました。", "id": "Telepon diciptakan oleh Bell."}], "jlpt": []}, {"id": 108, "title": "108. 〜によると (menurut)", "rumus": "Kata Benda", "penjelasan": "menyampaikan informasi yang bersumber dari pihak ketiga seperti berita, laporan, rumor, orang lain, dan sebagainya.", "tips": "biasanya muncul di awal kalimat, dan diikuti oleh bentuk laporan seperti : 〜そうです, 〜らしいです, atau 〜ということです.", "examples": [{"jp": "<ruby>天気<rt>てんき</rt></ruby><ruby>予報<rt>よほう</rt></ruby>によると、<ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>るそうです。", "id": "Menurut prakiraan cuaca, katanya besok akan turun hujan."}, {"jp": "ニュースによると、この<ruby>町<rt>まち</rt></ruby>で<ruby>地震<rt>じしん</rt></ruby>があったらしいです。", "id": "Menurut berita, katanya terjadi gempa di kota ini."}, {"jp": "<ruby>医者<rt>いしゃ</rt></ruby>によると、この<ruby>病気<rt>びょうき</rt></ruby>は<ruby>早<rt>はや</rt></ruby>く<ruby>治<rt>なお</rt></ruby>るということです。", "id": "Menurut dokter, katanya penyakit ini bisa cepat sembuh."}, {"jp": "うわさによると、あの<ruby>二人<rt>ふたり</rt></ruby>は<ruby>結婚<rt>けっこん</rt></ruby>するそうです。", "id": "Menurut gosip, katanya mereka akan menikah."}, {"jp": "インタビューによると、<ruby>彼<rt>かれ</rt></ruby>は<ruby>来年<rt>らいねん</rt></ruby><ruby>引退<rt>いんたい</rt></ruby>するということです。", "id": "Menurut wawancara, katanya dia akan pensiun tahun depan."}], "jlpt": []}, {"id": 109, "title": "109. 場合 (jika; kalau; apabila)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ＋な atau ＋である\nKata Benda - ＋の atau ＋である", "penjelasan": "menyatakan hal yang harus dilakukan pada suatu kondisi atau situasi tertentu.", "tips": "bunpou ini sangat mirip dengan 〜たら.", "examples": [{"jp": "<ruby>熱<rt>ねつ</rt></ruby>が<ruby>続<rt>つづ</rt></ruby>く<ruby>場合<rt>ばあい</rt></ruby>は、<ruby>病院<rt>びょういん</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったほうがいいです。", "id": "Jika demam terus berlanjut, sebaiknya pergi ke rumah sakit."}, {"jp": "パスワードを５<ruby>回<rt>かい</rt></ruby><ruby>間違<rt>まちが</rt></ruby>えた<ruby>場合<rt>ばあい</rt></ruby>、<ruby>画面<rt>がめん</rt></ruby>がロックされます。", "id": "Jika salah memasukkan kata sandi lima kali, layarnya akan terkunci."}, {"jp": "<ruby>学校<rt>がっこう</rt></ruby>を<ruby>休<rt>やす</rt></ruby>む<ruby>場合<rt>ばあい</rt></ruby>、<ruby>必<rt>かなら</rt></ruby>ず<ruby>連絡<rt>れんらく</rt></ruby>してください。", "id": "Jika akan absen/libur dari sekolah, tolong pastikan untuk menghubungi sekolah."}, {"jp": "<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>った<ruby>場合<rt>ばあい</rt></ruby>は、<ruby>試合<rt>しあい</rt></ruby>は<ruby>中止<rt>ちゅうし</rt></ruby>になります。", "id": "Jika hujan turun, pertandingan akan dibatalkan."}, {"jp": "<ruby>道<rt>みち</rt></ruby>に<ruby>迷<rt>まよ</rt></ruby>った<ruby>場合<rt>ばあい</rt></ruby>は、すぐに<ruby>連絡<rt>れんらく</rt></ruby>してください。", "id": "Jika tersesat, segera hubungi kami."}, {"jp": "<ruby>参加<rt>さんか</rt></ruby>できない<ruby>場合<rt>ばあい</rt></ruby>は、<ruby>前<rt>まえ</rt></ruby>もって<ruby>知<rt>し</rt></ruby>らせてください。", "id": "Kalau tidak bisa ikut, mohon beri tahu sebelumnya."}, {"jp": "<ruby>緊急<rt>きんきゅう</rt></ruby>の<ruby>場合<rt>ばあい</rt></ruby>は、この<ruby>番号<rt>ばんごう</rt></ruby>に<ruby>電話<rt>でんわ</rt></ruby>してください。", "id": "Apabila dalam keadaan darurat, silakan hubungi nomor ini."}, {"jp": "<ruby>学生<rt>がくせい</rt></ruby>でない<ruby>場合<rt>ばあい</rt></ruby>は、この<ruby>割引<rt>わりびき</rt></ruby>は<ruby>使<rt>つか</rt></ruby>えません。", "id": "Jika Anda bukan pelajar, diskon ini tidak berlaku."}], "jlpt": []}, {"id": 110, "title": "110. 途中（で） (di pertengahan)", "rumus": "Kata Kerja - VKamus atau Vている\nKata Benda - ＋の", "penjelasan": "menyatakan bahwa sesuatu terjadi di tengah-tengah aktivitas atau perjalanan yang belum selesai.", "tips": "bisa digunakan untuk hal fisik seperti “di jalan” maupun proses abstrak seperti “di tengah-tengah pekerjaan”.\nkadang で bisa diubah menjadi に jika ingin menekankan pada \"waktu\" terjadinya.\nPada umumnya menggunakan で yang menekankan pada \"kejadian atau kegiatan\".", "examples": [{"jp": "<ruby>家<rt>いえ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>る<ruby>途中<rt>とちゅう</rt></ruby>、<ruby>本屋<rt>ほんや</rt></ruby>に<ruby>寄<rt>よ</rt></ruby>った。", "id": "Dalam perjalanan pulang ke rumah, saya mampir ke toko buku."}, {"jp": "<ruby>通勤<rt>つうきん</rt></ruby>の<ruby>途中<rt>とちゅう</rt></ruby>で、<ruby>急<rt>きゅう</rt></ruby>に<ruby>気分<rt>きぶん</rt></ruby>が<ruby>悪<rt>わる</rt></ruby>くなって<ruby>吐<rt>は</rt></ruby>いてしまった。", "id": "Dalam perjalanan ke kantor, saya tiba-tiba merasa tidak enak badan dan muntah."}, {"jp": "<ruby>会議<rt>かいぎ</rt></ruby>の<ruby>途中<rt>とちゅう</rt></ruby>で、<ruby>電話<rt>でんわ</rt></ruby>がかかってきました。", "id": "Di tengah rapat, saya mendapat telepon."}, {"jp": "<ruby>学校<rt>がっこう</rt></ruby>へ<ruby>行<rt>い</rt></ruby>く<ruby>途中<rt>とちゅう</rt></ruby>で<ruby>財布<rt>さいふ</rt></ruby>を<ruby>落<rt>お</rt></ruby>としました。", "id": "Saya menjatuhkan dompet di tengah perjalanan ke sekolah."}, {"jp": "ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べている<ruby>途中<rt>とちゅう</rt></ruby>で<ruby>呼<rt>よ</rt></ruby>ばれました。", "id": "Saya dipanggil pada saat masih sedang makan."}], "jlpt": []}, {"id": 111, "title": "111. それで (makanya; itulah kenapa)", "rumus": "", "penjelasan": "menyatakan hasil atau akibat yang sudah terjadi karena hal yang disebutkan sebelumnya", "tips": "pada percakapan, 「それで？」 juga dipakai untuk meminta lawan bicara melanjutkan ceritanya (\"terus?\").\n\nperbedaan だから、それで、そのため、したがって、そこで :\nだから - paling umum, kalimat setelahnya boleh berupa pendapat, permintaan, ajakan, atau perintah\nそれで - lisan, kalimat setelahnya adalah hasil yang sudah terjadi\nそのため - lebih formal, menyatakan sebab → akibat\nしたがって - paling formal, menyatakan kesimpulan yang logis\nそこで - kalimat setelahnya adalah tindakan untuk menanggapi situasi tadi\n\n⚠️ jangan tertukar dengan それでも (meskipun begitu) dan それでは (= では, kalau begitu).", "examples": [], "jlpt": [{"jp": "<ruby>赤<rt>あか</rt></ruby>ちゃんは<ruby>新聞<rt>しんぶん</rt></ruby>で<ruby>遊<rt>あそ</rt></ruby>ぶのが<ruby>大好<rt>だいす</rt></ruby>きです。でも、すぐ<ruby>口<rt>くち</rt></ruby>に<ruby>入<rt>い</rt></ruby>れてしまうので、<ruby>親<rt>おや</rt></ruby>は<ruby>困<rt>こま</rt></ruby>ります。それで、おもちゃの<ruby>会社<rt>かいしゃ</rt></ruby>が「<ruby>赤<rt>あか</rt></ruby>ちゃん<ruby>新聞<rt>しんぶん</rt></ruby>」というおもちゃを<ruby>作<rt>つく</rt></ruby>りました。", "id": "Bayi sangat suka bermain dengan koran. Tapi karena mereka langsung memasukkannya ke mulut, orang tua jadi repot. Makanya, sebuah perusahaan mainan membuat mainan bernama «koran bayi».", "tag": "JLPT N4"}, {"jp": "<ruby>内村<rt>うちむら</rt></ruby>さんは「<ruby>少<rt>すこ</rt></ruby>し」と<ruby>言<rt>い</rt></ruby>ったのに、ずっと<ruby>花<rt>はな</rt></ruby>の<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>っていて、１２<ruby>時<rt>じ</rt></ruby>になってしまいました。それで、<ruby>私<rt>わたし</rt></ruby>たちは<ruby>弁当<rt>べんとう</rt></ruby>を<ruby>食<rt>た</rt></ruby>べました。", "id": "Uchimura-san bilang «sebentar saja», tapi dia terus memotret bunga sampai jam 12. Makanya, kami pun makan bekal.", "tag": "JLPT N4"}, {"jp": "<ruby>聞<rt>き</rt></ruby>いてみると、<ruby>英語<rt>えいご</rt></ruby>の「スポーツ」には、ルールを<ruby>守<rt>まも</rt></ruby>りながら<ruby>勝<rt>か</rt></ruby>ったり<ruby>負<rt>ま</rt></ruby>けたりすることを<ruby>楽<rt>たの</rt></ruby>しむものという<ruby>意味<rt>いみ</rt></ruby>があるそうだ。それで、<ruby>最近<rt>さいきん</rt></ruby>ではコンピューターゲームもスポーツと<ruby>言<rt>い</rt></ruby>うらしい。", "id": "Waktu kutanya, katanya kata \"sport\" dalam bahasa Inggris punya arti kegiatan yang dinikmati dengan menang atau kalah sambil tetap menaati aturan. Makanya, belakangan ini game komputer pun katanya disebut olahraga.", "tag": "JLPT N3 · Jul 2024"}, {"jp": "<ruby>朝<rt>あさ</rt></ruby>は<ruby>決<rt>き</rt></ruby>まった<ruby>時間<rt>じかん</rt></ruby>に<ruby>起<rt>お</rt></ruby>きなければならないので、<ruby>眠<rt>ねむ</rt></ruby>る<ruby>時間<rt>じかん</rt></ruby>が<ruby>短<rt>みじか</rt></ruby>くなって、<ruby>昼間<rt>ひるま</rt></ruby>に<ruby>眠<rt>ねむ</rt></ruby>くなってしまう。それで、<ruby>体<rt>からだ</rt></ruby>が<ruby>疲<rt>つか</rt></ruby>れるまで<ruby>運動<rt>うんどう</rt></ruby>をすれば、<ruby>布団<rt>ふとん</rt></ruby>に<ruby>入<rt>はい</rt></ruby>ってすぐに<ruby>眠<rt>ねむ</rt></ruby>くなるだろうと<ruby>考<rt>かんが</rt></ruby>えて、<ruby>寝<rt>ね</rt></ruby>る1<ruby>時間<rt>じかん</rt></ruby><ruby>前<rt>まえ</rt></ruby>に<ruby>走<rt>はし</rt></ruby>ることにした。", "id": "Karena pagi aku harus bangun di jam yang sudah ditentukan, waktu tidurku jadi pendek, dan siang harinya aku jadi ngantuk. Makanya, aku berpikir kalau olahraga sampai badan capek, aku pasti langsung ngantuk begitu masuk futon, jadi aku memutuskan lari 1 jam sebelum tidur.", "tag": "JLPT N3 · Des 2022"}]}, {"id": 112, "title": "112. だから (oleh karena itu)", "rumus": "", "penjelasan": "menyambungkan alasan dengan kesimpulan, keputusan, pendapat, atau permintaan dari pembicara.", "tips": "bentuk sopannya ですから.\nkalau di soal kalian melihat permintaan atau perintah (〜てください、〜なさい) setelah kata sambung yang kosong, jawaban yang paling aman adalah だから.\n\nperbedaan だから、それで、そのため、したがって、そこで :\nだから - paling umum, kalimat setelahnya boleh berupa pendapat, permintaan, ajakan, atau perintah\nそれで - lisan, kalimat setelahnya adalah hasil yang sudah terjadi\nそのため - lebih formal, menyatakan sebab → akibat\nしたがって - paling formal, menyatakan kesimpulan yang logis\nそこで - kalimat setelahnya adalah tindakan untuk menanggapi situasi tadi\n\n⚠️ 〜んだから・〜のだから di tengah kalimat itu bunpou lain (〜のだから).", "examples": [], "jlpt": [{"jp": "<ruby>日本<rt>にほん</rt></ruby>の<ruby>町<rt>まち</rt></ruby>と<ruby>私<rt>わたし</rt></ruby>の<ruby>国<rt>くに</rt></ruby>の<ruby>町<rt>まち</rt></ruby>は<ruby>景色<rt>けしき</rt></ruby>が<ruby>全然<rt>ぜんぜん</rt></ruby><ruby>違<rt>ちが</rt></ruby>います。だから、とても<ruby>面白<rt>おもしろ</rt></ruby>いです。", "id": "Pemandangan kota di Jepang dan kota di negara saya sama sekali berbeda. Oleh karena itu, sangat menarik.", "tag": "JLPT N4"}, {"jp": "いいえ、<ruby>先生<rt>せんせい</rt></ruby>の<ruby>部屋<rt>へや</rt></ruby>にレポートを<ruby>出<rt>だ</rt></ruby>しに<ruby>行<rt>い</rt></ruby>くんです。だからすぐ<ruby>終<rt>お</rt></ruby>わると<ruby>思<rt>おも</rt></ruby>います。", "id": "Bukan, saya mau ke ruangan dosen untuk menyerahkan laporan. Oleh karena itu, sepertinya akan cepat selesai.", "tag": "JLPT N4 · Des 2013 · choukai"}, {"jp": "<ruby>私<rt>わたし</rt></ruby>のふるさとには、<ruby>海<rt>うみ</rt></ruby>がなかった。だから、ふるさとを<ruby>出<rt>で</rt></ruby>て、<ruby>海<rt>うみ</rt></ruby>があるこの<ruby>町<rt>まち</rt></ruby>に<ruby>引<rt>ひ</rt></ruby>っ<ruby>越<rt>こ</rt></ruby>してきたときの<ruby>驚<rt>おどろ</rt></ruby>きは、<ruby>今<rt>いま</rt></ruby>でも<ruby>忘<rt>わす</rt></ruby>れられない。", "id": "Di kampung halamanku tidak ada laut. Oleh karena itu, rasa kagetku waktu meninggalkan kampung dan pindah ke kota yang ada lautnya ini masih belum bisa kulupakan sampai sekarang.", "tag": "JLPT N3"}, {"jp": "<ruby>友達<rt>ともだち</rt></ruby>のマキは、いいことがあったという<ruby>話<rt>はなし</rt></ruby>をよくする。だから<ruby>私<rt>わたし</rt></ruby>は、マキは<ruby>運<rt>うん</rt></ruby>がいいのだと<ruby>思<rt>おも</rt></ruby>っていた。", "id": "Temanku, Maki, sering cerita soal hal baik yang terjadi padanya. Oleh karena itu, aku mengira Maki itu orang yang beruntung.", "tag": "JLPT N3 · Des 2024"}]}, {"id": 113, "title": "113. けれども (tetapi)", "rumus": "", "penjelasan": "menyatakan kontradiksi antara Kalimat A dan Kalimat B, dengan gaya netral yang cukup sopan.", "tips": "bentuk pendeknya けれど dan けど.\n\nperbedaan けれども、だが、だけど、ただし、ところが :\nけれども - netral dan cukup sopan, bisa lisan maupun tulisan\nだが - gaya tulisan, terdengar kaku kalau diucapkan\nだけど - gaya lisan, santai\nただし - bukan membantah, tapi menambahkan syarat atau pengecualian\nところが - kenyataannya berbeda dari dugaan, ada rasa kaget\n\n⚠️ 〜けれども di tengah kalimat (高いですけれども、…) itu bunpou が・けど dari Bunpou Dasar.", "examples": [{"jp": "これらのサービスは<ruby>非常<rt>ひじょう</rt></ruby>に<ruby>便利<rt>べんり</rt></ruby>です。けれども、<ruby>危険<rt>きけん</rt></ruby>も<ruby>多<rt>おお</rt></ruby>いのです。", "id": "Layanan-layanan ini sangat praktis. Tetapi, bahayanya juga banyak."}], "jlpt": [{"jp": "ともだちは<ruby>遠<rt>とお</rt></ruby>くまで<ruby>泳<rt>およ</rt></ruby>いで<ruby>行<rt>い</rt></ruby>きました。けれども、<ruby>私<rt>わたし</rt></ruby>は<ruby>泳<rt>およ</rt></ruby>げませんでした。", "id": "Temanku berenang sampai jauh. Tetapi, aku tidak bisa berenang.", "tag": "JLPT N4"}, {"jp": "<ruby>誰<rt>だれ</rt></ruby>かが<ruby>決<rt>き</rt></ruby>めた<ruby>時期<rt>じき</rt></ruby>に<ruby>掃除<rt>そうじ</rt></ruby>をするというのが<ruby>嫌<rt>いや</rt></ruby>だったのです。けれども、ずっと<ruby>忙<rt>いそが</rt></ruby>しくて<ruby>大<rt>おお</rt></ruby><ruby>掃除<rt>そうじ</rt></ruby>ができず、そのまま、また12<ruby>月<rt>がつ</rt></ruby>になってしまいました。", "id": "Aku tidak suka bersih-bersih di waktu yang ditentukan orang lain. Tetapi, karena terus sibuk, aku tidak sempat bersih-bersih besar, dan tahu-tahu sudah bulan Desember lagi.", "tag": "JLPT N3"}]}, {"id": 114, "title": "114. 〜ては・〜（の）では (kalau dalam kondisi seperti itu)", "rumus": "Kata Kerja - Vて ＋は\nKata Kerja - Bentuk Biasa ＋の ＋では\nKata Benda - ＋では", "penjelasan": "menyatakan bahwa jika dalam kondisi seperti itu, maka akan menimbulkan hasil yang tidak baik / tidak diinginkan.", "tips": "dalam kaiwa biasanya diubah jadi ちゃ atau じゃ\ncontoh : それじゃダメだよ → kalo kayak gitu gak boleh", "examples": [], "jlpt": [{"jp": "<ruby>黒<rt>くろ</rt></ruby>の<ruby>鉛筆<rt>えんぴつ</rt></ruby>やペンではわかりにくいですから、<ruby>必<rt>かなら</rt></ruby>ず<ruby>赤<rt>あか</rt></ruby>のペンを<ruby>使<rt>つか</rt></ruby>ってください。", "id": "Kalau dengan pensil atau pulpen hitam, susah dibedakan, jadi pastikan pakai pulpen merah.", "tag": "JLPT N4 · Jul 2024 · choukai"}, {"jp": "<ruby>今<rt>いま</rt></ruby>はうちの<ruby>課<rt>か</rt></ruby>にあるパソコンでは、<ruby>使<rt>つか</rt></ruby>えないと<ruby>思<rt>おも</rt></ruby>います。", "id": "Kalau dengan komputer yang ada di bagian kami sekarang, sepertinya tidak bisa dipakai.", "tag": "JLPT N4 · Des 2025 · choukai"}, {"jp": "<ruby>一人<rt>ひとり</rt></ruby>では<ruby>全部<rt>ぜんぶ</rt></ruby><ruby>食<rt>た</rt></ruby>べられそうにないと<ruby>思<rt>おも</rt></ruby>ったので、<ruby>友達<rt>ともだち</rt></ruby>に<ruby>半分<rt>はんぶん</rt></ruby>あげた。", "id": "Karena kupikir kalau sendirian nggak bakal bisa habis semua, setengahnya kukasih ke teman.", "tag": "JLPT N3"}, {"jp": "<ruby>今<rt>いま</rt></ruby>のわたしの<ruby>安<rt>やす</rt></ruby>い<ruby>給料<rt>きゅうりょう</rt></ruby>では、<ruby>何<rt>なん</rt></ruby><ruby>年<rt>ねん</rt></ruby><ruby>働<rt>はたら</rt></ruby>いても<ruby>自分<rt>じぶん</rt></ruby>の<ruby>家<rt>いえ</rt></ruby>は<ruby>買<rt>か</rt></ruby>えそうもない。", "id": "Kalau dengan gaji saya yang kecil sekarang ini, berapa tahun pun saya bekerja, sepertinya saya tidak akan bisa membeli rumah sendiri.", "tag": "JLPT N3 · Jul 2011"}]}, {"id": 115, "title": "115. それから (selain itu; setelah itu)", "rumus": "", "penjelasan": "menyambung kegiatan yang dilakukan setelah kegiatan sebelumnya, atau menambahkan hal lain ke dalam daftar.", "tips": "untuk urutan kegiatan, fungsinya sama seperti 〜てから, hanya saja dipakai di awal kalimat baru.\nuntuk fungsi \"selain itu\", sering dipakai saat menambahkan pesanan atau permintaan :\nコーヒーをください。それから、ケーキも。\n→ Tolong kopinya. Selain itu, kuenya juga.", "examples": [], "jlpt": [{"jp": "それから、<ruby>東山<rt>ひがしやま</rt></ruby>さんの<ruby>作<rt>つく</rt></ruby>った<ruby>会議<rt>かいぎ</rt></ruby>の<ruby>資料<rt>しりょう</rt></ruby>を<ruby>持<rt>も</rt></ruby>っていって、みなさんに<ruby>渡<rt>わた</rt></ruby>しておいてもらいたいそうです。", "id": "Selain itu, katanya Higashiyama-san minta materi rapat yang dia buat dibawa ke sana dan dibagikan ke semua orang.", "tag": "JLPT N4"}, {"jp": "きゅうりは<ruby>薄<rt>うす</rt></ruby>く<ruby>切<rt>き</rt></ruby>ってください。じゃがいもは<ruby>細<rt>ほそ</rt></ruby>く<ruby>切<rt>き</rt></ruby>ってください。それから、にんじんは<ruby>薄<rt>うす</rt></ruby>く<ruby>切<rt>き</rt></ruby>ってから、<ruby>星<rt>ほし</rt></ruby>の<ruby>形<rt>かたち</rt></ruby>にしてください。", "id": "Timunnya tolong diiris tipis. Kentangnya tolong dipotong kecil-kecil memanjang. Setelah itu, wortelnya diiris tipis dulu, lalu dibentuk jadi bintang.", "tag": "JLPT N4 · Des 2013 · choukai"}, {"jp": "<ruby>寒<rt>さむ</rt></ruby>すぎても<ruby>眠<rt>ねむ</rt></ruby>れないけど、<ruby>部屋<rt>へや</rt></ruby>の<ruby>温度<rt>おんど</rt></ruby>を<ruby>上<rt>あ</rt></ruby>げすぎてもよく<ruby>眠<rt>ねむ</rt></ruby>れないことがあるんだって。それから<ruby>寝<rt>ね</rt></ruby>る<ruby>前<rt>まえ</rt></ruby>にパソコンや<ruby>携帯<rt>けいたい</rt></ruby>を<ruby>使<rt>つか</rt></ruby>うのもよくないらしいよ。", "id": "Katanya, kalau terlalu dingin memang susah tidur, tapi kalau suhu kamar dinaikkan terlalu tinggi juga bisa jadi susah tidur nyenyak. Selain itu, main komputer atau HP sebelum tidur juga katanya tidak baik.", "tag": "JLPT N3 · Des 2025 · choukai"}, {"jp": "それから<ruby>薬<rt>くすり</rt></ruby>は？<ruby>一応<rt>いちおう</rt></ruby><ruby>持<rt>も</rt></ruby>って<ruby>行<rt>い</rt></ruby>ったほうが<ruby>安心<rt>あんしん</rt></ruby>だと<ruby>思<rt>おも</rt></ruby>うよ。", "id": "Selain itu, obatnya? Buat jaga-jaga, lebih tenang kalau dibawa, lho.", "tag": "JLPT N3 · Des 2023 · choukai"}]}, {"id": 116, "title": "116. 全然〜ない (tidak sama sekali)", "rumus": "", "penjelasan": "menyatakan bahwa sesuatu sama sekali tidak terjadi atau tidak berlaku — penyangkalan yang total.", "tips": "selalu dipasangkan dengan bentuk negatif (〜ない・〜ません).\n全然（ぜんぜん） lebih kasual daripada 全く（まったく）, jadi di tulisan resmi biasanya pakai 全く.\ndi kaiwa sehari-hari kadang terdengar 全然大丈夫 atau 全然いい, tapi itu bahasa gaul.\nuntuk ujian JLPT, anggap 全然 selalu dengan bentuk negatif.\n\nbedanya dengan ちっとも dan 少しも :\n全然〜ない - sama sekali tidak (paling umum)\nちっとも〜ない - tidak sedikit pun (kasual, biasanya dengan nada kesal atau kecewa)\n少しも〜ない - tidak sedikit pun (sama dengan ちっとも, tapi lebih formal)", "examples": [], "jlpt": [{"jp": "<ruby>昨日<rt>きのう</rt></ruby>レストランに<ruby>行<rt>い</rt></ruby>ったんだけど、メニューがほとんど<ruby>漢字<rt>かんじ</rt></ruby>で<ruby>書<rt>か</rt></ruby>いてあるから<ruby>読<rt>よ</rt></ruby>めなくて、どんな<ruby>料理<rt>りょうり</rt></ruby>か<ruby>全然<rt>ぜんぜん</rt></ruby>わからなかったよ。", "id": "Kemarin aku pergi ke restoran, tapi menunya hampir semua ditulis dengan kanji, jadi aku tidak bisa membacanya dan sama sekali tidak tahu itu masakan apa.", "tag": "JLPT N4 · Des 2024 · choukai"}, {"jp": "<ruby>去年<rt>きょねん</rt></ruby>までは<ruby>毎日<rt>まいにち</rt></ruby><ruby>走<rt>はし</rt></ruby>っていたんだけど、<ruby>最近<rt>さいきん</rt></ruby><ruby>忙<rt>いそが</rt></ruby>しいから<ruby>全然<rt>ぜんぜん</rt></ruby><ruby>走<rt>はし</rt></ruby>っていないよ。", "id": "Sampai tahun lalu aku lari setiap hari, tapi akhir-akhir ini karena sibuk, aku sama sekali tidak lari.", "tag": "JLPT N4 · Des 2013 · choukai"}, {"jp": "<ruby>明日<rt>あした</rt></ruby>の<ruby>授業<rt>じゅぎょう</rt></ruby>までにテキストを30ページまで<ruby>読<rt>よ</rt></ruby>んでおかなければならないのに、まだ<ruby>全然<rt>ぜんぜん</rt></ruby><ruby>読<rt>よ</rt></ruby>んでいない。", "id": "Padahal aku harus sudah membaca buku teks sampai halaman 30 sebelum kelas besok, tapi sama sekali belum kubaca.", "tag": "JLPT N3"}, {"jp": "<ruby>去年<rt>きょねん</rt></ruby>はテレビコマーシャルを<ruby>流<rt>なが</rt></ruby>して、<ruby>派手<rt>はで</rt></ruby>に<ruby>宣伝<rt>せんでん</rt></ruby>したのに、ぜんぜん<ruby>売<rt>う</rt></ruby>れなかったんですよ。", "id": "Tahun lalu kami sudah pasang iklan TV dan promosi besar-besaran, tapi sama sekali tidak laku.", "tag": "JLPT N3 · Des 2019 · choukai"}]}, {"id": 117, "title": "117. 特に〜ない (tidak secara khusus; tidak ada yang khusus)", "rumus": "", "penjelasan": "menyatakan bahwa tidak ada hal yang khusus atau istimewa yang pantas disebut.", "tips": "selalu dipasangkan dengan bentuk negatif (〜ない・〜ません).\nhati-hati, tanpa bentuk negatif 特に artinya \"terutama; khususnya\".\nsering muncul sebagai jawaban singkat di kaiwa :\n「何か質問はありますか。」「いいえ、特にありません。」\n→ \"Ada pertanyaan?\" \"Tidak, tidak ada (yang khusus).\"\n※ memang terasa aneh dalam bahasa indonesia, ini kayak sama aja dengan ありません atau ない", "examples": [], "jlpt": [{"jp": "<ruby>今<rt>いま</rt></ruby>は<ruby>特<rt>とく</rt></ruby>にほしいものはありません。", "id": "Sekarang tidak ada barang yang khusus saya inginkan.", "tag": "JLPT N4"}, {"jp": "え？<ruby>今日<rt>きょう</rt></ruby><ruby>来<rt>く</rt></ruby>るという<ruby>連絡<rt>れんらく</rt></ruby>は<ruby>特<rt>とく</rt></ruby>になかったですが、どうしたんでしょうか。", "id": "Eh? Tidak ada kabar khusus kalau beliau datang hari ini, ada apa ya?", "tag": "JLPT N4 · Jul 2025 · choukai"}, {"jp": "<ruby>今日<rt>きょう</rt></ruby>は、<ruby>特<rt>とく</rt></ruby>に<ruby>必要<rt>ひつよう</rt></ruby>なものないよ。", "id": "Hari ini nggak ada barang yang khusus dibutuhkan, kok.", "tag": "JLPT N3 · Jul 2018 · choukai"}, {"jp": "<ruby>最近<rt>さいきん</rt></ruby>、<ruby>夜<rt>よる</rt></ruby>、なかなか<ruby>眠<rt>ねむ</rt></ruby>れないことが<ruby>多<rt>おお</rt></ruby>くて<ruby>困<rt>こま</rt></ruby>ってるんです。ストレスは<ruby>特<rt>とく</rt></ruby>にないんですけど・・・。", "id": "Akhir-akhir ini saya sering susah tidur kalau malam, dan itu bikin saya repot. Padahal stres sih nggak ada yang khusus...", "tag": "JLPT N3 · Des 2024 · choukai"}]}, {"id": 118, "title": "118. ほとんど〜ない (hampir tidak ada)", "rumus": "", "penjelasan": "menyatakan bahwa sesuatu hampir tidak ada atau hampir tidak terjadi — jumlah atau frekuensinya sangat sedikit.", "tips": "tidak selalu dipasangkan dengan bentuk negatif (〜ない・〜ません).\nhati-hati, tanpa bentuk negatif ほとんど artinya justru \"hampir semua\".\njadi lihat akhir kalimatnya : negatif atau tidak.\ncontoh :\nほとんど食べた。\n→ Hampir semuanya sudah dimakan.\nほとんど食べなかった。\n→ Hampir tidak makan.\n\ntingkat \"tidak\"-nya :\nあまり〜ない - tidak terlalu\nほとんど〜ない - hampir tidak\n全然〜ない - sama sekali tidak", "examples": [], "jlpt": [{"jp": "<ruby>大<rt>おお</rt></ruby>きい<ruby>声<rt>こえ</rt></ruby>を<ruby>出<rt>だ</rt></ruby>して<ruby>笑<rt>わら</rt></ruby>ったことは、<ruby>最近<rt>さいきん</rt></ruby>はほとんどありませんでした。", "id": "Akhir-akhir ini, saya hampir tidak pernah tertawa keras-keras.", "tag": "JLPT N4"}, {"jp": "この<ruby>魚<rt>さかな</rt></ruby>は、<ruby>日本<rt>にほん</rt></ruby>にはほとんどいないめずらしい<ruby>魚<rt>さかな</rt></ruby>です。", "id": "Ikan ini adalah ikan langka yang hampir tidak ada di Jepang.", "tag": "JLPT N4 · Jul 2025"}, {"jp": "ゆうべはほとんど<ruby>寝<rt>ね</rt></ruby>ていないので、<ruby>今日<rt>きょう</rt></ruby>は<ruby>眠<rt>ねむ</rt></ruby>くて<ruby>何度<rt>なんど</rt></ruby>もあくびが<ruby>出<rt>で</rt></ruby>てしまう。", "id": "Tadi malam aku hampir tidak tidur, jadi hari ini ngantuk dan berkali-kali menguap.", "tag": "JLPT N3"}, {"jp": "<ruby>雨<rt>あめ</rt></ruby>の<ruby>日<rt>ひ</rt></ruby>が<ruby>何日<rt>なんにち</rt></ruby>も<ruby>続<rt>つづ</rt></ruby>いたので、<ruby>雨<rt>あめ</rt></ruby>がほとんど<ruby>降<rt>ふ</rt></ruby>らないふるさとが<ruby>懐<rt>なつ</rt></ruby>かしくなりました。", "id": "Karena hari hujan berlangsung berhari-hari, aku jadi kangen kampung halamanku yang hampir tidak pernah hujan.", "tag": "JLPT N3 · Des 2021"}]}, {"id": 119, "title": "119. 〜てもしかたがない (percuma; tidak ada gunanya)", "rumus": "Bentuk ても", "penjelasan": "menyatakan bahwa melakukan sesuatu itu percuma karena hasilnya tidak akan berubah.", "tips": "bentuk lain : 〜てもしかたない、〜てもしょうがない (しょうがない lebih kasual).\n\n⚠️ jangan tertukar dengan 〜てしかたがない (sangat; merasa... sekali) :\n心配でしかたがない。\n→ Khawatir sekali.\n心配してもしかたがない。\n→ Percuma khawatir.\nbedanya hanya ada も atau tidak, tapi artinya jauh berbeda.", "examples": [{"jp": "<ruby>終<rt>お</rt></ruby>わったことを<ruby>考<rt>かんが</rt></ruby>えてもしかたがない。", "id": "Percuma memikirkan hal yang sudah berlalu."}, {"jp": "<ruby>今<rt>いま</rt></ruby>さら<ruby>後悔<rt>こうかい</rt></ruby>してもしょうがない。", "id": "Sekarang menyesal pun percuma."}], "jlpt": [{"jp": "<ruby>石田<rt>いしだ</rt></ruby>さん<ruby>来<rt>こ</rt></ruby>ないね。ずっと<ruby>駅<rt>えき</rt></ruby>で<ruby>待<rt>ま</rt></ruby>っていても<ruby>仕方<rt>しかた</rt></ruby>ないね。", "id": "Ishida-san nggak datang, ya. Percuma juga kalau kita terus menunggu di stasiun.", "tag": "JLPT N3 · Des 2020 · choukai"}, {"jp": "<ruby>始<rt>はじ</rt></ruby>める<ruby>前<rt>まえ</rt></ruby>から<ruby>心配<rt>しんぱい</rt></ruby>ばかりしていても<ruby>仕方<rt>しかた</rt></ruby>ないでしょう。<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>だよ。", "id": "Percuma kalau terus khawatir padahal belum mulai. Pasti baik-baik saja.", "tag": "JLPT N3 · Des 2020"}]}, {"id": 120, "title": "120. 〜てもしかたがない (wajar saja kalau)", "rumus": "Bentuk ても", "penjelasan": "menyatakan bahwa suatu hal wajar terjadi dalam keadaan itu, sehingga bisa dimaklumi.", "tips": "dipakai untuk memaklumi kesalahan atau keadaan orang lain.\nsering diawali alasan seperti 〜んだから・〜だから.\nbentuk lain : 〜てもしかたない、〜てもしょうがない (しょうがない lebih kasual).", "examples": [{"jp": "<ruby>初<rt>はじ</rt></ruby>めての<ruby>仕事<rt>しごと</rt></ruby>なんだから、<ruby>失敗<rt>しっぱい</rt></ruby>してもしょうがないよ。", "id": "Namanya juga pekerjaan pertama, wajar saja kalau gagal."}, {"jp": "こんなに<ruby>暑<rt>あつ</rt></ruby>いんだから、<ruby>疲<rt>つか</rt></ruby>れてもしかたがない。", "id": "Sepanas ini, wajar saja kalau capek."}], "jlpt": []}, {"id": 121, "title": "121. 〜って (katanya)", "rumus": "Kalimat Bentuk Biasa ＋って\nKata Benda dan Kata Sifat na ＋だ atau ＋だった", "penjelasan": "menyampaikan informasi dari sumber lain.", "tips": "sangat kasual, dan merupakan bentuk tidak formal dari 〜と.\nbunpou 〜と diikuti kata seperti 〜と聞いています atau 〜と言っています, tapi pada bunpou って lebih sering dihilangkan (tentu saja boleh diisi kalau mau).", "examples": [], "jlpt": [{"jp": "あ、<ruby>今週<rt>こんしゅう</rt></ruby><ruby>試験<rt>しけん</rt></ruby>があるって<ruby>言<rt>い</rt></ruby>ってたね。", "id": "Oh iya, katanya minggu ini ada ujian, ya.", "tag": "JLPT N4 · Des 2021 · choukai"}, {"jp": "もしもし、<ruby>今<rt>いま</rt></ruby><ruby>駅前<rt>えきまえ</rt></ruby>の<ruby>靴<rt>くつ</rt></ruby><ruby>屋<rt>や</rt></ruby>にいるんだけど、<ruby>前<rt>まえ</rt></ruby>にお<ruby>母<rt>かあ</rt></ruby>さんが<ruby>欲<rt>ほ</rt></ruby>しいって<ruby>言<rt>い</rt></ruby>っていたサンダルが<ruby>千円<rt>せんえん</rt></ruby>も<ruby>安<rt>やす</rt></ruby>くなってるよ。", "id": "Halo, saya sekarang lagi di toko sepatu depan stasiun. Sandal yang dulu Ibu bilang Ibu inginkan itu sekarang lebih murah sampai 1.000 yen, lho.", "tag": "JLPT N4 · Des 2021 · choukai"}, {"jp": "<ruby>工事<rt>こうじ</rt></ruby>、<ruby>遅<rt>おく</rt></ruby>れてるんだって？", "id": "Katanya proyeknya molor, ya?", "tag": "JLPT N3 · Des 2024 · choukai"}, {"jp": "<ruby>前<rt>まえ</rt></ruby>にテレビで<ruby>見<rt>み</rt></ruby>たけど、<ruby>他<rt>た</rt></ruby>の<ruby>町<rt>まち</rt></ruby>では<ruby>温泉<rt>おんせん</rt></ruby>を<ruby>利用<rt>りよう</rt></ruby>して<ruby>作<rt>つく</rt></ruby>った<ruby>電気<rt>でんき</rt></ruby>を<ruby>近<rt>ちか</rt></ruby>くの<ruby>病院<rt>びょういん</rt></ruby>で<ruby>使<rt>つか</rt></ruby>ったりしてるんだって。", "id": "Aku pernah lihat di TV, katanya di kota lain listrik yang dibuat dengan memanfaatkan onsen dipakai di rumah sakit terdekat.", "tag": "JLPT N3 · Des 2025 · choukai"}]}, {"id": 122, "title": "122. 〜のようだ・〜みたいだ (mirip; terlihat seperti)", "rumus": "よう\nKata Kerja - Bentuk Biasa\nKata Benda - ＋の\nみたい\nKata Kerja - Bentuk Biasa\nKata Benda - ✅", "penjelasan": "menyatakan bahwa sesuatu tampak seperti, menyerupai, atau terlihat seperti sesuatu yang lain.", "tips": "bisa dipakai untuk perbandingan visual, kesan, atau metafora.\n\nkapan menggunakan ようだ、ように、dan ような :\nようだ biasanya ada di akhir kalimat, atau biasanya digabungkan dengan bunpou lain untuk menyambung kalimat, seperti から.\nように digunakan jika kalimat B yang dimaksud adalah Kata Sifat atau Kata Kerja.\nような digunakan jika kalimat B yang dimaksud adalah Kata Benda.\n\nbunpou ini sangat mirip dengan みたいだ、みたいに、 dan みたいな\nkalian hanya perlu menghafal perbedaan rumusnya saja :\nみたいだ、みたいに dan みたいな tidak usah menambahkan の pada saat digunakan bersama Kata Benda", "examples": [], "jlpt": [{"jp": "A「<ruby>草色<rt>くさいろ</rt></ruby>というのはどんな<ruby>色<rt>いろ</rt></ruby>ですか。」B「<ruby>今<rt>いま</rt></ruby>わたしが<ruby>着<rt>き</rt></ruby>ているシャツのような、こんな<ruby>色<rt>いろ</rt></ruby>です。」", "id": "A: Warna kusairo (hijau rumput) itu warna yang seperti apa? B: Warna seperti ini, mirip kemeja yang sedang saya pakai sekarang.", "tag": "JLPT N4"}, {"jp": "<ruby>母<rt>はは</rt></ruby>の<ruby>料理<rt>りょうり</rt></ruby>はとてもおいしいです。<ruby>私<rt>わたし</rt></ruby>も<ruby>母<rt>はは</rt></ruby>みたいに<ruby>料理<rt>りょうり</rt></ruby>が<ruby>上手<rt>じょうず</rt></ruby>になりたいです。", "id": "Masakan ibu saya sangat enak. Saya juga ingin pandai memasak seperti ibu.", "tag": "JLPT N4 · Jul 2025"}, {"jp": "あの<ruby>兄弟<rt>きょうだい</rt></ruby>は<ruby>双子<rt>ふたご</rt></ruby>みたいに<ruby>顔<rt>かお</rt></ruby>がそっくりで、<ruby>区別<rt>くべつ</rt></ruby>できないね。", "id": "Kakak-adik itu wajahnya mirip banget seperti anak kembar, sampai nggak bisa dibedakan, ya.", "tag": "JLPT N3"}, {"jp": "<ruby>畳<rt>たたみ</rt></ruby>に<ruby>座<rt>すわ</rt></ruby>ると<ruby>乾<rt>かわ</rt></ruby>いた<ruby>草<rt>くさ</rt></ruby>のような<ruby>香<rt>かお</rt></ruby>りがして、とても<ruby>落<rt>お</rt></ruby>ち<ruby>着<rt>つ</rt></ruby>きました。", "id": "Waktu duduk di atas tatami, tercium aroma seperti rumput kering, dan rasanya tenang sekali.", "tag": "JLPT N3"}]}, {"id": 123, "title": "123. 〜てもらいたい・〜ていただきたい・〜てほしい (saya ingin anda melakukan; aku ingin kamu untuk melakukan)", "rumus": "Kata Kerja - Vて\nKata Kerja - Vないで", "penjelasan": "menyatakan keinginan agar orang lain melakukan sesuatu untuk kita.", "tips": "・てほしい - kasual\n・てもらいたい - lebih sopan dari てほしい\n・ていただきたい - sangat sopan\nuntuk bentuk negatif て diubah menjadi ないで\nkhusus てほしい bisa diubah menjadi てほしくない\nkalau bingung pada saat men-translate, ganti saja bunpou-bunpou ini menjadi てください karena secara teknis artinya sama saja tapi jauh lebih sopan.\n\nBunpou ini sudah muncul lebih dari 70x di ujian choukai, dan kemungkinan besar akan muncul lagi.", "examples": [], "jlpt": [{"jp": "<ruby>歌<rt>うた</rt></ruby>の<ruby>時<rt>とき</rt></ruby>、ジョンさんにギターを<ruby>弾<rt>ひ</rt></ruby>いてもらいたいんです。<ruby>前<rt>まえ</rt></ruby>に<ruby>弾<rt>ひ</rt></ruby>いてくれたとき、すごく<ruby>上手<rt>じょうず</rt></ruby>でしたから。", "id": "Saya ingin John-san memainkan gitar waktu kita bernyanyi. Soalnya waktu dulu John-san memainkannya, bagus sekali.", "tag": "JLPT N4 · Des 2025 · choukai"}, {"jp": "<ruby>机<rt>つくえ</rt></ruby>の<ruby>下<rt>した</rt></ruby>に<ruby>自分<rt>じぶん</rt></ruby>の<ruby>消<rt>け</rt></ruby>しゴムが<ruby>落<rt>お</rt></ruby>ちました。<ruby>友達<rt>ともだち</rt></ruby>に<ruby>取<rt>と</rt></ruby>ってもらいたいです。", "id": "Penghapus saya jatuh ke bawah meja. Saya ingin teman saya mengambilkannya.", "tag": "JLPT N4 · Jul 2018 · choukai"}, {"jp": "<ruby>商品<rt>しょうひん</rt></ruby>が<ruby>品切<rt>しなぎ</rt></ruby>れで、<ruby>届<rt>とど</rt></ruby>けるまでに<ruby>時間<rt>じかん</rt></ruby>がかかるから、どうしたいかを<ruby>知<rt>し</rt></ruby>らせてほしい。", "id": "Barangnya sedang habis dan butuh waktu sampai bisa dikirim, jadi kami ingin Anda memberi tahu mau bagaimana.", "tag": "JLPT N3"}, {"jp": "これまでと<ruby>変<rt>か</rt></ruby>わらないやり<ruby>方<rt>かた</rt></ruby>で<ruby>包丁<rt>ほうちょう</rt></ruby>を<ruby>作<rt>つく</rt></ruby>っていってほしい", "id": "Aku ingin mereka terus membuat pisau dengan cara yang sama seperti selama ini.", "tag": "JLPT N3"}]}, {"id": 124, "title": "124. もし (kalau)", "rumus": "", "penjelasan": "menandai bahwa kalimat yang mengikutinya adalah pengandaian atau syarat.", "tips": "selalu dipasangkan dengan bunpou syarat seperti 〜たら、〜ば、〜なら, atau 〜ても.\nもし di sini hanya pelengkap.\ntanpa もし juga artinya tetap \"kalau\", karena yang membawa arti \"kalau\" adalah 〜たら・〜ば・〜なら.", "examples": [], "jlpt": [{"jp": "でも、もし<ruby>両親<rt>りょうしん</rt></ruby>に<ruby>反対<rt>はんたい</rt></ruby>されても<ruby>東京<rt>とうきょう</rt></ruby>で<ruby>勉強<rt>べんきょう</rt></ruby>するつもりです。", "id": "Tapi, kalaupun orang tua saya menentang, saya tetap berniat belajar di Tokyo.", "tag": "JLPT N4"}, {"jp": "ですから、もし<ruby>好<rt>す</rt></ruby>きな<ruby>人<rt>ひと</rt></ruby>に<ruby>映画<rt>えいが</rt></ruby>に<ruby>誘<rt>さそ</rt></ruby>われても、<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>行<rt>い</rt></ruby>かないかもしれません。", "id": "Karena itu, kalaupun diajak nonton film oleh orang yang saya suka, mungkin saya tidak akan pergi bersamanya.", "tag": "JLPT N4 · Jul 2025"}, {"jp": "<ruby>私<rt>わたし</rt></ruby>は、もし<ruby>自分<rt>じぶん</rt></ruby>が<ruby>患者<rt>かんじゃ</rt></ruby>だったらどうしてほしいかということを<ruby>考<rt>かんが</rt></ruby>えながら<ruby>看護<rt>かんご</rt></ruby><ruby>師<rt>し</rt></ruby>の<ruby>仕事<rt>しごと</rt></ruby>をしています。", "id": "Aku bekerja sebagai perawat sambil memikirkan, kalau aku sendiri yang jadi pasien, aku ingin diperlakukan seperti apa.", "tag": "JLPT N3"}, {"jp": "もし、フライとか<ruby>油<rt>あぶら</rt></ruby>をたくさん<ruby>使<rt>つか</rt></ruby>ったものが<ruby>多<rt>おお</rt></ruby>いならそういうのは<ruby>昼食<rt>ちゅうしょく</rt></ruby>にして、<ruby>夕食<rt>ゆうしょく</rt></ruby>は<ruby>軽<rt>かる</rt></ruby>いものにしてみてください。", "id": "Kalau makanannya banyak yang digoreng atau pakai banyak minyak, yang seperti itu dijadikan makan siang saja, dan coba makan malamnya yang ringan-ringan.", "tag": "JLPT N3 · Des 2024 · choukai"}]}];

                html += `

        // PENYIMPANAN PROGRES BUNPOU DI LOCALSTORAGE (TERPISAH N3 & N4)
        function loadDoneBunpou() {
            try {
                const raw = localStorage.getItem(getActiveBunpouStorageKey());
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        function toggleBunpouDone(id) {
            try {
                let list = loadDoneBunpou();
                if (list.includes(id)) {
                    list = list.filter(x => x !== id);
                } else {
                    list.push(id);
                }
                localStorage.setItem(getActiveBunpouStorageKey(), JSON.stringify(list));
            } catch (e) {}
            renderBunpouList();
            const isDone = loadDoneBunpou().includes(id);
            const btn = document.getElementById("btn-faham-detail");
            if (btn) {
                btn.className = isDone ? "btn-faham is-done" : "btn-faham";
                btn.innerText = isDone ? "✔ Sudah Paham" : "Tandai Paham";
            }
        }

        function resetBunpouProgress() {
            try {
                localStorage.removeItem(getActiveBunpouStorageKey());
            } catch (e) {}
            renderBunpouList();
        }

        // RENDER DAFTAR JUDUL BUNPOU
        function renderBunpouList() {
            const bunpouListEl = document.getElementById("bunpou-list");
            const dataArr = getActiveBunpouArray();
            const doneList = loadDoneBunpou();
            bunpouListEl.innerHTML = "";
            dataArr.forEach(item => {
                const isDone = doneList.includes(item.id);
                const btn = document.createElement("button");
                btn.className = isDone ? "bunpou-title-btn is-done" : "bunpou-title-btn";
                btn.innerHTML = `<span>${item.title}</span>${isDone ? '<span class="bunpou-done-badge">✔ Paham</span>' : ''}`;
                btn.onclick = () => openBunpouDetail(item.id);
                bunpouListEl.appendChild(btn);
            });
            document.getElementById("bunpou-progress-text").innerText = `Paham (${activeBunpouLevel}): ${doneList.length} / ${dataArr.length} Materi`;
        }
        renderBunpouList();

        function loadCompletedDays() {

                const raw = localStorage.getItem(KOTOBA_STORAGE_KEY);

        }

        function saveCompletedDay(dayNumber) {
            try {
                const list = loadCompletedDays();
                if (!list.includes(dayNumber)) {
                    list.push(dayNumber);

        // BIKIN TOMBOL 70 HARI
        function renderDayGrid() {
            const grid = document.getElementById("day-grid");
            const completedDays = loadCompletedDays();
            grid.innerHTML = "";
            for (let i = 1; i <= 70; i++) {
                const btn = document.createElement("button");
                if (kotobaData[i]) {
                    const isDone = completedDays.includes(i);
                    btn.innerText = isDone ? `Day ${i} ✔` : `Day ${i}`;
                    btn.className = isDone ? "day-btn day-done" : "day-btn day-active";
                    btn.onclick = () => startSesi(i);
                } else {
                    btn.innerText = `Day ${i}`;
                    btn.className = "day-btn day-locked";
                    btn.title = "Belum ada data";
                }
                grid.appendChild(btn);
            }
            const totalActive = Object.keys(kotobaData).length;
            const doneCount = completedDays.filter(d => kotobaData[d]).length;
            document.getElementById("kotoba-progress-text").innerText = `Tuntas: ${doneCount} / ${totalActive} Hari`;
        }

        function showToast(msg) {

                }, 2500);

        // FUNGSI SUARA JEPANG (KOMPATIBEL IPHONE / IOS SAFARI)
        let jaVoice = null;
        function loadJaVoice() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            if (voices && voices.length > 0) {
                jaVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ja')) || null;
            }
        }
        if ('speechSynthesis' in window) {
            loadJaVoice();
            if (typeof window.speechSynthesis.onvoiceschanged !== 'undefined') {
                window.speechSynthesis.onvoiceschanged = loadJaVoice;
            }
        }

        function unlockIosSpeech() {
            if (!('speechSynthesis' in window)) return;
            try {
                const u = new SpeechSynthesisUtterance('');
                u.volume = 0;
                window.speechSynthesis.speak(u);
            } catch (e) {}
        }

        function speakJapanese(text, event) {
            if (event) event.stopPropagation();
            if (!('speechSynthesis' in window) || !text) return;

            loadJaVoice();
            let cleanText = text.split("※")[0].trim();

            const doSpeak = () => {
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'ja-JP';
                if (jaVoice) utterance.voice = jaVoice;
                utterance.rate = 0.95;
                utterance.volume = 1;
                window.speechSynthesis.speak(utterance);
            };

            if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
                window.speechSynthesis.cancel();
                setTimeout(doSpeak, 60);
            } else {
                doSpeak();
            }
        }

        function startSesi(dayNumber) {
            unlockIosSpeech();
            stopAutoPlay();
            activeDay = dayNumber;
            currentQueue = [...kotobaData[dayNumber]];
            reviewQueue = [];
            historyStack = [];
            currentIndex = 0;
            round = 1;
            isFlipped = false;
            showToast("");

            document.getElementById("flashcard").classList.remove("is-flipped");
            document.getElementById("current-day-title").innerText = `Day ${dayNumber}`;
            document.getElementById("menu-view").style.display = "none";
            document.getElementById("flashcard-view").style.display = "flex";
            document.getElementById("controls").style.display = "flex";
            document.getElementById("autoplay-panel").style.display = "inline-flex";

            renderCardContent();
        }

            stopAutoPlay();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById("menu-view").style.display = "flex";
            document.getElementById("flashcard-view").style.display = "none";
        }

        function updateCard() {
            if (isFlipped) {
                isTransitioning = true;
                document.getElementById("flashcard").classList.remove("is-flipped");
                isFlipped = false;

                setTimeout(() => {
                    renderCardContent();
                    isTransitioning = false;
                }, 220);
            } else {
                renderCardContent();
            }
        }

        function renderCardContent() {
            if (currentIndex >= currentQueue.length) {
                if (reviewQueue.length > 0) {
                    stopAutoPlay();
                    currentQueue = [...reviewQueue];
                    reviewQueue = [];
                    currentIndex = 0;
                    historyStack = [];
                    round++;
                    showToast("Sesi pengulangan untuk kata yang 'Belum' diingat!");
                } else {
                    stopAutoPlay();
                    saveCompletedDay(activeDay);
                    renderDayGrid();
                    document.getElementById("card-front").innerText = "🎉 Selesai!";
                    document.getElementById("card-back").innerHTML = `<div class="arti-indo">Day ${activeDay} Tuntas!</div>`;
                    document.getElementById("status-text").innerText = "Semua kosakata berhasil dihafal!";
                    document.getElementById("controls").style.display = "none";
                    document.getElementById("autoplay-panel").style.display = "none";
                    document.getElementById("flashcard").classList.remove("is-flipped");
                    isFlipped = false;
                    return;
                }
            }

            let rawJa = currentQueue[currentIndex].ja;
            let artiId = currentQueue[currentIndex].id;

            let teksDepan = rawJa;
            let teksBacaan = "";

            if (rawJa.includes("（") && rawJa.includes("）")) {
                let parts = rawJa.split("（");
                teksDepan = parts[0].trim();
                teksBacaan = parts[1].replace("）", "").trim();
            } else if (rawJa.includes("(") && rawJa.includes(")")) {
                let parts = rawJa.split("(");
                teksDepan = parts[0].trim();
                teksBacaan = parts[1].replace(")", "").trim();
            }

            currentAudioText = teksBacaan !== "" ? teksBacaan : teksDepan;

            document.getElementById("card-front").innerText = teksDepan;

            let noteHtml = currentQueue[currentIndex].note ? `<div class="kotoba-note">${currentQueue[currentIndex].note}</div>` : "";
            if (teksBacaan !== "") {
                document.getElementById("card-back").innerHTML = `
                    <div class="bacaan-wrapper">
                        <div class="bacaan-jepang">${teksBacaan}</div>
                        <button class="btn-speak" onclick="speakJapanese(currentAudioText, event)" title="Dengarkan suara">🔊</button>
                    </div>
                    <div class="arti-indo">${artiId}</div>
                    ${noteHtml}
                `;
            } else {
                document.getElementById("card-back").innerHTML = `
                    <div class="bacaan-wrapper">
                        <div class="arti-indo">${artiId}</div>
                        <button class="btn-speak" onclick="speakJapanese(currentAudioText, event)" title="Dengarkan suara">🔊</button>
                    </div>
                    ${noteHtml}
                `;
            }

            let statusText = `Putaran ${round} | Kata ${currentIndex + 1} dari ${currentQueue.length}`;
            if (reviewQueue.length > 0) statusText += ` (${reviewQueue.length} ngulang)`;
            document.getElementById("status-text").innerText = statusText;
        }

        function flipCard() {
            if (isTransitioning) return;
            if (currentIndex >= currentQueue.length && reviewQueue.length === 0) return;
            isFlipped = !isFlipped;
            document.getElementById("flashcard").classList.toggle("is-flipped", isFlipped);

            if (isFlipped) {
                speakJapanese(currentAudioText);
            }
        }

        function manualFlip() {
            stopAutoPlay();
            flipCard();
        }

        function markIngat() {
            if (isTransitioning) return;
            stopAutoPlay();
            if (currentIndex >= currentQueue.length) return;
            historyStack.push({ word: currentQueue[currentIndex], status: 'ingat' });
            currentIndex++;
            updateCard();
        }

        function markBelum() {
            if (isTransitioning) return;
            stopAutoPlay();
            if (currentIndex >= currentQueue.length) return;
            historyStack.push({ word: currentQueue[currentIndex], status: 'belum' });
            reviewQueue.push(currentQueue[currentIndex]);
            currentIndex++;
            updateCard();
        }

        function goBack() {
            if (isTransitioning) return;
            stopAutoPlay();
            if (historyStack.length === 0) {
                showToast("Ini adalah kata pertama, tidak bisa kembali.");
                return;
            }
            const lastAction = historyStack.pop();
            if (lastAction.status === 'belum') {
                reviewQueue.pop();
            }
            currentIndex--;
            updateCard();
        }

        function toggleAutoPlay() {
            if (isAutoPlaying) {
                stopAutoPlay();
            } else {
                startAutoPlay();
            }
        }

        function startAutoPlay() {
            unlockIosSpeech();
            if (currentIndex >= currentQueue.length) return;
            isAutoPlaying = true;
            const btnPlay = document.getElementById("btn-play");
            btnPlay.innerText = "⏸ Pause";
            btnPlay.classList.add("playing");
            runAutoPlayStep();
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            clearTimeout(autoPlayTimer);
            const btnPlay = document.getElementById("btn-play");
            if (btnPlay) {
                btnPlay.innerText = "▶ Play";
                btnPlay.classList.remove("playing");
            }
        }

        function changeSpeed() {
            if (isAutoPlaying) {
                clearTimeout(autoPlayTimer);
                runAutoPlayStep();
            }
        }

        function runAutoPlayStep() {
            if (!isAutoPlaying) return;
            const delay = parseInt(document.getElementById("speed-select").value);

            autoPlayTimer = setTimeout(() => {
                if (!isAutoPlaying) return;

                if (!isFlipped) {
                    flipCard();
                    runAutoPlayStep();
                } else {
                    currentIndex++;
                    if (currentIndex >= currentQueue.length) {
                        currentIndex = 0;
                    }
                    updateCard();
                    runAutoPlayStep();
                }
            }, delay);
        }

        // SEMBUNYIKAN LOAD SCREEN SEBELUM TAMPIL HOME
        window.addEventListener("DOMContentLoaded", () => {
            const splash = document.getElementById("splash-screen");
            if (splash) {
                setTimeout(() => {
                    splash.classList.add("fade-out");
                    setTimeout(() => {
                        splash.style.display = "none";
                    }, 450);
                }, 1300);
            }
        });

        // SETUP PWA MANIFEST & ICON AGAR BISA DI-INSTALL FULLSCREEN DI HP
        (function setupPWA() {
            try {
                const canvas = document.createElement("canvas");
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext("2d");
                if (ctx) {
                    ctx.fillStyle = "#1B233D";
                    ctx.fillRect(0, 0, 512, 512);
                    ctx.fillStyle = "#E5D9C3";
                    ctx.font = "bold 160px sans-serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("N3", 256, 220);
                    ctx.font = "bold 56px sans-serif";
                    ctx.fillStyle = "#C7BA9F";
                    ctx.fillText("EZZZ", 256, 340);
                    const iconUrl = canvas.toDataURL("image/png");
                    const appleIcon = document.getElementById("apple-icon");
                    if (appleIcon) appleIcon.href = iconUrl;

                    const manifest = {
                        name: "N3 EZZZ - Belajar Bahasa Jepang",
                        short_name: "N3 EZZZ",
                        start_url: ".",
                        display: "standalone",
                        background_color: "#1B233D",
                        theme_color: "#1B233D",
                        icons: [
                            { src: iconUrl, sizes: "192x192", type: "image/png" },
                            { src: iconUrl, sizes: "512x512", type: "image/png" }
                        ]
                    };
                    const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
                    const manifestEl = document.getElementById("pwa-manifest");
                    if (manifestEl) manifestEl.href = URL.createObjectURL(blob);
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>
