<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1B233D">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="N3 EZZZ">
    <link rel="manifest" id="pwa-manifest">
    <link rel="apple-touch-icon" id="apple-icon">
    <title>N3 EZZZ — Aplikasi Belajar Bahasa Jepang</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #E5D9C3; margin: 0; padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); display: flex; flex-direction: column; align-items: center; color: #1B233D; min-height: 100vh; box-sizing: border-box; }
        h1, h2 { color: #1B233D; text-align: center; }

        /* LOAD SCREEN */
        #splash-screen { position: fixed; inset: 0; background-color: #1B233D; color: #E5D9C3; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.45s ease; }
        #splash-screen.fade-out { opacity: 0; pointer-events: none; }
        .splash-title { font-size: 48px; font-weight: 800; letter-spacing: 3px; margin: 0; color: #E5D9C3; }
        .splash-sub { font-size: 13px; color: #C7BA9F; margin-top: 8px; letter-spacing: 1.5px; }

        /* HOME VIEW */
        #home-view { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 600px; margin-top: 40px; }
        .home-choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; width: 100%; margin-top: 24px; }
        .home-card-btn { padding: 36px 20px; font-size: 22px; font-weight: bold; border: 2px solid #1B233D; border-radius: 14px; cursor: pointer; box-shadow: 0 6px 16px rgba(27,35,61,0.12); transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .home-card-btn:hover { transform: translateY(-3px); opacity: 0.94; }
        .home-card-sub { font-size: 13px; font-weight: normal; opacity: 0.85; }
        .btn-home-bunpou { background-color: #1B233D; color: #E5D9C3; }
        .btn-home-kotoba { background-color: #FAF6EE; color: #1B233D; }

        /* MENU UTAMA KOTOBA (DAY 1 - 70) */
        #menu-view { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 800px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; width: 100%; margin-top: 20px; }
        .day-btn { padding: 15px 5px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-align: center; transition: 0.2s; }
        .day-active { background-color: #1B233D; color: #E5D9C3; box-shadow: 0 4px 8px rgba(27,35,61,0.14); }
        .day-active:hover { background-color: #273257; transform: translateY(-2px); }
        .day-locked { background-color: #D2C5AE; color: #7C7362; cursor: not-allowed; box-shadow: none; }
        .day-done { background-color: #3B5E4C; color: #FAF6EE; box-shadow: 0 4px 8px rgba(27,35,61,0.12); }
        .day-done:hover { background-color: #2F4D3E; transform: translateY(-2px); }
        .kotoba-progress-info { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #3D4663; font-weight: 600; }
        .btn-reset-progress { background-color: #8A7F6D; color: #FAF6EE; padding: 5px 10px; font-size: 12px; border-radius: 6px; box-shadow: none; }

        /* FLASHCARD VIEW KOTOBA */
        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .status { margin-bottom: 15px; font-size: 15px; color: #3D4663; font-weight: bold; }

        .card-container { perspective: 1000px; width: 350px; max-width: 100%; height: 260px; margin-bottom: 16px; cursor: pointer; }
        .kotoba-note { font-size: 12px; line-height: 1.45; color: #E5D9C3; background: rgba(255, 255, 255, 0.1); padding: 8px 10px; border-radius: 8px; max-height: 105px; overflow-y: auto; text-align: left; width: 100%; box-sizing: border-box; white-space: pre-line; }
        .card { width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; position: relative; border-radius: 15px; box-shadow: 0 10px 22px rgba(27,35,61,0.14); }
        .card.is-flipped { transform: rotateY(180deg); }

        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 15px; text-align: center; padding: 20px; box-sizing: border-box; }

        .card-front { background-color: #FAF6EE; color: #1B233D; border: 2px solid #D3C6AF; font-size: 40px; font-weight: bold; }
        .card-back { background-color: #1B233D; color: #FAF6EE; transform: rotateY(180deg); flex-direction: column; justify-content: center; gap: 12px; position: relative; }
        .bacaan-wrapper { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .bacaan-jepang { font-size: 30px; font-weight: bold; color: #E5D9C3; }
        .arti-indo { font-size: 19px; line-height: 1.4; color: #FAF6EE; }

        .btn-speak { background: rgba(229, 217, 195, 0.2); border: none; border-radius: 50%; width: 32px; height: 32px; padding: 0; font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: none; color: #E5D9C3; }
        .btn-speak:hover { background: rgba(229, 217, 195, 0.35); }

        .autoplay-controls { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px; background: #FAF6EE; padding: 5px 10px; border-radius: 20px; box-shadow: 0 2px 6px rgba(27,35,61,0.08); border: 1px solid #D3C6AF; }
        .btn-play { background-color: #1B233D; color: #E5D9C3; padding: 5px 12px; font-size: 12px; border-radius: 14px; box-shadow: none; min-width: 72px; }
        .btn-play.playing { background-color: #8E5B3E; color: #FAF6EE; }
        .speed-select { padding: 3px 6px; font-size: 12px; font-weight: 600; border-radius: 12px; border: 1px solid #D3C6AF; color: #1B233D; background: #F2ECE0; cursor: pointer; outline: none; }

        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        button { padding: 12px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: #FAF6EE; transition: opacity 0.2s, background-color 0.2s; box-shadow: 0 4px 8px rgba(27,35,61,0.12); }
        button:hover { opacity: 0.92; }

        .btn-back { background-color: #6E6A61; color: #FAF6EE; }
        .btn-belum { background-color: #A94438; color: #FAF6EE; }
        .btn-ingat { background-color: #3B5E4C; color: #FAF6EE; }
        .btn-menu { background-color: #1B233D; color: #E5D9C3; margin-bottom: 15px; padding: 8px 16px; font-size: 14px; }

        .toast-msg { min-height: 20px; font-size: 13px; color: #8E5B3E; font-weight: 600; margin-bottom: 8px; text-align: center; }

        /* BUNPOU LIST VIEW (SIMPLE) */
        #bunpou-list-view { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 700px; }
        .bunpou-level-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .bunpou-level-btn { padding: 8px 18px; font-size: 14px; font-weight: bold; border-radius: 20px; border: 2px solid #1B233D; background-color: #FAF6EE; color: #1B233D; cursor: pointer; box-shadow: none; transition: 0.15s; }
        .bunpou-level-btn.active { background-color: #1B233D; color: #E5D9C3; }
        .bunpou-list { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 12px; }
        .bunpou-title-btn { width: 100%; text-align: left; background-color: #FAF6EE; color: #1B233D; border: 1px solid #D3C6AF; padding: 14px 18px; border-radius: 10px; font-size: 16px; font-weight: 600; box-shadow: 0 2px 6px rgba(27,35,61,0.06); cursor: pointer; transition: 0.15s; }
        .bunpou-title-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .bunpou-title-btn:hover { background-color: #F2ECE0; border-color: #1B233D; }
        .bunpou-title-btn.is-done { background-color: #EEF4F0; border-color: #3B5E4C; }
        .bunpou-done-badge { font-size: 12px; font-weight: bold; color: #FAF6EE; background-color: #3B5E4C; padding: 3px 10px; border-radius: 12px; shrink: 0; white-space: nowrap; }
        .bunpou-detail-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #E2D8C5; padding-bottom: 12px; }
        .bunpou-detail-header h2 { border-bottom: none; padding-bottom: 0; margin: 0; }
        .btn-faham { background-color: #FAF6EE; color: #1B233D; border: 2px solid #1B233D; padding: 8px 16px; font-size: 13px; border-radius: 8px; box-shadow: none; }
        .btn-faham.is-done { background-color: #3B5E4C; color: #FAF6EE; border-color: #3B5E4C; }

        /* BUNPOU DETAIL VIEW (SIMPLE) */
        #bunpou-detail-view { display: none; flex-direction: column; align-items: flex-start; width: 100%; max-width: 700px; }
        .bunpou-card { width: 100%; background-color: #FAF6EE; border-radius: 12px; padding: 24px; box-sizing: border-box; box-shadow: 0 6px 16px rgba(27,35,61,0.1); border: 1px solid #D3C6AF; }
        .bunpou-card h2 { text-align: left; margin-top: 0; color: #1B233D; font-size: 24px; border-bottom: 1px solid #E2D8C5; padding-bottom: 12px; }
        .bunpou-section { margin-top: 18px; }
        .bunpou-section-title { font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.6px; color: #6B6356; margin-bottom: 8px; }
        .bunpou-text { font-size: 15px; line-height: 1.6; color: #1B233D; white-space: pre-line; }
        .bunpou-example { background-color: #F2ECE0; border-left: 3px solid #1B233D; padding: 10px 14px; border-radius: 6px; margin-bottom: 10px; }
        .bunpou-jp { font-size: 17px; line-height: 2; color: #1B233D; margin: 0 0 4px 0; }
        .bunpou-id { font-size: 14px; color: #4A4E5A; margin: 0; }
        .bunpou-tag { display: inline-block; font-size: 11px; font-weight: bold; color: #E5D9C3; background-color: #1B233D; padding: 2px 8px; border-radius: 10px; margin-bottom: 4px; }
        ruby { ruby-align: center; }
        rt { font-size: 0.6em; color: #6B6356; }

        @media (max-width: 480px) {
            .home-choices { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- LOAD SCREEN -->
    <div id="splash-screen">
        <div class="splash-title">N3 EZZZ</div>
        <div class="splash-sub">by bareumsan</div>
    </div>

    <!-- HALAMAN HOME -->
    <div id="home-view">
        <h1>Aplikasi Belajar Bahasa Jepang</h1>
        <p style="color:#3D4663; margin-top:0;">Pilih materi yang ingin dipelajari</p>
        <div class="home-choices">
            <button class="home-card-btn btn-home-bunpou" onclick="openBunpou()">
                <span>Bunpou</span>
                <span class="home-card-sub">Tata Bahasa N3 & N4</span>
            </button>
            <button class="home-card-btn btn-home-kotoba" onclick="openKotoba()">
                <span>Kotoba</span>
                <span class="home-card-sub">Flashcard Kosakata</span>
            </button>
        </div>
    </div>

    <!-- HALAMAN DAFTAR BUNPOU (HANYA JUDUL) -->
    <div id="bunpou-list-view">
        <button class="btn-menu" onclick="goHome()">← Kembali ke Home</button>
        <h1 style="margin: 5px 0 12px 0;">Bunpou</h1>
        <div class="bunpou-level-tabs">
            <button class="bunpou-level-btn active" id="tab-bunpou-n3" onclick="switchBunpouLevel('N3')">N3 (48)</button>
            <button class="bunpou-level-btn" id="tab-bunpou-n4" onclick="switchBunpouLevel('N4')">N4 / Dasar (124)</button>
        </div>
        <div class="kotoba-progress-info">
            <span id="bunpou-progress-text">Paham: 0 / 48 Materi</span>
            <button class="btn-reset-progress" onclick="resetBunpouProgress()">Reset Progres</button>
        </div>
        <div class="bunpou-list" id="bunpou-list"></div>
    </div>

    <!-- HALAMAN PENJELASAN BUNPOU -->
    <div id="bunpou-detail-view">
        <button class="btn-menu" onclick="backToBunpouList()">← Kembali ke Daftar Bunpou</button>
        <div class="bunpou-card" id="bunpou-detail-content"></div>
    </div>

    <!-- TAMPILAN MENU KOTOBA -->
    <div id="menu-view">
        <button class="btn-menu" onclick="goHome()">← Kembali ke Home</button>
        <h1 style="margin: 5px 0;">Pilih Sesi Belajar</h1>
        <p style="margin-top: 5px;">Target: 70 Hari</p>
        <div class="kotoba-progress-info">
            <span id="kotoba-progress-text">Tuntas: 0 Hari</span>
            <button class="btn-reset-progress" onclick="resetKotobaProgress()">Reset Progres</button>
        </div>
        <div class="grid-container" id="day-grid"></div>
    </div>

    <!-- TAMPILAN FLASHCARD KOTOBA -->
    <div id="flashcard-view">
        <button class="btn-menu" onclick="backToMenu()">☰ Kembali ke Menu</button>
        <h2 id="current-day-title" style="margin: 5px 0;">Day X</h2>
        <div class="status" id="status-text">Memuat...</div>
        <div class="toast-msg" id="toast-msg"></div>

        <div class="card-container" onclick="manualFlip()">
            <div class="card" id="flashcard">
                <div class="card-face card-front" id="card-front"></div>
                <div class="card-face card-back" id="card-back"></div>
            </div>
        </div>

        <div class="autoplay-controls" id="autoplay-panel">
            <button class="btn-play" id="btn-play" onclick="toggleAutoPlay()">▶ Play</button>
            <select class="speed-select" id="speed-select" onchange="changeSpeed()" title="Kecepatan Auto Play">
                <option value="3200">0.75x</option>
                <option value="2200" selected>1x</option>
                <option value="1400">1.5x</option>
            </select>
        </div>

        <div class="controls" id="controls">
            <button class="btn-back" onclick="goBack()">⟲ Back</button>
            <button class="btn-belum" onclick="markBelum()">Belum ✖</button>
            <button class="btn-ingat" onclick="markIngat()">Ingat ✔</button>
        </div>
    </div>

    <script>
        const r = (kanji, reading) => `<ruby>${kanji}<rt>${reading}</rt></ruby>`;

        // DATA BUNPOU N3 (48 MATERI)
        const bunpouData = [
            {
                id: 1,
                title: "1. 〜からといって",
                rumus: "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ＋だ\nKata Benda - ＋だ",
                penjelasan: "Menyatakan bahwa hanya karena alasan A, bukan berarti B (yang biasanya diasosiasikan dengan A) pasti benar atau terjadi.",
                tips: "Biasanya digunakan untuk menolak alasan yang terlalu sederhana atau terlalu umum.\nSering diikuti dengan:\n〜必ずしも〜ない\n〜とは限らない\n〜わけではない\n〜とは言えない",
                examples: [
                    { jp: `お${r("金","かね")}があるからといって、${r("幸","しあわ")}せとは${r("限","かぎ")}らない。`, id: "Hanya karena punya uang, bukan berarti pasti bahagia." },
                    { jp: `${r("留学","りゅうがく")}したからといって、${r("必","かなら")}ずしも${r("外国語","がいこくご")}が${r("上手","じょうず")}になるとは${r("限","かぎ")}らない。`, id: "Hanya karena pernah studi ke luar negeri bukan berarti pasti jadi mahir bahasa asing." },
                    { jp: `${r("忙","いそが")}しいからといって、${r("食事","しょくじ")}を${r("抜","ぬ")}くのはよくない。`, id: "Hanya karena sibuk, bukan berarti boleh melewatkan makan. (食事を抜く = skip makan)" }
                ],
                jlpt: [
                    { jp: `${r("安","やす")}いからといって、${r("必要","ひつよう")}のない${r("物","もの")}やしまう${r("場所","ばしょ")}のない${r("物","もの")}を${r("次々","つぎつぎ")}と${r("買","か")}えば、${r("部屋","へや")}が${r("片付","かたづ")}かないのは${r("当然","とうぜん")}だ。`, id: "Hanya karena murah, kalau kita terus-menerus membeli barang yang tidak perlu atau barang yang tidak ada tempat menyimpannya, wajar saja kalau kamar jadi tidak pernah rapi.", tag: "JLPT N3 · Des 2021" }
                ]
            },
            {
                id: 2,
                title: "2. 〜ことから",
                rumus: "Kata Kerja Bentuk Biasa ＋ことから\nKata Sifat i - 🔺(secara rumus bisa, tapi tidak lazim digunakan)\nKata Sifat na - ＋な\nKata Benda ＋から",
                penjelasan: "Menunjukkan alasan, sebab, atau asal mula sesuatu terjadi.",
                tips: "Anggap bunpou ini adalah penggabungan \"から - dari\" dan \"から - alasan\".\nから pada N5 menjawab pertanyaan \"Kenapa?\" sedangkan から・ことから menjawab pertanyaan \"Dari mana?\"",
                examples: [
                    { jp: `この${r("坂","さか")}は${r("富士山","ふじさん")}が${r("見","み")}えることから、「${r("富士見坂","ふじみざか")}」と${r("呼","よ")}ばれている。`, id: "Karena dari tanjakan ini bisa melihat Gunung Fuji, tanjakan ini disebut \"Fujimizaka.\" (Q : dari mana asal nama Fujimizaka ini?)" },
                    { jp: `${r("声","こえ")}が${r("震","ふる")}えていたことから、${r("彼","かれ")}が${r("緊張","きんちょう")}しているのがわかった。`, id: "Dari suaranya yang bergetar, saya tahu bahwa dia sedang gugup. (Q : dari mana kamu tahu dia sedang gugup?)" }
                ],
                jlpt: [
                    { jp: `この${r("島","しま")}は、${r("空","そら")}から${r("見","み")}ると${r("人","ひと")}の${r("耳","みみ")}のような${r("形","かたち")}に${r("見","み")}えることから「${r("耳島","みみとう")}」と${r("呼","よ")}ばれています。`, id: "Pulau ini disebut \"Pulau Telinga\" karena kalau dilihat dari langit, bentuknya kelihatan seperti telinga manusia.", tag: "JLPT N3" },
                    { jp: `また${r("値段","ねだん")}がそれほど${r("高","たか")}くないことから${r("買","か")}っていく${r("学生","がくせい")}さんが${r("多","おお")}いようです。`, id: "Selain itu, karena harganya tidak terlalu mahal, sepertinya banyak juga mahasiswa yang membelinya.", tag: "JLPT N3 · Des 2024 · choukai" }
                ]
            },
            {
                id: 3,
                title: "3. 〜のだから / 〜んだから",
                rumus: "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ＋な\nKata Benda - ＋な",
                penjelasan: "Menyatakan alasan yang dianggap sudah jelas, dan biasanya diikuti dengan nasihat, saran, penilaian, atau ungkapan emosi dari si pembicara.",
                tips: "Versi emosional dari から.\nBiasanya pembicara berasumsi kalau lawan bicara juga sudah tahu akan hal yang dibicarakan.",
                examples: [
                    { jp: `${r("時間","じかん")}がないのだから、${r("急","いそ")}いで${r("準備","じゅんび")}しなさい。`, id: "Karena waktunya kan sedikit, cepat siap-siap ya!" },
                    { jp: `${r("自分","じぶん")}で${r("選","えら")}んだ${r("道","みち")}なんだから、${r("最後","さいご")}まで${r("頑張","がんば")}るべきだよ。`, id: "Kan kamu sendiri yang memilih jalan ini, jadi harus berusaha sampai akhir." }
                ],
                jlpt: [
                    { jp: `${r("日本各地","にほんかくち")}にはおいしい${r("食べ物","たべもの")}がたくさんあるのだから、そこにしかない${r("飲食店","いんしょくてん")}に${r("行","い")}くほうがいいと${r("思","おも")}いました。`, id: "Di berbagai daerah di Jepang kan banyak makanan enak, jadi menurutku lebih baik pergi ke tempat makan yang cuma ada di sana.", tag: "JLPT N3" },
                    { jp: `${r("林","はやし")}さんは、${r("会議","かいぎ")}で${r("資料","しりょう")}のグラフについて${r("質問","しつもん")}されたときに、わからないと${r("言","い")}っていたが、${r("林","はやし")}さんが${r("作","つく")}ったグラフなのだから、わからないはずがないと${r("思","おも")}う。`, id: "Waktu ditanya soal grafik di materi rapat, Hayashi-san bilang nggak tahu, tapi grafik itu kan dia sendiri yang buat, jadi menurutku nggak mungkin dia nggak tahu.", tag: "JLPT N3 · Des 2025" }
                ]
            },
            {
                id: 4,
                title: "4. そこで",
                rumus: "",
                penjelasan: "Menyatakan tindakan yang diambil untuk menanggapi atau mengatasi situasi yang disebutkan sebelumnya.",
                tips: "Kalimat setelah そこで biasanya berupa keputusan atau tindakan, seperti 〜ことにした atau 〜てみた.\n\nPerbedaan だから、それで、そのため、したがって、そこで:\nだから - paling umum, kalimat setelahnya boleh berupa pendapat, permintaan, ajakan, atau perintah\nそれで - lisan, kalimat setelahnya adalah hasil yang sudah terjadi\nそのため - lebih formal, menyatakan sebab → akibat\nしたがって - paling formal, menyatakan kesimpulan yang logis\nそこで - kalimat setelahnya adalah tindakan untuk menanggapi situasi tadi\n\n⚠️ そこで yang berarti \"di sana\" (tempat) bukan kata sambung ini.",
                examples: [
                    { jp: `１${r("週間","しゅうかん")}たったが、${r("痛","いた")}みはなくならなかった。そこで、${r("病院","びょういん")}で${r("検査","けんさ")}を${r("受","う")}けることにした。`, id: "Sudah seminggu, tapi sakitnya tidak hilang. Makanya, aku memutuskan periksa ke rumah sakit." }
                ],
                jlpt: [
                    { jp: `${r("昼寝","ひるね")}をすると${r("起","お")}きたあとの${r("集中力","しゅうちゅうりょく")}が${r("上","あ")}がるが、${r("長","なが")}く${r("寝","ね")}るのはよくない。そこで、${r("飲","の")}むと${r("目","め")}が${r("覚","さ")}めるというコーヒーの${r("効果","こうか")}を${r("利用","りよう")}するのだ。`, id: "Tidur siang memang bikin konsentrasi naik setelah bangun, tapi tidur terlalu lama itu tidak baik. Makanya, kita manfaatkan efek kopi yang katanya bikin melek kalau diminum.", tag: "JLPT N3 · Jul 2024" },
                    { jp: `${r("私","わたし")}たち${r("夫婦","ふうふ")}の${r("夢","ゆめ")}は、${r("田舎","いなか")}に${r("引","ひ")}っ${r("越","こ")}して${r("農業","のうぎょう")}を${r("始","はじ")}めることです。そこで${r("先日","せんじつ")}、ある${r("町","まち")}が${r("東京","とうきょう")}で${r("開","ひら")}いた${r("説明会","せつめいかい")}に${r("参加","さんか")}してみました。`, id: "Mimpi kami berdua sebagai suami istri adalah pindah ke desa dan mulai bertani. Makanya, beberapa hari lalu kami coba ikut sesi penjelasan yang diadakan di Tokyo oleh sebuah kota dari daerah.", tag: "JLPT N3 · Des 2022" }
                ]

            {

                examples: [
                    { jp: `この${r("辺","あた")}りは${r("田舎","いなか")}で、${r("電車","でんしゃ")}やバスがない。そのため、${r("多","おお")}くの${r("人","ひと")}が${r("車","くるま")}を${r("使","つか")}っている。`, id: "Daerah sini pedesaan, tidak ada kereta maupun bus. Oleh karena itu, banyak orang pakai mobil." }
                ],
                jlpt: [

                    { jp: `その${r("漫画","まんが")}は${r("全部","ぜんぶ")}で3${r("巻","かん")}もあり、しっかり${r("読","よ")}むのにはとても${r("時間","じかん")}がかかりました。そのために、ほかの${r("試験","しけん")}の${r("勉強","べんきょう")}ができなくなり、${r("寝","ね")}る${r("時間","じかん")}も${r("削","けず")}らなければならなくなりました。`, id: "Komik itu totalnya sampai 3 jilid, dan butuh waktu lama sekali untuk membacanya dengan teliti. Oleh karena itu, aku jadi tidak bisa belajar untuk ujian lain, bahkan harus mengurangi jam tidur.", tag: "JLPT N3 · Des 2023" }
                ]
            },

, "penjelasan": "menyatakan aksi atau keadaan yang harus diselesaikan sebelum waktu yang disebutkan", "tips": "", "examples": [{"jp": "<ruby>二十日<rt>はつか</rt></ruby>までに<ruby>旅行<rt>りょこう</rt></ruby>のお<ruby>金<rt>かね</rt></ruby>を<ruby>払<rt>はら</rt></ruby>います。", "id": "Saya akan membayar uang perjalanan sebelum tanggal 20."}, {"jp": "おきゃくさんが<ruby>来<rt>く</rt></ruby>るまでにへやをかたづけてね。", "id": "Tolong rapikan kamar sebelum tamunya datang."}, {"jp": "<ruby>映画<rt>えいが</rt></ruby>が<ruby>始<rt>はじ</rt></ruby>まるまでに、<ruby>映画<rt>えいが</rt></ruby><ruby>館<rt>かん</rt></ruby>に<ruby>着<rt>つ</rt></ruby>けるかどうか<ruby>心配<rt>しんぱい</rt></ruby>です。", "id": "Saya khawatir apakah bisa sampai di bioskop sebelum film mulai."}], "jlpt": []}, {"id": 21, "title": "21. ましょう (ayo; mari)", "rumus": "Kata Kerja - ✅", "penjelasan": "mengajak lawan bicara untuk melakukan sesuatu bersama", "tips": "bentuk biasa dari ましょう adalah \"Kata Kerja おうよう\"", "examples": [{"jp": "", "id": "９"}, {"jp": "<ruby>時<rt>じ</rt></ruby>ですよ。<ruby>仕事<rt>しごと</rt></ruby>を<ruby>始<rt>はじ</rt></ruby>めましょう。", "id": "Sudah jam 9. Ayo mulai bekerja."}, {"jp": "あのレストランで<ruby>食<rt>た</rt></ruby>べましょう。", "id": "Mari makan di restoran itu."}, {"jp": "<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>りましょう。", "id": "Ayo pulang bersama."}], "jlpt": []}, {"id": 22, "title": "22. ましょうか (menawarkan bantuan)", "rumus": "Kata Kerja - ✅", "penjelasan": "menawarkan bantuan kepada lawan bicara", "tips": "", "examples": [{"jp": "カバン、<ruby>持<rt>も</rt></ruby>ちましょうか？", "id": "Bagaimana kalau saya bawakan tasnya?"}, {"jp": "<ruby>仕事<rt>しごと</rt></ruby>まだたくさん<ruby>残<rt>のこ</rt></ruby>っていますね。<ruby>私<rt>わたし</rt></ruby>は<ruby>暇<rt>ひま</rt></ruby>なので、<ruby>手伝<rt>てつだ</rt></ruby>いましょうか。", "id": "Pekerjaanmu masih banyak tersisa ya. Karena aku lagi senggang, bagaimana kalau saya bantu?"}, {"jp": "<ruby>電気<rt>でんき</rt></ruby>、つけましょうか。", "id": "Mau saya nyalakan lampunya?"}, {"jp": "それ、<ruby>私<rt>わたし</rt></ruby>がやりましょうか。", "id": "Bagaimana kalau saya yang mengerjakan itu?"}], "jlpt": []}, {"id": 23, "title": "23. ませんか？ (mengajak; menawarkan melakukan sesuatu)", "rumus": "Kata Kerja - ✅", "penjelasan": "mengajak lawan bicara melakukan sesuatu atau menawarkan lawan bicara untuk melakukan sesuatu", "tips": "", "examples": [{"jp": "<ruby>土曜日<rt>どようび</rt></ruby>、テニスをしませんか？", "id": "Sabtu main tenis yuk?"}, {"jp": "<ruby>今<rt>いま</rt></ruby>から<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ませんか。", "id": "Mau nonton film sekarang?"}, {"jp": "<ruby>週末<rt>しゅうまつ</rt></ruby>、うちに<ruby>遊<rt>あそ</rt></ruby>びに<ruby>来<rt>き</rt></ruby>ませんか。", "id": "Akhir pekan ini, apakah kamu mau main ke rumahku?"}], "jlpt": []}, {"id": 24, "title": "24. になります・くなります (menjadi)", "rumus": "Kata Kerja - Vたい（diubah menjadi く）\nKata Sifat i - く\nKata Sifat na - に\nKata Benda - に", "penjelasan": "", "tips": "", "examples": [{"jp": "", "id": "２０"}, {"jp": "<ruby>年<rt>ねん</rt></ruby><ruby>前<rt>まえ</rt></ruby>に、<ruby>日本語<rt>にほんご</rt></ruby><ruby>教師<rt>きょうし</rt></ruby>になりました。", "id": "Saya telah menjadi guru bahasa Jepang 20 tahun lalu."}, {"jp": "<ruby>彼氏<rt>かれし</rt></ruby>が<ruby>日本<rt>にほん</rt></ruby>に<ruby>仕事<rt>しごと</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったから、<ruby>寂<rt>さび</rt></ruby>しくなりました。", "id": "Karena pacarku pergi ke Jepang untuk bekerja, aku menjadi kesepian."}, {"jp": "あれ、<ruby>静<rt>しず</rt></ruby>かになりましたね。", "id": "Eh, jadi sunyi ya."}, {"jp": "<ruby>急<rt>きゅう</rt></ruby>にラーメンを<ruby>食<rt>た</rt></ruby>べたくなった。", "id": "Aku tiba-tiba jadi pengen makan ramen."}], "jlpt": []}, {"id": 25, "title": "25. くします・にします (mengubah menjadi)", "rumus": "Kata Sifat i - く\nKata Sifat na - に\nKata Benda - に", "penjelasan": "", "tips": "", "examples": [{"jp": "ここをきれいにしてください。", "id": "Tolong jadikan tempat ini bersih.(tolong bersihkan tempat ini)"}, {"jp": "<ruby>聞<rt>き</rt></ruby>こえないから、<ruby>音<rt>おと</rt></ruby>を<ruby>大<rt>おお</rt></ruby>きくしてもいいですか。", "id": "Karena tidak terdengar, boleh saya besarkan volumenya?"}, {"jp": "<ruby>残<rt>のこ</rt></ruby>ったりんごはジャムにします。", "id": "Apel yang tersisa akan saya buat jadi selai."}, {"jp": "<ruby>自分<rt>じぶん</rt></ruby>の<ruby>生徒<rt>せいと</rt></ruby>の<ruby>日本語<rt>にほんご</rt></ruby>をもっと<ruby>上手<rt>じょうず</rt></ruby>にします。", "id": "Aku akan membuat bahasa Jepang muridku menjadi lebih jago."}], "jlpt": []}, {"id": 26, "title": "26. できます・ことができます (bisa)", "rumus": "Kata Kerja - VKamus + ことができます\nKata Benda + できます", "penjelasan": "menyatakan kemampuan untuk melakukan sesuatu", "tips": "bunpou ini punya fungsi yang sama persis dengan \"Kata Kerja Potensial\"", "examples": [{"jp": "<ruby>田中<rt>たなか</rt></ruby>さんはフランス<ruby>語<rt>ご</rt></ruby>ができます。", "id": "Tanaka-san bisa bahasa Prancis."}, {"jp": "<ruby>私<rt>わたし</rt></ruby>はギターを<ruby>弾<rt>ひ</rt></ruby>くことができます。", "id": "Saya bisa bermain gitar."}, {"jp": "<ruby>私<rt>わたし</rt></ruby>は<ruby>漢字<rt>かんじ</rt></ruby>を<ruby>書<rt>か</rt></ruby>くことができません。", "id": "Saya tidak bisa menulis kanji."}], "jlpt": []}, {"id": 27, "title": "27. たことがあります (pernah)", "rumus": "Kata Kerja - Vた", "penjelasan": "menyatakan pengalaman yang pernah dialami", "tips": "", "examples": [{"jp": "<ruby>日本<rt>にほん</rt></ruby>で<ruby>車<rt>くるま</rt></ruby>を<ruby>運転<rt>うんてん</rt></ruby>したことがありますか。", "id": "Apakah kamu pernah menyetir mobil di Jepang?"}, {"jp": "<ruby>私<rt>わたし</rt></ruby>は<ruby>仕事<rt>しごと</rt></ruby>を<ruby>休<rt>やす</rt></ruby>んだことがありません。", "id": "Saya belum pernah libur kerja."}, {"jp": "カンガルーの<ruby>肉<rt>にく</rt></ruby>を<ruby>食<rt>た</rt></ruby>べたことがあります。", "id": "Saya pernah makan daging kanguru."}], "jlpt": []}, {"id": 28, "title": "28. と〜とどちらが (menanyakan perbandingan dua hal)", "rumus": "Kata Benda\nKata Kerja + の", "penjelasan": "membandingkan dua hal sebagai pertanyaan ke lawan bicara", "tips": "Kata Kerja bisa digunakan dengan syarat ditambah の — karena の bisa mengubah Kata Kerja menjadi Kata Benda)", "examples": [{"jp": "スポーツを<ruby>見<rt>み</rt></ruby>るのとするのとどちらが<ruby>好<rt>す</rt></ruby>きですか。", "id": "Kamu lebih suka menonton atau melakukan olahraga?"}, {"jp": "コーヒーとお<ruby>茶<rt>ちゃ</rt></ruby>とどちらがいいですか。", "id": "Lebih suka kopi atau teh?"}, {"jp": "ビールとワインとどちらが<ruby>好<rt>す</rt></ruby>きですか。", "id": "Kamu lebih suka bir atau wine?"}, {"jp": "<ruby>犬<rt>いぬ</rt></ruby>と<ruby>猫<rt>ねこ</rt></ruby>とどちらが<ruby>飼<rt>か</rt></ruby>いやすいですか？", "id": "Mana yang lebih mudah dipelihara, anjing atau kucing?"}], "jlpt": []}, {"id": 29, "title": "29. は〜より (membandingkan)", "rumus": "Kata Benda", "penjelasan": "membandingkan dua hal dan menyatakan mana yang lebih unggul", "tips": "kotoba yang ada di depan は yang adalah \"lebih〜\"", "examples": [{"jp": "<ruby>東京<rt>とうきょう</rt></ruby>の<ruby>地下鉄<rt>ちかてつ</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>の<ruby>国<rt>くに</rt></ruby>の<ruby>地下鉄<rt>ちかてつ</rt></ruby>より<ruby>便利<rt>べんり</rt></ruby>です。", "id": "Kereta bawah tanah di Tokyo lebih praktis daripada kereta bawah tanah di negara saya."}, {"jp": "<ruby>兄<rt>あに</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>より<ruby>英語<rt>えいご</rt></ruby>が<ruby>上手<rt>じょうず</rt></ruby>です。", "id": "Kakak laki-lakiku lebih pandai bahasa Inggris daripada saya."}, {"jp": "<ruby>今年<rt>ことし</rt></ruby>は<ruby>去年<rt>きょねん</rt></ruby>より<ruby>暑<rt>あつ</rt></ruby>いですね。", "id": "Tahun ini lebih panas daripada tahun lalu ya."}], "jlpt": []}, {"id": 30, "title": "30. のほうが〜 (yang ini lebih~)", "rumus": "Kata Benda", "penjelasan": "membandingkan dua hal dan menyatakan mana yang lebih unggul", "tips": "kotoba yang ada di depan のほうが adalah yang \"lebih〜\"\nsering dipasangkan dengan より, tapi bisa juga berdiri sendiri", "examples": [{"jp": "わたしはご<ruby>飯<rt>はん</rt></ruby>よりパンのほうがよく<ruby>食<rt>た</rt></ruby>べます。", "id": "Saya lebih sering makan roti daripada nasi."}, {"jp": "ズボンのほうがいいと<ruby>思<rt>おも</rt></ruby>うよ。", "id": "Menurutku, celana lebih bagus."}, {"jp": "ワインの<ruby>方<rt>ほう</rt></ruby>が<ruby>好<rt>す</rt></ruby>きです。", "id": "Saya lebih suka anggur."}], "jlpt": []}, {"id": 31, "title": "31. たほうがいい・ないほうがいい (sebaiknya; saran)", "rumus": "Kata Kerja - Vた\nKata Kerja - Vない", "penjelasan": "menyatakan saran untuk melakukan atau untuk tidak melakukan sesuatu", "tips": "", "examples": [{"jp": "かぜですか。<ruby>早<rt>はや</rt></ruby>く<ruby>帰<rt>かえ</rt></ruby>って、<ruby>寝<rt>ね</rt></ruby>たほうがいいですよ。", "id": "Kamu sakit flu ya? Sebaiknya cepat pulang dan tidur."}, {"jp": "たばこは<ruby>体<rt>からだ</rt></ruby>によくないから、<ruby>吸<rt>す</rt></ruby>わないほうがいいですよ。", "id": "Rokok tidak baik untuk tubuh, jadi lebih baik jangan merokok."}, {"jp": "それは<ruby>言<rt>い</rt></ruby>わない<ruby>方<rt>ほう</rt></ruby>がいいですね。", "id": "Sebaiknya jangan mengatakan hal itu."}], "jlpt": []}, {"id": 32, "title": "32. なくてはいけません・ないといけません・なければなりません (harus)", "rumus": "Kata Kerja - Vない\nKata Sifat i - くなければ / くなくては\nKata Sifat na · Kata Benda - ＋でなければ / でなくては", "penjelasan": "menyatakan keharusan untuk melakukan sesuatu.", "tips": "bunpou ini diawali ない dan diakhiri ない, jadi konsepnya \"tidak bisa tidak melakukan\" = \"harus melakukan\"\nBentuk singkat :\nなくてはいけません　→ なくちゃいけない\nなければなりません　→ なきゃならない", "examples": [{"jp": "<ruby>今日<rt>きょう</rt></ruby><ruby>食<rt>た</rt></ruby>べなくてはいけないでしょうね。", "id": "Hari ini sepertinya harus dimakan, ya."}, {"jp": "<ruby>国<rt>くに</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>らなくてはいけない。", "id": "Saya harus pulang ke negara asal."}, {"jp": "この<ruby>中<rt>なか</rt></ruby>から<ruby>選<rt>えら</rt></ruby>ばなくてはいけません。", "id": "Harus memilih dari antara ini."}, {"jp": "<ruby>私<rt>わたし</rt></ruby>は<ruby>今<rt>いま</rt></ruby>から<ruby>仕事<rt>しごと</rt></ruby>をしないといけません。", "id": "Saya harus mulai kerja dari sekarang."}, {"jp": "<ruby>私<rt>わたし</rt></ruby>は１７<ruby>時<rt>じ</rt></ruby>ごろ<ruby>家<rt>いえ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>らないといけません。", "id": "Saya harus pulang ke rumah sekitar jam 17.00."}, {"jp": "もっと<ruby>勉強<rt>べんきょう</rt></ruby>しないといけない。", "id": "Saya harus belajar lebih giat."}, {"jp": "Eメールの<ruby>返事<rt>へんじ</rt></ruby>を<ruby>書<rt>か</rt></ruby>かなければなりません。", "id": "Saya harus membalas email."}, {"jp": "この<ruby>本<rt>ほん</rt></ruby>は<ruby>月曜日<rt>げつようび</rt></ruby>までに<ruby>返<rt>かえ</rt></ruby>さなければなりません。", "id": "Buku ini harus dikembalikan sebelum hari Senin."}, {"jp": "<ruby>明日<rt>あした</rt></ruby><ruby>試験<rt>しけん</rt></ruby>がありますから、<ruby>今晩<rt>こんばん</rt></ruby>は<ruby>勉強<rt>べんきょう</rt></ruby>しなければなりません。", "id": "Karena besok ada ujian, malam ini saya harus belajar."}], "jlpt": []}, {"id": 33, "title": "33. とき (pada saat)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ＋な\nKata Benda - ＋の", "penjelasan": "menyatakan waktu terjadinya suatu hal atau kegiatan", "tips": "", "examples": [{"jp": "<ruby>会議<rt>かいぎ</rt></ruby>のとき、<ruby>質問<rt>しつもん</rt></ruby>があったら<ruby>聞<rt>き</rt></ruby>いてください。", "id": "Saat rapat, silakan bertanya jika ada pertanyaan."}, {"jp": "<ruby>食<rt>た</rt></ruby>べるときはしゃべらないでください。", "id": "Tolong jangan bicara saat sedang makan."}, {"jp": "<ruby>寒<rt>さむ</rt></ruby>いときは<ruby>暖<rt>あたた</rt></ruby>かい<ruby>服<rt>ふく</rt></ruby>を<ruby>着<rt>き</rt></ruby>ます。", "id": "Saat cuaca dingin, saya memakai baju hangat."}], "jlpt": []}, {"id": 34, "title": "34. てから (setelah)", "rumus": "Kata Kerja - Vて", "penjelasan": "menyatakan kegiatan yang akan dilakukan setelah menyelesaikan kegiatan lain", "tips": "kegiatan yang ada di depan __てから adalah yang dilakukan pertama", "examples": [{"jp": "<ruby>銀行<rt>ぎんこう</rt></ruby>でお<ruby>金<rt>かね</rt></ruby>を<ruby>引<rt>ひ</rt></ruby>き<ruby>出<rt>だ</rt></ruby>してから<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>します", "id": "Saya akan belanja setelah mengambil uang di bank."}, {"jp": "<ruby>親<rt>おや</rt></ruby>に<ruby>聞<rt>き</rt></ruby>いてから<ruby>決<rt>き</rt></ruby>めます", "id": "Saya akan memutuskan setelah bertanya pada orang tua."}, {"jp": "この<ruby>野菜<rt>やさい</rt></ruby>は<ruby>切<rt>き</rt></ruby>ってから<ruby>洗<rt>あら</rt></ruby>ってください", "id": "Sayur ini tolong dipotong dulu baru dicuci."}], "jlpt": []}, {"id": 35, "title": "35. 前に (sebelum)", "rumus": "Kata Kerja - VKamus, VPasif, VKausatif, VKausatif Pasif\nKata Benda - ＋の", "penjelasan": "menyatakan kegiatan yang akan dilakukan sebelum menyelesaikan kegiatan lain", "tips": "kegiatan yang ada di depan __前に adalah yang akan dilakukan di akhir", "examples": [{"jp": "<ruby>寝<rt>ね</rt></ruby>る<ruby>前<rt>まえ</rt></ruby>に<ruby>歯<rt>は</rt></ruby>をみがいてください。", "id": "Sebelum tidur, tolong sikat gigi."}, {"jp": "パーティーの<ruby>前<rt>まえ</rt></ruby>に、<ruby>部屋<rt>へや</rt></ruby>を<ruby>掃除<rt>そうじ</rt></ruby>しましょう。", "id": "Sebelum pesta, mari bersihkan kamar."}, {"jp": "<ruby>食事<rt>しょくじ</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>に<ruby>手<rt>て</rt></ruby>を<ruby>洗<rt>あら</rt></ruby>います。", "id": "Saya mencuci tangan sebelum makan."}], "jlpt": []}, {"id": 36, "title": "36. もう〜ました (sudah)", "rumus": "Kata Kerja - Vた", "penjelasan": "menyatakan kalau kegiatan yang disebutkan sudah selesai dilakukan.", "tips": "もう di sini hanya pelengkap. Tanpa もう juga bisa karena ました adalah Kata Kerja Bentuk Lampau yang fungsinya memang menyatakan hal yang sudah terjadi.", "examples": [{"jp": "<ruby>宿題<rt>しゅくだい</rt></ruby>はもう<ruby>終<rt>お</rt></ruby>わりましたか。", "id": "Apakah PR-nya sudah selesai?"}, {"jp": "もう<ruby>食事<rt>しょくじ</rt></ruby>しましたか。", "id": "Apakah kamu sudah makan?"}, {"jp": "もう<ruby>掃除<rt>そうじ</rt></ruby>した。", "id": "Aku udah bersih-bersih."}], "jlpt": []}, {"id": 37, "title": "37. まだ〜ていません (belum)", "rumus": "Kata Kerja - Vていない・ていません", "penjelasan": "menyatakan kalau kegiatan yang disebutkan belum selesai dilakukan atau bahkan belum mulai dilakukan.", "tips": "", "examples": [{"jp": "「リンさんは<ruby>来<rt>き</rt></ruby>ましたか。」「いいえ、まだ<ruby>来<rt>き</rt></ruby>ていません。」", "id": "“Apakah Lin-san sudah datang?” “Belum, dia belum datang.”"}, {"jp": "「もう<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>に<ruby>行<rt>い</rt></ruby>った？」「ううん、まだ<ruby>行<rt>い</rt></ruby>っていません。」", "id": "“Kamu sudah belanja?” “Belum, belum pergi.”"}, {"jp": "まだ<ruby>何<rt>なに</rt></ruby>も<ruby>食<rt>た</rt></ruby>べていません", "id": "Saya belum makan apa pun."}], "jlpt": []}, {"id": 38, "title": "38. んです (menyatakan dan menanyakan alasan)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ＋な\nKata Benda - ＋な", "penjelasan": "bunpou ini sebenarnya tidak berefek besar ke kalimat, jadi kalian bisa abaikan saja. ada atau tidaknya bunpou ini pada kalimat, sebenarnya tidak mengubah arti dari kalimatnya.", "tips": "んです adalah singkatan dari のです.\nPada kaiwa biasanya pakai んです, sedangkan pada tulisan kadang ditulis のです.", "examples": [{"jp": "これ、もらったんです。", "id": "Ini, saya dapat dari seseorang."}, {"jp": "<ruby>明日<rt>あした</rt></ruby><ruby>学校<rt>がっこう</rt></ruby>を<ruby>休<rt>やす</rt></ruby>みます。<ruby>母<rt>はは</rt></ruby>が<ruby>日本<rt>にほん</rt></ruby>へ<ruby>来<rt>く</rt></ruby>るんです。", "id": "Besok saya tidak masuk sekolah. Soalnya ibu saya datang ke Jepang."}, {"jp": "どうしたんですか。", "id": "Ada apa?"}], "jlpt": []}, {"id": 39, "title": "39. あまり〜ない (tidak terlalu)", "rumus": "Kata Kerja - Vない\nKata Sifat i - くない\nKata Sifat na - じゃない", "penjelasan": "digunakan untuk menghaluskan pendapat negatif.", "tips": "", "examples": [{"jp": "<ruby>今日<rt>きょう</rt></ruby>はあまり<ruby>暑<rt>あつ</rt></ruby>くないね。", "id": "Hari ini tidak terlalu panas ya."}, {"jp": "<ruby>毎日<rt>まいにち</rt></ruby>あまり<ruby>食<rt>た</rt></ruby>べていません。", "id": "Saya tidak terlalu makan setiap hari.\n(maksudnya adalah makannya tidak banyak, bukan jarang makan)"}, {"jp": "この<ruby>料理<rt>りょうり</rt></ruby>の<ruby>味<rt>あじ</rt></ruby>はあまり<ruby>好<rt>す</rt></ruby>きじゃない。", "id": "Saya tidak terlalu suka dengan rasa masakan ini."}], "jlpt": []}, {"id": 40, "title": "40. でしょう (sepertinya (yakin); pasti (tebakan); kan?)", "rumus": "Bentuk Biasa", "penjelasan": "menyatakan dugaan pembicara yang cukup yakin, atau meminta persetujuan dari lawan bicara (kan?).", "tips": "tingkat kepastiannya lebih tinggi daripada かもしれません.\nbentuk biasa dari でしょう adalah だろう.\nkalau diucapkan dengan nada naik (でしょう？), artinya jadi \"kan?\" — meminta persetujuan dari lawan bicara.\nKata Sifat na dan Kata Benda langsung + でしょう, tanpa だ : 静かでしょう、学生でしょう", "examples": [{"jp": "<ruby>午後<rt>ごご</rt></ruby>は<ruby>晴<rt>は</rt></ruby>れるでしょう。", "id": "Sepertinya sore nanti akan cerah."}, {"jp": "<ruby>長<rt>なが</rt></ruby>い<ruby>旅行<rt>りょこう</rt></ruby>ですから、<ruby>子供<rt>こども</rt></ruby><ruby>達<rt>たち</rt></ruby>は<ruby>嬉<rt>うれ</rt></ruby>しいでしょうね。", "id": "Karena perjalanannya panjang, anak-anak pasti senang ya."}, {"jp": "<ruby>映画<rt>えいが</rt></ruby><ruby>館<rt>かん</rt></ruby>は<ruby>混<rt>こ</rt></ruby>んでいるでしょう。", "id": "Bioskopnya pasti ramai."}, {"jp": "<ruby>明日<rt>あした</rt></ruby>のパーティー、<ruby>行<rt>い</rt></ruby>くでしょう？", "id": "Besok kamu datang ke pesta, kan?"}], "jlpt": []}, {"id": 41, "title": "41. くらい・ぐらい (sekitar)", "rumus": "Kata Benda", "penjelasan": "menyatakan angka perkiraan .", "tips": "", "examples": [{"jp": "<ruby>毎日<rt>まいにち</rt></ruby>", "id": "３"}, {"jp": "<ruby>杯<rt>はい</rt></ruby>ぐらいコーヒーを<ruby>飲<rt>の</rt></ruby>んでいます。", "id": "Saya minum sekitar 3 cangkir kopi setiap hari."}, {"jp": "このジャケットは２<ruby>万円<rt>まんえん</rt></ruby>ぐらいでした。", "id": "Jaket ini harganya sekitar 20 ribu yen."}, {"jp": "<ruby>夏休<rt>なつやす</rt></ruby>みは１<ruby>ヶ月<rt>かげつ</rt></ruby>くらいあります。", "id": "Liburan musim panas sekitar satu bulan."}], "jlpt": []}, {"id": 42, "title": "42. か (atau)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ✅\nKata Benda - ✅", "penjelasan": "menyatakan pilihan di antara dua hal atau lebih.", "tips": "", "examples": [{"jp": "<ruby>週末<rt>しゅうまつ</rt></ruby>に<ruby>海<rt>うみ</rt></ruby>か<ruby>山<rt>やま</rt></ruby>に<ruby>行<rt>い</rt></ruby>きたいです。", "id": "Saat akhir pekan saya ingin pergi ke laut atau gunung."}, {"jp": "<ruby>月曜日<rt>げつようび</rt></ruby>か<ruby>金曜日<rt>きんようび</rt></ruby>か<ruby>土曜日<rt>どようび</rt></ruby>に<ruby>会<rt>あ</rt></ruby>いましょう。", "id": "Mari bertemu hari Senin, Jumat, atau Sabtu."}, {"jp": "これは<ruby>山田<rt>やまだ</rt></ruby>さんか<ruby>本田<rt>ほんだ</rt></ruby>さんにお<ruby>願<rt>ねが</rt></ruby>いしましょう。", "id": "Mari minta tolong pada Yamada-san atau Honda-san untuk ini."}], "jlpt": []}, {"id": 43, "title": "43. あと・あとで・あとに (setelah)", "rumus": "Kata Kerja - Vた\nKata Benda - ＋の", "penjelasan": "menyatakan kejadian atau kegiatan yang terjadi setelah kegiatan lain selesai.", "tips": "kegiatan yang ada di depan __あと adalah yang terjadi pertama.\nrumusnya pakai Vた, bukan Vて seperti 〜てから.", "examples": [{"jp": "<ruby>仕事<rt>しごと</rt></ruby>のあとにお<ruby>酒<rt>さけ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>みませんか。", "id": "Mau minum alkohol setelah kerja?"}, {"jp": "はなさんが<ruby>帰<rt>かえ</rt></ruby>ったあとにしゅんくんが<ruby>来<rt>き</rt></ruby>たんです。", "id": "Setelah Hana-san pulang, Shun-kun datang."}, {"jp": "ハチが<ruby>死<rt>し</rt></ruby>んだあと、<ruby>渋谷<rt>しぶや</rt></ruby>にハチ<ruby>公<rt>こう</rt></ruby><ruby>像<rt>ぞう</rt></ruby>ができた。", "id": "Setelah Hachiko meninggal, patung Hachiko dibuat di Shibuya."}], "jlpt": []}, {"id": 44, "title": "44. なかなか （〜ない） (tidak kunjung; jarang ada; sulit untuk)", "rumus": "Kata Kerja - Vない", "penjelasan": "menyatakan sesuatu yang sudah ditunggu atau diusahakan, tapi tidak kunjung terjadi.", "tips": "selalu dipasangkan dengan bentuk negatif (〜ない・〜ません).", "examples": [{"jp": "もう<ruby>来<rt>く</rt></ruby>るはずなんですが、なかなかバスが<ruby>来<rt>き</rt></ruby>ませんね。", "id": "Harusnya sudah datang, tapi bus-nya lama sekali ya."}, {"jp": "さっきコーヒーを<ruby>飲<rt>の</rt></ruby>んだせいで、なかなか<ruby>寝<rt>ね</rt></ruby>られない。", "id": "Karena tadi minum kopi, saya sulit tidur."}, {"jp": "もう<ruby>日本<rt>にほん</rt></ruby>に<ruby>来<rt>き</rt></ruby>て１<ruby>年<rt>ねん</rt></ruby><ruby>以上<rt>いじょう</rt></ruby><ruby>経<rt>た</rt></ruby>つのですが、<ruby>日本語<rt>にほんご</rt></ruby>がなかなか<ruby>上手<rt>じょうず</rt></ruby>になりません。", "id": "Saya sudah lebih dari setahun di Jepang, tapi bahasa Jepang saya belum juga lancar."}], "jlpt": []}, {"id": 45, "title": "45. でも (memberikan contoh; angka minimal)", "rumus": "Kata Benda", "penjelasan": "menyebutkan satu contoh atau jumlah yang paling minimal.", "tips": "", "examples": [{"jp": "こんな<ruby>簡単<rt>かんたん</rt></ruby>なことは<ruby>小学生<rt>しょうがくせい</rt></ruby>でもわかります。", "id": "Hal semudah ini, anak SD pun pasti mengerti.\n１"}, {"jp": "<ruby>分<rt>ぷん</rt></ruby>でも<ruby>長<rt>なが</rt></ruby>く<ruby>寝<rt>ね</rt></ruby>ていたいです。", "id": "Saya ingin tidur lebih lama, walaupun cuma satu menit."}, {"jp": "この<ruby>料理<rt>りょうり</rt></ruby>は<ruby>簡単<rt>かんたん</rt></ruby>そうだから、<ruby>私<rt>わたし</rt></ruby>でも<ruby>作<rt>つく</rt></ruby>れそうです。", "id": "Karena masakan ini terlihat mudah, saya pun sepertinya bisa membuatnya."}], "jlpt": []}, {"id": 46, "title": "46. という (yang bernama)", "rumus": "Kata Benda", "penjelasan": "memperkenalkan nama dari suatu benda, tempat, atau orang yang mungkin belum diketahui lawan bicara.", "tips": "", "examples": [{"jp": "「わさび」という<ruby>食<rt>た</rt></ruby>べ<ruby>物<rt>もの</rt></ruby>を<ruby>知<rt>し</rt></ruby>っていますか。", "id": "Apakah kamu tahu makanan bernama “wasabi”?"}, {"jp": "<ruby>小林<rt>こばやし</rt></ruby>さんという<ruby>人<rt>ひと</rt></ruby>が<ruby>来<rt>き</rt></ruby>ました。", "id": "Seseorang bernama Kobayashi-san datang."}, {"jp": "「トマト<ruby>銀行<rt>ぎんこう</rt></ruby>」という<ruby>銀行<rt>ぎんこう</rt></ruby>はどこにありますか。", "id": "Di mana bank bernama \"Bank Tomat\" itu?"}], "jlpt": []}, {"id": 47, "title": "47. こと・の (mengubah kata kerja menjadi kata benda)", "rumus": "Kata Kerja - Bentuk Biasa (paling sering VKamus)", "penjelasan": "mengubah kata kerja menjadi kata benda, supaya bisa dipakai sebagai topik atau objek dalam kalimat.", "tips": "", "examples": [{"jp": "<ruby>宿題<rt>しゅくだい</rt></ruby>を<ruby>持<rt>も</rt></ruby>ってくるのを<ruby>忘<rt>わす</rt></ruby>れました。", "id": "Saya lupa membawa PR-nya."}, {"jp": "<ruby>泳<rt>およ</rt></ruby>ぐのは<ruby>楽<rt>たの</rt></ruby>しいですが、<ruby>疲<rt>つか</rt></ruby>れます。", "id": "Berenang itu menyenangkan, tapi melelahkan."}, {"jp": "<ruby>山田<rt>やまだ</rt></ruby>さんの<ruby>趣味<rt>しゅみ</rt></ruby>は<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>ることです。", "id": "Hobi Yamada-san adalah memotret."}], "jlpt": []}, {"id": 48, "title": "48. ても (walaupun; meskipun; pun)", "rumus": "Kata Kerja - Vても\nKata Kerja - Vない → なくても\nKata Sifat i - くても\nKata Sifat na - でも\nKata Benda - でも", "penjelasan": "menyatakan bahwa suatu keadaan tetap terjadi walaupun ada kondisi yang berlawanan.", "tips": "fokusnya ke “hasil tetap terjadi walaupun ada hambatan.”", "examples": [{"jp": "<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>っても、コンサートに<ruby>行<rt>い</rt></ruby>きます。", "id": "Meskipun hujan turun, saya akan tetap pergi ke konser."}, {"jp": "このパソコンがほしいから、<ruby>高<rt>たか</rt></ruby>くても<ruby>買<rt>か</rt></ruby>います。", "id": "Karena saya ingin komputer ini, saya akan membelinya meskipun harganya mahal."}], "jlpt": []}, {"id": 49, "title": "49. でも (bahkan; pun)", "rumus": "Kata Benda", "penjelasan": "menyatakan bahwa kalau yang sekecil itu saja bisa..., apalagi yang lain.", "tips": "", "examples": [{"jp": "そんなことは<ruby>子供<rt>こども</rt></ruby>でも<ruby>知<rt>し</rt></ruby>っている。", "id": "Bahkan anak-anak pun tahu hal seperti itu. (apalagi orang dewasa, pasti tahu.)"}, {"jp": "<ruby>小<rt>ちい</rt></ruby>さなミスでも<ruby>見落<rt>みお</rt></ruby>としてはいけない。", "id": "Bahkan kesalahan kecil pun tidak boleh dilewatkan. (apalagi kesalahan yang besar)"}, {"jp": "<ruby>妹<rt>いもうと</rt></ruby>は<ruby>初<rt>はじ</rt></ruby>めて<ruby>会<rt>あ</rt></ruby>った<ruby>人<rt>ひと</rt></ruby>とでもすぐに<ruby>仲良<rt>なかよ</rt></ruby>くなる。", "id": "Adik perempuanku bisa langsung akrab bahkan dengan orang yang baru pertama kali dia temui. (apalagi dengan orang yang sudah lama dia kenal)"}, {"jp": "この<ruby>問題<rt>もんだい</rt></ruby>は<ruby>初心者<rt>しょしんしゃ</rt></ruby>でも<ruby>解<rt>と</rt></ruby>けます。", "id": "Soal ini bisa dijawab bahkan oleh pemula. (apalagi orang yang bukan pemula, pasti bisa jawab)"}, {"jp": "この<ruby>薬<rt>くすり</rt></ruby>は<ruby>赤<rt>あか</rt></ruby>ちゃんでも<ruby>飲<rt>の</rt></ruby>めます。", "id": "Obat ini bisa diminum bahkan oleh bayi sekalipun. (bayi saja bisa, apalagi orang dewasa)"}], "jlpt": []}, {"id": 50, "title": "50. でも (bagaimana kalau; misalnya)", "rumus": "Kata Benda", "penjelasan": "menyampaikan saran ringan, ide spontan, atau menyebut salah satu contoh dari sekian banyak kemungkinan.\n\nNuansanya santai, tidak memaksa, dan sering digunakan saat menyarankan sesuatu kepada lawan bicara.", "tips": "", "examples": [{"jp": "お<ruby>茶<rt>ちゃ</rt></ruby>でも<ruby>飲<rt>の</rt></ruby>みましょうか。", "id": "Bagaimana kalau kita minum (misalnya) teh?\n(tidak harus teh, boleh juga yang lain)"}, {"jp": "<ruby>映画<rt>えいが</rt></ruby>でも<ruby>見<rt>み</rt></ruby>ようかな。", "id": "Nonton film aja kali, ya.\n(boleh menonton atau melakukan aktivitas lain, ini hanya salah satu dari sekian banyak aktivitas yang bisa dilakukan saat ini)"}, {"jp": "<ruby>荷物<rt>にもつ</rt></ruby>は<ruby>机<rt>つくえ</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>にでも<ruby>置<rt>お</rt></ruby>いておいてください。", "id": "Taruh saja barangnya misalnya di atas meja.\n(tidak harus di atas meja, tapi salah satu opsinya adalah di atas meja)"}, {"jp": "<ruby>週末<rt>しゅうまつ</rt></ruby>は<ruby>温泉<rt>おんせん</rt></ruby>でも<ruby>行<rt>い</rt></ruby>こうかと<ruby>思<rt>おも</rt></ruby>ってるんだ。", "id": "Akhir pekan aku kepikiran pergi ke onsen atau semacamnya.\n(ada opsi lain)"}, {"jp": "<ruby>暇<rt>ひま</rt></ruby>つぶしに<ruby>本<rt>ほん</rt></ruby>でも<ruby>読<rt>よ</rt></ruby>もうかな。", "id": "Untuk menghabiskan waktu senggang, baca buku aja, kali ya.\n(ada aktivitas lain yang bisa dijadikan opsi selain baca buku)"}], "jlpt": []}, {"id": 51, "title": "51. も (bahkan satu pun tidak; tidak sedikit pun; sama sekali tidak)", "rumus": "Kata Benda\nKata Tanya", "penjelasan": "memberikan penekanan yang kuat dalam konteks negatif, menyatakan bahwa sama sekali tidak ada— bahkan satu pun tidak dilakukan / tidak tersisa / tidak terjadi.\n※ Sering ada kata \"satu\" pada bunpou ini", "tips": "Biasanya digunakan dalam bentuk negatif seperti: 〜ない, 〜ません, 〜なかった, dll.", "examples": [{"jp": "", "id": "１"}, {"jp": "<ruby>日<rt>にち</rt></ruby>も<ruby>休<rt>やす</rt></ruby>まないで<ruby>学校<rt>がっこう</rt></ruby>に<ruby>通<rt>とお</rt></ruby>った。", "id": "Saya pergi ke sekolah tanpa libur/bolos satu hari pun."}, {"jp": "<ruby>財布<rt>さいふ</rt></ruby>は<ruby>空<rt>から</rt></ruby>っぽだ。１<ruby>円<rt>えん</rt></ruby>も<ruby>残<rt>のこ</rt></ruby>っていない。", "id": "Dompet saya kosong. Bahkan satu yen pun tidak tersisa."}, {"jp": "この<ruby>写真<rt>しゃしん</rt></ruby>、<ruby>誰<rt>だれ</rt></ruby>にも<ruby>見<rt>み</rt></ruby>せないでくださいよ。", "id": "Tolong jangan tunjukkan pada siapa pun foto ini ya."}, {"jp": "<ruby>私<rt>わたし</rt></ruby>の<ruby>誕生<rt>たんじょう</rt></ruby><ruby>日<rt>び</rt></ruby>パーティに<ruby>誰<rt>だれ</rt></ruby><ruby>一人<rt>ひとり</rt></ruby>も<ruby>来<rt>こ</rt></ruby>なかった。", "id": "Tidak ada seorang pun yang datang ke pesta ulang tahunku."}, {"jp": "<ruby>一度<rt>いちど</rt></ruby>もその<ruby>店<rt>みせ</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったことがない。", "id": "Saya belum pernah sekalipun pergi ke toko itu."}], "jlpt": []}, {"id": 52, "title": "52. も (bahkan; juga; pun)", "rumus": "Kata Benda", "penjelasan": "menegaskan sesuatu dengan contoh yang tidak biasa.", "tips": "Ini seperti fungsi も yang berarti \"juga\" tapi dijelaskan dengan contoh yang sedikit ekstrem.\ningat saja \"bahkan ; pun\" sebagai fungsi dari も", "examples": [{"jp": "<ruby>足<rt>あし</rt></ruby>が<ruby>痛<rt>いた</rt></ruby>くて<ruby>立<rt>た</rt></ruby>つこともできない。", "id": "Kakiku sakit, bahkan berdiri pun tidak bisa."}, {"jp": "この<ruby>子<rt>こ</rt></ruby>はもう<ruby>難<rt>むずか</rt></ruby>しい<ruby>漢字<rt>かんじ</rt></ruby>も<ruby>書<rt>か</rt></ruby>ける。", "id": "Anak ini bahkan sudah bisa menulis kanji yang sulit."}, {"jp": "こんなに<ruby>高<rt>たか</rt></ruby>い<ruby>山<rt>やま</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>にも<ruby>店<rt>みせ</rt></ruby>がある。", "id": "Bahkan di atas gunung setinggi ini pun, ada toko."}, {"jp": "だれもが<ruby>感動<rt>かんどう</rt></ruby>する<ruby>映画<rt>えいが</rt></ruby>だった。", "id": "Itu adalah film yang semua orang pun akan terharu menontonnya."}, {"jp": "<ruby>赤<rt>あか</rt></ruby>ちゃんもスマホを<ruby>使<rt>つか</rt></ruby>える<ruby>時代<rt>じだい</rt></ruby>になった。", "id": "Sekarang sudah menjadi jaman di mana bahkan bayi pun bisa pakai smartphone."}, {"jp": "こんな<ruby>田舎<rt>いなか</rt></ruby>にも<ruby>観光<rt>かんこう</rt></ruby><ruby>客<rt>きゃく</rt></ruby>が<ruby>来<rt>く</rt></ruby>る。", "id": "Bahkan ke desa terpencil seperti ini pun, turis datang."}], "jlpt": []}, {"id": 53, "title": "53. のに (padahal...tapi...)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ＋な\nKata Benda - ＋な", "penjelasan": "menyatakan bahwa kenyataan bertentangan dengan harapan atau logika.", "tips": "", "examples": [{"jp": "<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>っていないのに、あの<ruby>人<rt>ひと</rt></ruby>は<ruby>傘<rt>かさ</rt></ruby>をさしています。", "id": "Padahal tidak hujan, tapi orang itu memakai payung."}, {"jp": "このくつ<ruby>昨日<rt>きのう</rt></ruby><ruby>買<rt>か</rt></ruby>ったのに、もうやぶれました。", "id": "Padahal sepatu ini baru beli kemarin, tapi sudah sobek."}, {"jp": "あの<ruby>子<rt>こ</rt></ruby>はまだ３<ruby>歳<rt>さい</rt></ruby>なのに、ロボットが<ruby>作<rt>つく</rt></ruby>れます。", "id": "Padahal anak itu baru berusia 3 tahun, tapi dia bisa membuat robot."}], "jlpt": []}, {"id": 54, "title": "54. ため（に） (demi; untuk)", "rumus": "Kata Kerja - VKamus\nKata Benda - ＋の", "penjelasan": "menyatakan tujuan melakukan sesuatu.", "tips": "", "examples": [{"jp": "<ruby>結婚式<rt>けっこんしき</rt></ruby>のために、いろいろ<ruby>準備<rt>じゅんび</rt></ruby>をしています。", "id": "Saya sedang menyiapkan berbagai hal demi upacara pernikahan."}, {"jp": "これは<ruby>漢字<rt>かんじ</rt></ruby>を<ruby>練習<rt>れんしゅう</rt></ruby>するための<ruby>本<rt>ほん</rt></ruby>です。", "id": "Ini adalah buku untuk latihan kanji."}, {"jp": "<ruby>健康<rt>けんこう</rt></ruby>になるために、<ruby>毎日<rt>まいにち</rt></ruby><ruby>運動<rt>うんどう</rt></ruby>しています。", "id": "Saya olahraga setiap hari demi menjadi sehat."}], "jlpt": []}, {"id": 55, "title": "55. ため（に） (karena; disebabkan oleh)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ＋な\nKata Benda - ＋の", "penjelasan": "menyatakan penyebab atau alasan suatu kejadian.", "tips": "sama dengan から・ので, dan juga partikel で", "examples": [{"jp": "<ruby>大雨<rt>おおあめ</rt></ruby>のため、<ruby>試合<rt>しあい</rt></ruby>が<ruby>中止<rt>ちゅうし</rt></ruby>になりました。", "id": "Karena hujan deras, pertandingan dibatalkan."}, {"jp": "<ruby>事故<rt>じこ</rt></ruby>のために<ruby>電車<rt>でんしゃ</rt></ruby>が<ruby>遅<rt>おく</rt></ruby>れている。", "id": "Karena kecelakaan, kereta jadi terlambat."}, {"jp": "<ruby>体調<rt>たいちょう</rt></ruby>が<ruby>悪<rt>わる</rt></ruby>かったため、<ruby>学校<rt>がっこう</rt></ruby>を<ruby>休<rt>やす</rt></ruby>みました。", "id": "Karena kondisi badan kurang baik, saya tidak masuk sekolah."}], "jlpt": []}, {"id": 56, "title": "56. （の）に (untuk; cocok untuk)", "rumus": "Kata Kerja - VKamus ＋の\nKata Benda - ＋に", "penjelasan": "menyatakan alat, sarana, atau kondisi yang berguna/tepat untuk melakukan sesuatu.", "tips": "", "examples": [{"jp": "かみを<ruby>切<rt>き</rt></ruby>るのに、はさみを<ruby>使<rt>つか</rt></ruby>います。", "id": "Untuk memotong rambut, digunakan gunting."}, {"jp": "<ruby>東京<rt>とうきょう</rt></ruby>はモールが<ruby>多<rt>おお</rt></ruby>いので、<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>するのに<ruby>便利<rt>べんり</rt></ruby>です。", "id": "Karena Tokyo punya banyak mall, sangat praktis untuk berbelanja."}, {"jp": "このカバンは<ruby>大<rt>おお</rt></ruby>きいので、<ruby>旅行<rt>りょこう</rt></ruby>にいいです。", "id": "Tas ini besar, jadi cocok untuk bepergian."}, {"jp": "<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>するのに、このアプリが<ruby>便利<rt>べんり</rt></ruby>です。", "id": "Aplikasi ini berguna untuk belajar bahasa Jepang."}, {"jp": "この<ruby>道具<rt>どうぐ</rt></ruby>は<ruby>家具<rt>かぐ</rt></ruby>を<ruby>直<rt>なお</rt></ruby>すのに<ruby>使<rt>つか</rt></ruby>います。", "id": "Alat ini digunakan untuk memperbaiki furnitur."}], "jlpt": []}, {"id": 57, "title": "57. だけ (hanya; cuma; saja)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Benda - ✅\nKata Sifat i - ✅ (jarang digunakan)\nKata Sifat na - ＋な (jarang digunakan)", "penjelasan": "menyatakan batas jumlah atau pilihan, artinya “hanya...” atau “sebatas itu saja.”", "tips": "bisa dipakai pada kalimat positif maupun negatif, berbeda dengan しか〜ない yang selalu negatif.", "examples": [{"jp": "そのみかんを<ruby>一<rt>ひと</rt></ruby>つだけください。", "id": "Tolong beri saya jeruk itu satu saja."}, {"jp": "<ruby>英語<rt>えいご</rt></ruby>を<ruby>使<rt>つか</rt></ruby>う<ruby>国<rt>くに</rt></ruby>はアメリカだけじゃないです。", "id": "Negara yang menggunakan bahasa Inggris bukan hanya Amerika saja."}, {"jp": "これだけが<ruby>残<rt>のこ</rt></ruby>っている。", "id": "Hanya ini saja yang tersisa."}], "jlpt": []}, {"id": 58, "title": "58. しか〜ない (hanya; cuma; saja)", "rumus": "Kata Kerja - VKamus\nKata Benda", "penjelasan": "menyatakan bahwa hanya ada satu pilihan, atau bahwa jumlahnya sangat terbatas.", "tips": "selalu dipasangkan dengan bentuk negatif, tapi artinya tetap \"hanya\".\n(bukan \"tidak hanya\" × )", "examples": [{"jp": "<ruby>一人<rt>ひとり</rt></ruby>しか<ruby>来<rt>き</rt></ruby>ませんでした。", "id": "Hanya satu orang yang datang."}, {"jp": "<ruby>千円<rt>せんえん</rt></ruby>しか<ruby>持<rt>も</rt></ruby>っていません。", "id": "Saya hanya punya seribu yen."}, {"jp": "ひらがなを<ruby>使<rt>つか</rt></ruby>う<ruby>国<rt>くに</rt></ruby>は<ruby>日本<rt>にほん</rt></ruby>しかないです。", "id": "Negara yang menggunakan hiragana hanya Jepang saja."}, {"jp": "この<ruby>島<rt>しま</rt></ruby>のひとびとは<ruby>魚<rt>さかな</rt></ruby>しか<ruby>食<rt>た</rt></ruby>べられません。", "id": "Orang-orang di pulau ini hanya bisa makan ikan."}, {"jp": "これしか<ruby>残<rt>のこ</rt></ruby>っていない。", "id": "Hanya ini saja yang tersisa."}], "jlpt": []}, {"id": 59, "title": "59. Vて + Aksi utama (dengan ; dalam keadaan)", "rumus": "Kata Kerja - Vて　＋Kata Kerja lain", "penjelasan": "menyatakan bahwa suatu tindakan dilakukan dalam kondisi atau keadaan tertentu.", "tips": "ini terasa sama seperti fungsi て \"urutan kejadian\", dan walaupun sebenarnya ada perbedaan, anggap saja sama biar gampang.", "examples": [{"jp": "<ruby>靴<rt>くつ</rt></ruby>を<ruby>脱<rt>ぬ</rt></ruby>いで<ruby>部屋<rt>へや</rt></ruby>に<ruby>入<rt>はい</rt></ruby>ります。", "id": "Masuk ke ruangan dengan melepas sepatu.\n(masuk ke dalam ruangan dalam keadaan tidak memakai sepatu)"}, {"jp": "<ruby>帽子<rt>ぼうし</rt></ruby>をかぶって<ruby>外<rt>そと</rt></ruby>に<ruby>出<rt>で</rt></ruby>ました。", "id": "Saya keluar rumah dengan memakai topi.\n(atau bisa diartikan : \"saya memakai topi kemudian keluar rumah\")"}, {"jp": "メガネをかけて<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みました。", "id": "Saya membaca buku dengan memakai kacamata."}, {"jp": "パジャマを<ruby>着<rt>き</rt></ruby>て<ruby>寝<rt>ね</rt></ruby>ました。", "id": "Saya tidur dengan mengenakan piyama."}], "jlpt": []}, {"id": 60, "title": "60. Vないで + Aksi utama (tanpa melakukan)", "rumus": "Kata Kerja - Vないで　＋V", "penjelasan": "menyatakan bahwa suatu tindakan dilakukan dalam kondisi atau keadaan tertentu.", "tips": "", "examples": [{"jp": "<ruby>今日<rt>きょう</rt></ruby>は<ruby>携帯<rt>けいたい</rt></ruby><ruby>電話<rt>でんわ</rt></ruby>を<ruby>持<rt>も</rt></ruby>たないで<ruby>出<rt>で</rt></ruby>かけました。", "id": "Hari ini saya pergi tanpa membawa ponsel."}, {"jp": "くつをはかないで<ruby>外<rt>そと</rt></ruby>に<ruby>出<rt>で</rt></ruby>るのは<ruby>危<rt>あぶ</rt></ruby>ないです。", "id": "Keluar rumah tanpa memakai sepatu itu berbahaya."}, {"jp": "<ruby>雨<rt>あめ</rt></ruby>なのに、<ruby>傘<rt>かさ</rt></ruby>をささないで<ruby>歩<rt>ある</rt></ruby>いていたので、ぬれてしまいました。", "id": "Padahal sedang hujan, tapi karena saya berjalan tanpa memakai payung, saya jadi basah."}], "jlpt": []}, {"id": 61, "title": "61. ずに (tanpa melakukan)", "rumus": "Kata Kerja - Vない（ない diganti jadi ずに）\n＊する → せずに", "penjelasan": "menyatakan bahwa suatu tindakan dilakukan tanpa melakukan hal lain terlebih dahulu.", "tips": "sama artinya dengan 〜ないで, tapi lebih formal / tertulis.", "examples": [{"jp": "<ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>何<rt>なに</rt></ruby>も<ruby>言<rt>い</rt></ruby>わずに<ruby>部屋<rt>へや</rt></ruby>を<ruby>出<rt>で</rt></ruby>て<ruby>行<rt>い</rt></ruby>った。", "id": "Dia keluar dari kamar tanpa mengatakan apa pun."}, {"jp": "<ruby>私<rt>わたし</rt></ruby>はいつも<ruby>朝<rt>あさ</rt></ruby>ごはんを<ruby>食<rt>た</rt></ruby>べずに<ruby>会社<rt>かいしゃ</rt></ruby>へ<ruby>行<rt>い</rt></ruby>く。", "id": "Saya selalu pergi ke kantor tanpa sarapan."}, {"jp": "<ruby>彼<rt>かれ</rt></ruby>は<ruby>一度<rt>いちど</rt></ruby>も<ruby>休<rt>やす</rt></ruby>まずに<ruby>毎日<rt>まいにち</rt></ruby><ruby>働<rt>はたら</rt></ruby>いている。", "id": "Dia bekerja setiap hari tanpa pernah libur sekalipun."}], "jlpt": []}, {"id": 62, "title": "62. そうです (kelihatannya; sepertinya; kelihatannya akan; sepertinya akan)", "rumus": "Kata Kerja - Vます\n＊ます dihilangkan\nKata Sifat i - い dihilangkan\nKata Sifat na - ✅ (tanpa tambahan apapun)", "penjelasan": "menyatakan kesan atau prediksi pembicara berdasarkan apa yang dilihat langsung.", "tips": "bukan dari mendengar info, tapi dari pengamatan visual.", "examples": [{"jp": "あ、テーブルの<ruby>上<rt>うえ</rt></ruby>のコップが<ruby>落<rt>お</rt></ruby>ちそうですよ。", "id": "Eh, gelas di atas meja itu sepertinya akan jatuh."}, {"jp": "ジョンさんは<ruby>心配<rt>しんぱい</rt></ruby>そうに<ruby>電話<rt>でんわ</rt></ruby>で<ruby>話<rt>はな</rt></ruby>しています。", "id": "John berbicara di telepon dengan wajah yang terlihat cemas."}, {"jp": "<ruby>夏休<rt>なつやす</rt></ruby>みには<ruby>国<rt>くに</rt></ruby>へ<ruby>帰<rt>かえ</rt></ruby>れそうです。", "id": "Sepertinya saya bisa pulang ke negara asal saat liburan musim panas."}, {"jp": "<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>りそうです。", "id": "Kelihatannya akan hujan."}, {"jp": "このケーキ、<ruby>美味<rt>おい</rt></ruby>しそうですね。", "id": "Kue ini kelihatannya enak, ya."}, {"jp": "その<ruby>箱<rt>はこ</rt></ruby>は<ruby>重<rt>おも</rt></ruby>そうですね。", "id": "Kotak itu kelihatan berat, ya."}], "jlpt": []}, {"id": 63, "title": "63. そうです (katanya)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅ (tetap pakai い)\nKata Sifat na - ＋だ\nKata Benda - ＋だ", "penjelasan": "menyampaikan informasi yang didengar dari orang lain atau sumber lain.", "tips": "hati-hati jangan sampai tertukar dengan そうです「kelihatannya」.\nPerhatikan rumusnya : そうです「katanya」pakai Bentuk Biasa.", "examples": [{"jp": "<ruby>新聞<rt>しんぶん</rt></ruby>で<ruby>読<rt>よ</rt></ruby>みましたが、<ruby>駅前<rt>えきまえ</rt></ruby>で<ruby>火事<rt>かじ</rt></ruby>があったそうですね。", "id": "Saya baca di koran, katanya ada kebakaran di depan stasiun ya."}, {"jp": "<ruby>先輩<rt>せんぱい</rt></ruby>の<ruby>話<rt>はなし</rt></ruby>では、この<ruby>試験<rt>しけん</rt></ruby>はあまり<ruby>難<rt>むずか</rt></ruby>しくないそうだよ。", "id": "Menurut cerita senior, katanya ujian ini tidak terlalu sulit."}, {"jp": "<ruby>天気<rt>てんき</rt></ruby><ruby>予報<rt>よほう</rt></ruby>によると、<ruby>明日<rt>あした</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>いそうです。", "id": "Menurut ramalan cuaca, katanya besok akan dingin."}, {"jp": "<ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>るそうです。", "id": "Katanya besok akan hujan."}, {"jp": "<ruby>彼<rt>かれ</rt></ruby>は<ruby>外国<rt>がいこく</rt></ruby><ruby>人<rt>じん</rt></ruby>だそうです。", "id": "Katanya dia orang asing."}, {"jp": "<ruby>田中<rt>たなか</rt></ruby>さんは<ruby>今日<rt>きょう</rt></ruby><ruby>休<rt>やす</rt></ruby>むそうです。", "id": "Katanya Tanaka-san hari ini libur."}], "jlpt": []}, {"id": 64, "title": "64. ようです (sepertinya; kayaknya)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ＋な\nKata Benda - ＋の", "penjelasan": "menyatakan kesimpulan atau dugaan pembicara berdasarkan pengamatan langsung maupun tidak langsung, intuisi, situasi, atau informasi tertentu.", "tips": "fokus pada dugaan yang berdasarkan dari kesimpulan hasil pengamatan atau informasi.", "examples": [{"jp": "この<ruby>肉<rt>にく</rt></ruby>は<ruby>少<rt>すこ</rt></ruby>し<ruby>古<rt>ふる</rt></ruby>いようです。", "id": "Daging ini sepertinya sudah agak lama. (berdasarkan bau, warna, dsb)"}, {"jp": "けん<ruby>君<rt>くん</rt></ruby>は<ruby>本<rt>ほん</rt></ruby>が<ruby>好<rt>す</rt></ruby>きなようですね。", "id": "Sepertinya Ken suka buku ya. (mungkin pembicara sering lihat Ken sering baca buku atau punya banyak buku)"}, {"jp": "お<ruby>母<rt>かあ</rt></ruby>さん、<ruby>玄関<rt>げんかん</rt></ruby>に<ruby>誰<rt>だれ</rt></ruby>か<ruby>来<rt>き</rt></ruby>たようだよ。", "id": "Ibu, sepertinya ada seseorang datang ke pintu depan. (mungkin karena ada bayangan di depan jendela dekat pintu)"}, {"jp": "<ruby>彼<rt>かれ</rt></ruby>はまだ<ruby>帰<rt>かえ</rt></ruby>ってきていないようです。", "id": "Kelihatannya dia belum pulang. (mungkin karena lampu di rumahnya tidak ada yang menyala)"}, {"jp": "あの<ruby>建物<rt>たてもの</rt></ruby>は<ruby>病院<rt>びょういん</rt></ruby>のようです。", "id": "Bangunan itu kayaknya rumah sakit. (mungkin pembicara lihat ada ambulans masuk ke parkiran bangunan tersebut)"}], "jlpt": []}, {"id": 65, "title": "65. みたいです (sepertinya; kayaknya)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ✅ (tanpa tambahan)\nKata Benda - ✅ (tanpa tambahan)", "penjelasan": "menyatakan kesimpulan atau dugaan pembicara berdasarkan pengamatan tidak langsung, intuisi, situasi, atau informasi tertentu.", "tips": "sama seperti ようです, hanya berbeda pada rumusnya saja.", "examples": [{"jp": "この<ruby>肉<rt>にく</rt></ruby>は<ruby>少<rt>すこ</rt></ruby>し<ruby>古<rt>ふる</rt></ruby>いみたいです。", "id": "Daging ini sepertinya sudah agak lama. (berdasarkan bau, warna, dsb)"}, {"jp": "けん<ruby>君<rt>くん</rt></ruby>は<ruby>本<rt>ほん</rt></ruby>が<ruby>好<rt>す</rt></ruby>きみたいですね。", "id": "Sepertinya Ken suka buku ya. (mungkin pembicara sering lihat Ken sering baca buku atau punya banyak buku)"}, {"jp": "お<ruby>母<rt>かあ</rt></ruby>さん、<ruby>玄関<rt>げんかん</rt></ruby>に<ruby>誰<rt>だれ</rt></ruby>か<ruby>来<rt>き</rt></ruby>たみたいだよ。", "id": "Ibu, sepertinya ada seseorang datang ke pintu depan. (mungkin karena ada bayangan di depan jendela dekat pintu)"}, {"jp": "<ruby>彼<rt>かれ</rt></ruby>はまだ<ruby>帰<rt>かえ</rt></ruby>ってきていないみたいです。", "id": "Kelihatannya dia belum pulang. (mungkin karena lampu di rumahnya tidak ada yang menyala)"}, {"jp": "あの<ruby>建物<rt>たてもの</rt></ruby>は<ruby>病院<rt>びょういん</rt></ruby>みたいです。", "id": "Bangunan itu kayaknya rumah sakit. (mungkin pembicara lihat ada ambulans masuk ke parkiran bangunan tersebut)"}], "jlpt": []}, {"id": 66, "title": "66. はずです (seharusnya; harusnya sih)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ＋な\nKata Benda - ＋の", "penjelasan": "menyatakan bahwa pembicara yakin sesuatu seharusnya benar, karena ada alasan logis atau informasi pendukung.", "tips": "bukan dugaan visual, tapi kesimpulan berdasarkan fakta, jadwal, aturan, situasi, atau logika.", "examples": [{"jp": "", "id": "３"}, {"jp": "<ruby>時<rt>じ</rt></ruby>の<ruby>飛行機<rt>ひこうき</rt></ruby>ですから、<ruby>母<rt>はは</rt></ruby>はもう<ruby>飛行機<rt>ひこうき</rt></ruby>に<ruby>乗<rt>の</rt></ruby>ったはずです。", "id": "Karena pesawatnya jam 3, ibuku seharusnya sudah naik pesawat."}, {"jp": "<ruby>明日<rt>あした</rt></ruby>の<ruby>会<rt>かい</rt></ruby>には<ruby>山川<rt>やまかわ</rt></ruby><ruby>先生<rt>せんせい</rt></ruby>も<ruby>出席<rt>しゅっせき</rt></ruby>するはずです。", "id": "Yamakawa-sensei juga seharusnya (akan) hadir di pertemuan besok."}, {"jp": "<ruby>食<rt>た</rt></ruby>べてみて。<ruby>新鮮<rt>しんせん</rt></ruby>な<ruby>魚<rt>さかな</rt></ruby>だから、<ruby>美味<rt>おい</rt></ruby>しいはずだよ。", "id": "Coba makan deh. Karena ikannya segar, seharusnya enak."}, {"jp": "あの<ruby>店<rt>みせ</rt></ruby>、<ruby>今日<rt>きょう</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みのはずですよ。", "id": "Toko itu seharusnya hari ini libur."}, {"jp": "そこは<ruby>安全<rt>あんぜん</rt></ruby>なはずです。", "id": "Tempat itu seharusnya aman."}], "jlpt": []}, {"id": 67, "title": "67. らしいです (katanya)", "rumus": "Kata Kerja - Bentuk Biasa\nKata Sifat i - ✅\nKata Sifat na - ✅\nKata Benda - ✅", "penjelasan": "menyampaikan informasi yang didengar dari orang lain, atau rumor yang beredar.", "tips": "gayanya lebih kasual dan netral dibanding 〜そうです（katanya）.", "examples": [{"jp": "<ruby>事故<rt>じこ</rt></ruby>があったらしいです。", "id": "Katanya terjadi kecelakaan."}, {"jp": "うわさによると、あのホテルはあまり<ruby>良<rt>よ</rt></ruby>くないらしいよ。", "id": "Menurut rumor, hotel itu katanya tidak begitu bagus."}, {"jp": "<ruby>聞<rt>き</rt></ruby>いた<ruby>話<rt>はなし</rt></ruby>では、あの<ruby>山<rt>やま</rt></ruby>にはさるがいるらしいです。", "id": "Dari cerita yang saya dengar, katanya ada monyet di gunung itu."}, {"jp": "<ruby>田中<rt>たなか</rt></ruby>さんは<ruby>来週<rt>らいしゅう</rt></ruby><ruby>引<rt>ひ</rt></ruby>っ<ruby>越<rt>こ</rt></ruby>すらしいよ。", "id": "Katanya Tanaka-san akan pindah rumah minggu depan."}, {"jp": "あの<ruby>映画<rt>えいが</rt></ruby>、すごく<ruby>面白<rt>おもしろ</rt></ruby>いらしい。", "id": "Katanya film itu sangat menarik."}, {"jp": "<ruby>山川<rt>やまかわ</rt></ruby><ruby>先生<rt>せんせい</rt></ruby>は<ruby>来年<rt>らいねん</rt></ruby><ruby>結婚<rt>けっこん</rt></ruby>するらしいよ。", "id": "Katanya Yamakawa-sensei akan menikah tahun depan."}], "jlpt": []}, {"id": 68, "title": "68. にする (memilih; menentukan)", "rumus": "Kata Benda", "penjelasan": "menyatakan keputusan atau pilihan yang dibuat oleh subjek.", "tips": "biasanya muncul dalam konteks memesan makanan, menentukan waktu/kegiatan, atau membuat pilihan sehari-hari.", "examples": [{"jp": "<ruby>飲<rt>の</rt></ruby>み<ruby>物<rt>もの</rt></ruby>はコーヒーにします。", "id": "Saya pilih kopi untuk minumannya."}, {"jp": "<ruby>次<rt>つぎ</rt></ruby>の<ruby>会議<rt>かいぎ</rt></ruby>は<ruby>午後<rt>ごご</rt></ruby>にしましょう。", "id": "Mari kita jadwalkan rapat berikutnya di sore hari."}, {"jp": "ホテルは<ruby>安<rt>やす</rt></ruby>いところにしました。", "id": "Saya memilih tempat yang murah untuk hotelnya."}, {"jp": "デザートはアイスクリームにします。", "id": "Saya memilih es krim untuk dessert."}, {"jp": "<ruby>誕生<rt>たんじょう</rt></ruby><ruby>日<rt>び</rt></ruby>プレゼントはこの<ruby>時計<rt>とけい</rt></ruby>にします。", "id": "Saya memutuskan memilih jam tangan ini sebagai hadiah ulang tahun."}], "jlpt": []}, {"id": 69, "title": "69. ことにする (memutuskan untuk melakukan)", "rumus": "Kata Kerja - VKamus\nKata Kerja - Vない", "penjelasan": "menyatakan keputusan yang dibuat oleh pembicara sendiri.", "tips": "する bisa diubah ke bentuk lampau kalau keputusannya sudah dibuat\n(biasanya memang lebih sering digunakan dalam bentuk lampau ことにした atau ことにしました).", "examples": [{"jp": "<ruby>今日<rt>きょう</rt></ruby>は<ruby>外<rt>そと</rt></ruby>で<ruby>食<rt>た</rt></ruby>べることにする。", "id": "Hari ini saya akan putuskan untuk makan di luar."}, {"jp": "<ruby>来月<rt>らいげつ</rt></ruby>、<ruby>日本<rt>にほん</rt></ruby>へ<ruby>行<rt>い</rt></ruby>くことにしました。", "id": "Saya memutuskan untuk pergi ke Jepang bulan depan."}, {"jp": "<ruby>疲<rt>つか</rt></ruby>れているので、<ruby>早<rt>はや</rt></ruby>く<ruby>寝<rt>ね</rt></ruby>ることにした。", "id": "Karena saya lelah, saya memutuskan untuk tidur lebih awal."}, {"jp": "たくさん<ruby>食<rt>た</rt></ruby>べたから、<ruby>夕<rt>ゆう</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>抜<rt>ぬ</rt></ruby>くことにした。Karena sudah makan banyak, saya memutuskan untuk skip makan malam. (ご飯を抜く = tidak makan, skip makan)", "id": ""}], "jlpt": []}, {"id": 70, "title": "70. になる・ことになる (diputuskan bahwa)", "rumus": "Kata Kerja - VKamus\nKata Kerja - Vない\nKata Benda ＋になる (tanpa こと)", "penjelasan": "menyatakan keputusan atau perubahan yang ditentukan di luar kendali pembicara.\natau bisa juga keputusan dari pembicara + orang lain.", "tips": "bunpou ini lebih sering tidak ditranslate, jadi pastikan kalian paham dengan fungsinya.\nkeputusannya biasanya datang dari pihak luar, sistem, atau keadaan.\nbisa juga digunakan jika yang membuat keputusan adalah pembicara dan orang lain, contohnya seperti memutuskan untuk menikah.", "examples": [{"jp": "<ruby>来月<rt>らいげつ</rt></ruby>、<ruby>転勤<rt>てんきん</rt></ruby>することになりました。", "id": "Diputuskan bahwa saya akan pindah tugas bulan depan. (tidak ada kata \"diputuskan bahwa\" juga tidak masalah)"}, {"jp": "<ruby>来年<rt>らいねん</rt></ruby>、<ruby>結婚<rt>けっこん</rt></ruby>することになった。", "id": "Kami memutuskan untuk menikah tahun depan."}, {"jp": "このプロジェクトは<ruby>中止<rt>ちゅうし</rt></ruby>することになった。", "id": "Proyek ini sudah diputuskan untuk dibatalkan."}, {"jp": "<ruby>旅行<rt>りょこう</rt></ruby>の<ruby>出発<rt>しゅっぱつ</rt></ruby><ruby>日<rt>び</rt></ruby>は8<ruby>月<rt>がつ</rt></ruby>", "id": "30"}, {"jp": "<ruby>日<rt>にち</rt></ruby>になった。", "id": "Tanggal keberangkatan perjalanan diputuskan menjadi tanggal 30 Agustus."}, {"jp": "<ruby>新<rt>あたら</rt></ruby>しい<ruby>商品<rt>しょうひん</rt></ruby>にいろんな<ruby>問題<rt>もんだい</rt></ruby>があって、<ruby>販売<rt>はんばい</rt></ruby>しないことになった。", "id": "Karena ada berbagai masalah pada produk baru, diputuskan untuk tidak menjualnya."}], "jlpt": []}, {"id": 71, "title": "71. がします (terdengar; tercium; terasa)", "rumus": "音・声・味・におい・香り ＋ がします", "penjelasan": "menyatakan sesuatu yang dirasakan melalui indra, seperti suara, bau, atau rasa.", "tips": "pada N3 ada beberapa kotoba tambahan yang bisa digunakan seperti 予感, 気, dan 感じ.", "examples": [{"jp": "<ruby>犬<rt>いぬ</rt></ruby>の<ruby>声<rt>こえ</rt></ruby>がしますね。", "id": "Terdengar suara anjing ya."}, {"jp": "ここは<ruby>変<rt>へん</rt></ruby>な<ruby>匂<rt>にお</rt></ruby>いがしますね。", "id": "Tempat ini tercium bau aneh ya."}, {"jp": "どんな<ruby>味<rt>あじ</rt></ruby>がするか、<ruby>食<rt>た</rt></ruby>べてみました。", "id": "Saya coba makan untuk mengetahui rasanya seperti apa."}, {"jp": "<ruby>隣<rt>となり</rt></ruby>の<ruby>部屋<rt>へや</rt></ruby>から<ruby>音<rt>おと</rt></ruby>がします。", "id": "Terdengar suara dari kamar sebelah."}, {"jp": "キッチンからカレーの<ruby>香<rt>かお</rt></ruby>りがします。", "id": "Tercium aroma kari dari dapur."}], "jlpt": []}, {"id": 72, "title": "72. てみます (mencoba melakukan)", "rumus": "Kata Kerja - Vて", "penjelasan": "mencoba melakukan sesuatu untuk melihat hasilnya atau demi pengalaman.", "tips": "sering digabungkan dengan bunpou lain seperti 〜てください、〜たい、Vおうよう、dll.\njadi harus jeli melihat keberadaan bunpou ini.", "examples": [{"jp": "この<ruby>料理<rt>りょうり</rt></ruby>を<ruby>食<rt>た</rt></ruby>べてみてください。", "id": "Tolong coba makan masakan ini."}, {"jp": "<ruby>一度<rt>いちど</rt></ruby><ruby>京都<rt>きょうと</rt></ruby>へ<ruby>行<rt>い</rt></ruby>ってみたい。", "id": "Saya ingin mencoba pergi ke Kyoto sekali saja."}, {"jp": "くつを<ruby>買<rt>か</rt></ruby>う<ruby>前<rt>まえ</rt></ruby>にはいてみます。", "id": "Sebelum membeli sepatu, saya akan mencoba memakai dulu."}, {"jp": "<ruby>日本語<rt>にほんご</rt></ruby>で<ruby>話<rt>はな</rt></ruby>してみます。", "id": "Saya akan coba berbicara dalam bahasa Jepang."}, {"jp": "<ruby>新<rt>あたら</rt></ruby>しいゲームをやってみました。", "id": "Saya sudah coba memainkan game baru."}], "jlpt": []}, {"id": 73, "title": "73. ておきます (melakukan sesuatu sebagai persiapan untuk kegiatan lain)", "rumus": "Kata Kerja - Vて", "penjelasan": "melakukan sesuatu sebelumnya sebagai persiapan, atau membiarkan sesuatu tetap dalam keadaan tertentu.", "tips": "", "examples": [{"jp": "<ruby>荷物<rt>にもつ</rt></ruby>をかばんに<ruby>入<rt>い</rt></ruby>れておきます。", "id": "Saya akan memasukkan barang ke dalam tas terlebih dahulu. (berarti tasnya akan digunakan nanti)"}, {"jp": "ゴミを<ruby>外<rt>そと</rt></ruby>に<ruby>出<rt>だ</rt></ruby>しておきましょう。", "id": "Ayo kita keluarkan sampah ke luar dulu. (berarti nanti akan dibawa ke tempat pembuangan, tapi untuk saat ini ditaruh di luar saja dulu)"}, {"jp": "<ruby>窓<rt>まど</rt></ruby>はそのまま<ruby>開<rt>あ</rt></ruby>けておいてください。", "id": "Tolong biarkan jendelanya tetap terbuka. (ada tujuan tertentu kenapa jendelanya dibiarkan terbuka)"}, {"jp": "<ruby>会議<rt>かいぎ</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>に<ruby>資料<rt>しりょう</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでおきます。", "id": "Saya akan membaca materi sebelum rapat. (sebagai persiapan rapat)"}, {"jp": "この<ruby>書類<rt>しょるい</rt></ruby>は<ruby>明日<rt>あした</rt></ruby><ruby>使<rt>つか</rt></ruby>うので、<ruby>机<rt>つくえ</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>に<ruby>置<rt>お</rt></ruby>いておきます。", "id": "Karena dokumen ini akan dipakai besok, saya akan meletakkannya di atas meja."}, {"jp": "<ruby>使<rt>つか</rt></ruby>った<ruby>道具<rt>どうぐ</rt></ruby>は<ruby>元<rt>もと</rt></ruby>の<ruby>場所<rt>ばしょ</rt></ruby>に<ruby>戻<rt>もど</rt></ruby>しておいてください。", "id": "Tolong kembalikan alat yang telah digunakan ke tempat semula."}], "jlpt": []}, {"id": 74, "title": "74. てあります (keadaan hasil dari tadoushi)", "rumus": "Kata Kerja - Vて", "penjelasan": "menyatakan keadaan yang merupakan hasil dari tindakan Kata Kerja Tadoushi.", "tips": "suatu tindakan telah dilakukan dan hasilnya tetap ada sampai sekarang.\nbunpou ini hanya bisa digunakan dengan Tadoushi.\nKata Kerja Tadoushi yang memiliki pasangan Jidoushi, tetap BISA menggunakan bunpou ini.", "examples": [{"jp": "もうホテルを<ruby>予約<rt>よやく</rt></ruby>してあります。", "id": "Hotelnya sudah dipesan."}, {"jp": "あ、<ruby>花<rt>はな</rt></ruby>がきれいにかざってありますね。", "id": "Wah, bunganya dipajang dengan cantik ya. (dan sampai sekarang bunganya masih ada menjadi hiasan di sana)"}, {"jp": "<ruby>黒板<rt>こくばん</rt></ruby>に<ruby>予定<rt>よてい</rt></ruby>が<ruby>書<rt>か</rt></ruby>いてあります。", "id": "Jadwal telah ditulis di papan tulis. (dan masih tertulis sampai sekarang)"}, {"jp": "テストに<ruby>名前<rt>なまえ</rt></ruby>が<ruby>書<rt>か</rt></ruby>いてありませんでした。", "id": "Nama tidak tertulis di lembar ujian."}, {"jp": "<ruby>部屋<rt>へや</rt></ruby>の<ruby>電気<rt>でんき</rt></ruby>がつけてあります。", "id": "Lampu kamar sudah dinyalakan. (dan masih menyala sekarang)"}, {"jp": "テーブルの<ruby>上<rt>うえ</rt></ruby>にコップが<ruby>置<rt>お</rt></ruby>いてあります。", "id": "Gelas telah diletakkan di atas meja. (dan masih ada di sana)"}, {"jp": "<ruby>会場<rt>かいじょう</rt></ruby>には<ruby>椅子<rt>いす</rt></ruby>が<ruby>並<rt>なら</rt></ruby>べてあります。", "id": "Kursi-kursi telah disusun di tempat acara. (dan masih tersusun sekarang)"}], "jlpt": []}, {"id": 75, "title": "75. てしまいます (menyelesaikan sesuatu)", "rumus": "Kata Kerja - Vて", "penjelasan": "menekankan bahwa suatu tindakan telah diselesaikan secara penuh/ sampai tuntas.", "tips": "digunakan dalam bentuk lampau :  : 〜てしまいました・〜てしまった・〜ちゃった", "examples": [{"jp": "<ruby>今日<rt>きょう</rt></ruby><ruby>買<rt>か</rt></ruby>った<ruby>本<rt>ほん</rt></ruby>はもう<ruby>読<rt>よ</rt></ruby>んでしまった。", "id": "Buku yang saya beli hari ini sudah saya baca sampai habis."}, {"jp": "<ruby>全部<rt>ぜんぶ</rt></ruby><ruby>宿題<rt>しゅくだい</rt></ruby>をやってしまいました。", "id": "Saya sudah mengerjakan semua PR sampai selesai."}], "jlpt": []}, {"id": 76, "title": "76. てしまいます (penyesalan atau kecewa)", "rumus": "Kata Kerja - Vて", "penjelasan": "menyampaikan perasaan menyesal atau kecewa atas sesuatu yang sudah terjadi.", "tips": "digunakan dalam bentuk lampau :  : 〜てしまいました・〜てしまった・〜ちゃった", "examples": [{"jp": "<ruby>友達<rt>ともだち</rt></ruby>にひどいことを<ruby>言<rt>い</rt></ruby>っちゃった。", "id": "Saya menyesal telah mengatakan hal yang kasar kepada teman."}, {"jp": "<ruby>試験<rt>しけん</rt></ruby>に<ruby>不合格<rt>ふごうかく</rt></ruby>になってしまった。", "id": "Saya tidak lulus ujian.\n(kecewa)"}], "jlpt": []}, {"id": 77, "title": "77. てしまいます (tidak sengaja)", "rumus": "Kata Kerja - Vて", "penjelasan": "digunakan saat sesuatu terjadi tanpa disengaja.", "tips": "digunakan dalam bentuk lampau :  : 〜てしまいました・〜てしまった・〜ちゃった", "examples": [{"jp": "<ruby>電車<rt>でんしゃ</rt></ruby>で<ruby>寝<rt>ね</rt></ruby>てしまって、<ruby>降<rt>お</rt></ruby>りる<ruby>駅<rt>えき</rt></ruby>を<ruby>通<rt>とお</rt></ruby>り<ruby>過<rt>す</rt></ruby>ぎました。", "id": "Saya ketiduran di kereta dan melewati stasiun tempat turun."}, {"jp": "<ruby>道<rt>みち</rt></ruby>で<ruby>石<rt>いし</rt></ruby>をふんで<ruby>転<rt>ころ</rt></ruby>んでしまった。", "id": "Saya tidak sengaja tersandung dan jatuh setelah menginjak batu di jalan."}, {"jp": "<ruby>大事<rt>だいじ</rt></ruby>なメールを<ruby>削除<rt>さくじょ</rt></ruby>してしまいました。", "id": "Saya tidak sengaja telah menghapus email penting."}], "jlpt": []}, {"id": 78, "title": "78. てしまいます (peringatan halus)", "rumus": "Kata Kerja - Vて", "penjelasan": "peringatan halus kepada lawan bicara kalau sesuatu akan dilakukan atau terjadi.", "tips": "bentuk normal : 〜てしまいます・〜てしまう・〜ちゃう", "examples": [{"jp": "あ、<ruby>白<rt>しろ</rt></ruby>い<ruby>服<rt>ふく</rt></ruby>が<ruby>汚<rt>よご</rt></ruby>れてしまいますよ。", "id": "Eh, bajunya yang putih bisa kotor lho."}, {"jp": "<ruby>片付<rt>かたづ</rt></ruby>けないと、<ruby>全部<rt>ぜんぶ</rt></ruby><ruby>捨<rt>す</rt></ruby>てちゃうよ？", "id": "Kalau kamu nggak beresin, aku buang semua lho!"}, {"jp": "<ruby>名前<rt>なまえ</rt></ruby>を<ruby>書<rt>か</rt></ruby>かないと、<ruby>他<rt>ほか</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>に<ruby>食<rt>た</rt></ruby>べられちゃうよ？", "id": "Kalau kamu gak tulis nama, nanti dimakan sama orang lain lho!"}], "jlpt": []}, {"id": 79, "title": "79. ように (agar; supaya)", "rumus": "Kata Kerja - VKamus\nKata Kerja - Vない", "penjelasan": "menyatakan tujuan atau harapan, agar sesuatu terjadi atau agar seseorang melakukan sesuatu.", "tips": "berbeda dengan ために,... ように biasanya dipakai dengan Kata Kerja Potensial, Bentuk ない, atau Jidoushi.", "examples": [{"jp": "けがをしないように、<ruby>気<rt>き</rt></ruby>をつけてね。", "id": "Hati-hati ya, supaya tidak terluka."}, {"jp": "いい<ruby>風<rt>かぜ</rt></ruby>が<ruby>入<rt>はい</rt></ruby>るように、<ruby>窓<rt>まど</rt></ruby>を<ruby>大<rt>おお</rt></ruby>きく<ruby>開<rt>あ</rt></ruby>けた。", "id": "Saya membuka jendela lebar-lebar agar angin segar bisa masuk."}, {"jp": "<ruby>話<rt>はなし</rt></ruby>がよく<ruby>聞<rt>き</rt></ruby>こえるように、<ruby>前<rt>まえ</rt></ruby>の<ruby>方<rt>ほう</rt></ruby>に<ruby>座<rt>すわ</rt></ruby>りましょう。", "id": "Mari duduk di depan agar bisa mendengar pembicaraan dengan jelas."}], "jlpt": []}, {"id": 80, "title": "80. ように＋言う、伝える、など (menyampaikan permintaan, perintah, larangan, saran, atau himbauan)", "rumus": "Kata Kerja - VKamus\nKata Kerja - Vない\nPada umumnya yang paling sering digunakan adalah ように.\nTapi kalian boleh menambahkan と setelah ように menjadi ようにと, atau bahkan meng
